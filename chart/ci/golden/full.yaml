  sampling.test.ts: |
    import assert from "node:assert/strict";
    import { test } from "node:test";
    import { FLEET_SAMPLING_BY_THINKING_LEVEL } from "./sampling.ts";
    
    // #657: mechanical tiers are deterministic-lean; reasoning tiers inherit.
    test("fleet sampling policy pins low tiers and leaves reasoning tiers to model defaults", () => {
    	assert.deepEqual(
    		Object.keys(FLEET_SAMPLING_BY_THINKING_LEVEL).sort(),
    		["low", "minimal", "off"],
    	);
    	for (const level of ["off", "minimal", "low"] as const) {
    		assert.deepEqual(FLEET_SAMPLING_BY_THINKING_LEVEL[level], { temperature: 0.2, top_p: 0.9 });
    	}
    	assert.equal("medium" in FLEET_SAMPLING_BY_THINKING_LEVEL, false);
    	assert.equal("high" in FLEET_SAMPLING_BY_THINKING_LEVEL, false);
    });
    
  sampling.ts: |
    /**
     * Fleet sampling policy (#657): pi's `samplingParamsByThinkingLevel`
     * (1.0.2+) lets a fleet pin sampling per pi thinking level. Harmostes
     * nodes express intent via thinking level (RPC `set_thinking_level`) —
     * mechanical tiers (off/minimal/low) must not inherit creative-default
     * sampling; medium and above keep model defaults (key omitted — pi
     * merges per key, missing levels inherit). Applied uniformly by
     * index.ts at model registration: the ONE choke point every litellm
     * model crosses, immune to proxy routing-table drift.
     */
    export const FLEET_SAMPLING_BY_THINKING_LEVEL = {
    	off: { temperature: 0.2, top_p: 0.9 },
    	minimal: { temperature: 0.2, top_p: 0.9 },
    	low: { temperature: 0.2, top_p: 0.9 },
    } as const;
    
  thinking.test.ts: |
    import assert from "node:assert/strict";
    import { test } from "node:test";
    import { ANTHROPIC_THINKING_LEVELS, deserializeThinking, wireThinkingMap } from "./thinking.ts";
    
    test("every level's map value is the exact wire object, serialized", () => {
    	const map = wireThinkingMap();
    	assert.deepEqual(Object.keys(map).sort(), Object.keys(ANTHROPIC_THINKING_LEVELS).sort());
    	for (const [level, obj] of Object.entries(ANTHROPIC_THINKING_LEVELS)) {
    		assert.deepEqual(JSON.parse(map[level]), obj, `level ${level}`);
    	}
    	// off is a hard disable — the deployment must be able to switch
    	// reasoning OFF, not merely shrink it
    	assert.deepEqual(ANTHROPIC_THINKING_LEVELS.off, { type: "disabled" });
    	// budgets are positive and ordered
    	const budgets = ["minimal", "low", "medium", "high", "max"].map(
    		(l) => (ANTHROPIC_THINKING_LEVELS[l] as { budget_tokens: number }).budget_tokens,
    	);
    	for (let i = 1; i < budgets.length; i++) assert.ok(budgets[i] > budgets[i - 1]);
    });
    
    test("deserializeThinking parses our envelope onto the wire", () => {
    	const map = wireThinkingMap();
    	const out = deserializeThinking({ model: "group", thinking: map.low, messages: [] });
    	assert.notEqual(out, undefined);
    	assert.deepEqual((out as { thinking: object }).thinking, { type: "enabled", budget_tokens: 2048 });
    	const off = deserializeThinking({ thinking: map.off });
    	assert.deepEqual((off as { thinking: object }).thinking, { type: "disabled" });
    });
    
    test("deserializeThinking leaves foreign payloads untouched", () => {
    	// foreign string (a bare level name — some other provider's dialect)
    	assert.equal(deserializeThinking({ thinking: "high" }), undefined);
    	// already an object (someone upstream set it)
    	assert.equal(deserializeThinking({ thinking: { type: "disabled" } }), undefined);
    	// absent thinking
    	assert.equal(deserializeThinking({ model: "g" }), undefined);
    	// non-object payload
    	assert.equal(deserializeThinking("nope"), undefined);
    	assert.equal(deserializeThinking(null), undefined);
    });
    
    test("a malformed envelope never throws and never corrupts", () => {
    	assert.equal(deserializeThinking({ thinking: '{"type"' }), undefined);
    	assert.equal(deserializeThinking({ thinking: '{"type":"explode"}' }), undefined);
    	assert.equal(deserializeThinking({ thinking: '{"type":"enabled","budget_tokens":-5}' }), undefined);
    	assert.equal(deserializeThinking({ thinking: '{"type":"enabled"}' }), undefined);
    });
    
    test("a rewritten payload preserves every other field", () => {
    	const map = wireThinkingMap();
    	const payload = {
    		model: "some-group",
    		messages: [{ role: "user", content: "hi" }],
    		stream: true,
    		thinking: map.medium,
    	};
    	const out = deserializeThinking(payload) as Record<string, unknown>;
    	assert.equal(out.model, "some-group");
    	assert.equal(out.stream, true);
    	assert.deepEqual(out.messages, payload.messages);
    });
    
  thinking.ts: |
    /**
     * Thinking-wire translation for the mtplx-class engines (2026-10-28).
     *
     * MEASURED ECONOMICS (rhesadox#2833 round, 36 messages on the pinned
     * speed engine): decode ≈ 7.3 tok/s median, and 27,239 of 34,065 decoded
     * tokens (~80%) were REASONING — the qwen3.8 hybrid thinks by default
     * and the round spent ~52 of 82 request-minutes decoding reasoning.
     * The kernel declared `reasoning: false`, so pi dropped the template's
     * thinking level entirely and the engine reasoned UNBOUNDED.
     *
     * The engine (anthropic-route through LiteLLM) accepts exactly ONE
     * thinking control shape on the openai-completions wire — the anthropic
     * OBJECT:
     *
     *     {"type":"disabled"} | {"type":"enabled","budget_tokens":N}
     *
     * Measured live 2026-10-28: the object bounds/disables reasoning on BOTH
     * served routes (mtplx speed group AND the zai glm-5.3-flash fallback
     * group). Everything else is silently ignored: `reasoning_effort` barely
     * dents it, `enable_thinking`, `chat_template_kwargs`, string `thinking`
     * and numeric budget fields do nothing.
     *
     * pi's ThinkingLevelMap values are STRING-typed, so the objects travel
     * as JSON text in the level map and `before_provider_request` parses
     * them back onto the wire — the whole template knob chain
     * (workflowTemplates.*.agent.thinking → pi --thinking → this rewrite)
     * becomes real for this fleet. Deployment picks the LEVEL
     * (k8s-config, ADR-0011 Amendment); the kernel owns the wire shape.
     */
    
    export type AnthropicThinking =
    	| { type: "disabled" }
    	| { type: "enabled"; budget_tokens: number };
    
    /** The fleet's level→wire table (boundaries: off is a hard disable). */
    export const ANTHROPIC_THINKING_LEVELS: Record<string, AnthropicThinking> = {
    	off: { type: "disabled" },
    	minimal: { type: "enabled", budget_tokens: 1024 },
    	low: { type: "enabled", budget_tokens: 2048 },
    	medium: { type: "enabled", budget_tokens: 8192 },
    	high: { type: "enabled", budget_tokens: 16384 },
    	max: { type: "enabled", budget_tokens: 32768 },
    };
    
    /**
     * The ThinkingLevelMap to register per model: each value is the wire
     * object SERIALIZED. pi stringifies nothing itself — the map value is
     * sent verbatim as `params.thinking`, and `deserializeThinking` (the
     * before_provider_request handler) parses the envelope back onto the
     * wire. Unknown levels fall through pi's `?? level` and are left as a
     * bare string — which this engine ignores harmlessly (measured).
     */
    export function wireThinkingMap(): Record<string, string> {
    	return Object.fromEntries(
    		Object.entries(ANTHROPIC_THINKING_LEVELS).map(([level, obj]) => [level, JSON.stringify(obj)]),
    	);
    }
    
    /**
     * before_provider_request rewrite: a payload whose `thinking` is one of
     * our serialized envelopes gets the parsed object; ANYTHING else
     * (foreign strings, already-object payloads, absent thinking, non-object
     * payloads) passes through UNCHANGED (undefined = keep, the extension
     * contract). A malformed envelope must never take down the request —
     * unparsable values are left alone, never thrown.
     */
    export function deserializeThinking(payload: unknown): unknown | undefined {
    	if (typeof payload !== "object" || payload === null) return undefined;
    	const p = payload as Record<string, unknown>;
    	if (typeof p.thinking !== "string" || !p.thinking.startsWith('{"type"')) return undefined;
    	try {
    		const parsed = JSON.parse(p.thinking) as AnthropicThinking;
    		if (
    			parsed?.type === "disabled" ||
    			(parsed?.type === "enabled" && typeof parsed.budget_tokens === "number" && parsed.budget_tokens > 0)
    		) {
    			return { ...p, thinking: parsed };
    		}
    	} catch {
    		// malformed envelope — leave the payload untouched
    	}
    	return undefined;
    }
    

