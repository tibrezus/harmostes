{{- if .Values.ui.enabled }}
# RBAC for harmostes-ui, right-sized to the ADR-0012 §5 write path: the UI
# creates thin Workflow instances (owner label stamped from the authenticated
# session — every created workflow is visible to its creator) and reads the
# catalogs owner-scoped. Lifecycle mutations (update/patch/delete) return
# with their own ADR-0012 issues (#418/#419) — until then the verbs are not
# granted. Isolation is code-enforced: handlers filter by harmostes.dev/owner.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.ui.serviceAccount }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/component: ui
---
# The schema endpoint (GET /api/schema, ADR-0012 §2) serves the CRDs'
# openAPIV3Schema read live from the cluster. CRDs are cluster-scoped, so
# this needs a ClusterRole — narrowed by resourceNames to exactly the two
# harmostes CRDs and to the single verb the endpoint uses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harmostes-ui-crd-reader
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/component: ui
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - workflows.harmostes.dev
      - workflowtemplates.harmostes.dev
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harmostes-ui-crd-reader
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/component: ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harmostes-ui-crd-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.ui.serviceAccount }}
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harmostes-ui
  namespace: {{ .Values.namespace }}
rules:
  # Workflows: the full self-service lifecycle (ADR-0012 §5/§7, #418):
  # create (composition) + enable/disable/trigger (arming + the manual wake
  # annotation) + delete (instance removal). Reads stay owner-scoped in the
  # handlers; k8s RBAC cannot express ownership, so verbs are granted here
  # and isolation is enforced per-object in the UI's guard chain.
  - apiGroups: ["harmostes.dev"]
    resources: ["workflows"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Read attempts (observability-first primary view — Attempt timeline).
  - apiGroups: ["harmostes.dev"]
    resources: ["attempts"]
    verbs: ["get", "list"]
  # Read workflow templates (the creation form's catalog; resolution reads).
  - apiGroups: ["harmostes.dev"]
    resources: ["workflowtemplates"]
    verbs: ["get", "list"]
  # Read jobs (run history, filtered by owner label)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  # Read pods + pod logs (run detail log viewer). Pods are looked up
  # by job-name label; logs are streamed from the worker container. Access is
  # gated by the workflow owner-label check in the run-detail handler.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  # Deliberately ABSENT privilege (PR #427 review P1):
  #  - no `pipelines` rule: the canvas was dismantled AND the resource with
  #    it — chart/crds ships no pipelines CRD and no Go type exists.
  #  - no `watch` verb: the UI runs a direct, non-cached client and never
  #    calls Watch — live updates arrive via the daprd event sidecar.
  #  - no secrets / externalsecrets rules: the per-user token manager was
  #    pruned (#291); credential sync is chart-rendered ExternalSecrets
  #    (ADR-0011). Verbs are granted only when a route needs them, never
  #    speculatively.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harmostes-ui
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.ui.serviceAccount }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: harmostes-ui
  apiGroup: rbac.authorization.k8s.io
{{- end }}
