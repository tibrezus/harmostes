# Source: harmostes/templates/worker-cache.yaml
# Shared tool-cache claim (#336): mounted by per-Attempt Jobs (spec.cache.pvc:
# harmostes-worker-cache) at /cache/<workflow-name> — SubPath-isolated per
# workflow. ReadWriteMany: concurrent review Jobs of one repo share the warm
# GOCACHE/GOMODCACHE (go's cache is concurrency-safe). The jobs run as the
# worker image's user; with NFS root-squash the claim needs an fsGroup or
# no_root_squash export — mounts succeed either way, writes fail loudly if not.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harmostes-worker-cache
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/component: worker-cache
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: "5Gi"

---
# Source: harmostes/templates/ui-rbac.yaml
# The schema endpoint (GET /api/schema, ADR-0012 §2) serves the CRDs'
# openAPIV3Schema read live from the cluster. CRDs are cluster-scoped, so
# this needs a ClusterRole — narrowed by resourceNames to exactly the two
# harmostes CRDs and to the single verb the endpoint uses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Release-unique: dev and prod share one cluster, and identically-named
  # cluster-scoped objects from two Helm releases fight over subjects —
  # the losing release's UI SA loses /api/schema (#549). The namespace
  # discriminates the releases.
  name: harmostes-ui-crd-reader-harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/component: ui
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - workflows.harmostes.dev
      - workflowtemplates.harmostes.dev
    verbs: ["get"]

