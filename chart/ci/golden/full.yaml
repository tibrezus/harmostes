apiVersion: apps/v1
kind: Deployment
metadata:
  name: harmostes-worker-pool
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/component: worker-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harmostes
      app.kubernetes.io/component: worker-pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harmostes
        app.kubernetes.io/component: worker-pool
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "harmostes-worker-pool"
        dapr.io/app-port: "8084"
        dapr.io/config: harmostes-config
        dapr.io/enable-actors: "true"
        dapr.io/sidecar-image: "ghcr.io/rezuscloud/daprd:otel-metrics-latest-amd64"
        dapr.io/env: "OTEL_EXPORTER_OTLP_INSECURE=true"
    spec:
      serviceAccountName: harmostes-controller
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: sync-skills
          image: "ghcr.io/tibrezus/harmostes-worker:0.4.2"
          imagePullPolicy: Always
          # #407: the repo URL travels as env data and the script references it
          # quoted as "$HARMOSTES_SKILLS_REPO" — POSIX shells never re-parse
          # expansion results as operators, so a crafted values.skills.repo
          # cannot execute shell in the pod. #408 item 9: values.skills.rev
          # pins the served revision the same way ("$HARMOSTES_SKILLS_REV",
          # fetch+checkout when non-empty). Byte-identical literal to
          # internal/k8s.skillsSyncCommand (Go side, per-Attempt Jobs).
          # tokenSecret: the helper string is fixed path-only data (the token
          # itself is read from the mounted file at credential time by git's
          # helper shell — never interpolated into this literal).
          command: ["sh", "-c", "git clone --depth 1 \"$HARMOSTES_SKILLS_REPO\" /tmp/agents && { [ -z \"$HARMOSTES_SKILLS_REV\" ] || { git -C /tmp/agents fetch --depth 1 origin \"$HARMOSTES_SKILLS_REV\" && git -C /tmp/agents checkout --detach FETCH_HEAD; }; } && mkdir -p /skills && cp -r /tmp/agents/skills/. /skills/ && { echo \"[sync-skills] served skills revision: $(git -C /tmp/agents rev-parse HEAD)\"; (find /skills -name 'SKILL.md' | sort | xargs -r sha256sum > /skills/.manifest) || echo \"[sync-skills] manifest write failed (non-fatal)\"; true; }"]
          env:
            - name: HARMOSTES_SKILLS_REPO
              value: "https://github.com/tibrezus/agents.git"
            - name: HARMOSTES_SKILLS_REV
              value: "f7fdf227b5c4252cf8a02ebc798862ead4af72a8"
          volumeMounts:
            - name: skills
              mountPath: /skills
      containers:
        - name: worker
          image: "ghcr.io/tibrezus/harmostes-worker:0.4.2"
          imagePullPolicy: Always
          # Explicit subcommand (ADR-0007 phase 2): the pool pod is the
          # consumer + dispatcher; its children and the per-Attempt Job pods
          # run `harmostes-worker run`.
          args: ["consumer"]
          ports:
            - name: app-port
              containerPort: 8084
          env:
            - name: HARMOSTES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HARMOSTES_CONSUMER_PORT
              value: "8084"
            # ── Dispatcher knobs (ADR-0007 phase 3) ──
            - name: HARMOSTES_MAX_CONCURRENT
              value: "5"
            # Leg-2 fast path: sweep cadence for ARMED-not-dispatched
            # claims — CI-green dispatches within one tick. "0" = off.
            - name: HARMOSTES_GATE_FASTPOLL
              value: "30s"
            - name: HARMOSTES_CANCEL_ON_SUPERSEDE
              value: "true"
            - name: HARMOSTES_JOB_TTL_SECONDS
              value: "3600"
            - name: HARMOSTES_WORKER_IMAGE
              value: "ghcr.io/tibrezus/harmostes-worker:0.4.2"
            - name: HARMOSTES_SERVICE_ACCOUNT
              value: harmostes-controller
            - name: HARMOSTES_DAPRD_IMAGE
              value: "ghcr.io/rezuscloud/daprd:otel-metrics-latest-amd64"
            - name: HARMOSTES_EXTRA_CONFIGMAP_MOUNTS
              value: "fork-maintenance-scripts=/workspace/scripts=0755,fork-maintenance-checks=/workspace/checks=0755,fork-maintenance-defs=/workspace/forks=0644,fork-maintenance-hooks=/workspace/post-merge-hooks=0755"
            - name: HARMOSTES_PUBSUB_NAME
              value: "pubsub"
            - name: HARMOSTES_TRIGGER_TOPIC
              value: "harmostes-triggers"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # #613: arms the worker's dapr sidecar startup guard — a pod the
            # injector skipped (failurePolicy:Ignore during dapr-system churn)
            # fails fast + self-deletes for re-admission instead of serving
            # hours with webhooks/state/timeline silently dead.
            - name: HARMOSTES_DAPR_REQUIRED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "signoz-otel-collector.signoz.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            # Credentials — the consumer-exec'd one-shot worker inherits
            # these env vars. They mirror the secrets the controller injects
            # into Job-based workers (workerEnv). Per-user tokens are not
            # supported in pool mode (Phase 3 will carry them via TriggerEvent).
            - name: HARMOSTES_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harmostes-github-token
                  key: token
            # CLI aliases — the review agents drive gh/fj/glab directly
            # (inline review protocol); the CLIs read these exact names.
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harmostes-github-token
                  key: token
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harmostes-forgejo-token
                  key: token
                  # OPTIONAL (r28): a GitHub-only install has no forge secret —
                  # a hard ref would crash-loop the pool. Forge-hosted reviews
                  # need it out-of-band (ops-managed via ExternalSecret from
                  # BSM); without it review posting on git.rezus.cloud fails.
                  optional: true
            # The reviewer's comment-scoped posting credential (#680).
            # FORWARDED TO REVIEW ATTEMPTS ONLY (dispatch drops the name for
            # any other objective kind) — presence in a session env IS the
            # arming signal. In an armed session the spawn filter is
            # FAIL-CLOSED: every allowlisted variable NOT in the explicit
            # safe set (worker.SpawnSafeEnv: the LLM trio, the budget
            # numbers, the skills pins, this token) is dropped, and the
            # CLI-canonical names (GH_TOKEN/GITHUB_TOKEN/FORGEJO_TOKEN) are
            # RE-BOUND to this scoped value — the CLIs authenticate, but can
            # only do what a comment-scoped token allows: post/reply/resolve
            # threads, never approve, merge, or push. OPTIONAL: absent =
            # unarmed, the historical env and batch publishing.
            - name: HARMOSTES_REVIEW_POST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harmostes-review-post-token
                  key: token
                  optional: true
            # Served-skills single source (#441): passed to the dispatcher so
            # per-Attempt Jobs' sync-skills init containers clone the SAME
            # repo the pool's own init container does. Empty = the Go default
            # (internal/k8s.DefaultSkillsRepo — kept equal to values.skills.repo).
            - name: HARMOSTES_SKILLS_REPO
              value: "https://github.com/tibrezus/agents.git"
            # #408 item 9: the dispatcher passes the pinned rev through so
            # per-Attempt Jobs serve the SAME revision the pool serves.
            - name: HARMOSTES_SKILLS_REV
              value: "f7fdf227b5c4252cf8a02ebc798862ead4af72a8"
            # Skills-repo auth (private agents repo): the dispatcher forwards
            # the ESO-synced secret NAME to BuildJob, which mounts it into
            # each per-Attempt Job's sync-skills init container. Empty =
            # anonymous clone.
            - name: HARMOSTES_SKILLS_TOKEN_SECRET
              value: ""
            # GH_TOKEN deliberately aliases the same secret the dispatch path
            # already mounts as HARMOSTES_GIT_TOKEN — the gh CLI wants its
            # canonical name; one credential, one secret, two env spellings.
            - name: HARMOSTES_RZC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: harmostes-rzc-token
                  key: username
            - name: HARMOSTES_RZC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harmostes-rzc-token
                  key: password
            # Forgejo PAT (git.rezus.cloud): token-scheme API auth + token-
            # embedded git URLs — basic-auth passwords are rejected (forgejo#2809).
            - name: HARMOSTES_FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harmostes-forgejo-token
                  key: token
            - name: LITELLM_URL
              valueFrom:
                secretKeyRef:
                  name: harmostes-litellm-token
                  key: url
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harmostes-litellm-token
                  key: key
            # Turn-budget extension's hard tool-call cap (#484) — forwarded to
            # attempt Jobs via the dispatch allowlist. Empty = uncapped.
            - name: PI_TOOL_BUDGET
              value: "32"
            # The finalize lane: post-cap bash commands touching any of these
            # substrings still execute (the agent must always be able to
            # write its output artifact — v1's missing-write-tool failure).
            - name: PI_TOOL_BUDGET_ALLOW
              value: "/workspace/review.json"
            # Mid-budget checkpoint (#487): one blocked call at this count
            # with a converge-now instruction. "0" off; empty = cap/2.
            - name: PI_TOOL_BUDGET_NUDGE
              value: "16"
          volumeMounts:
            - name: skills
              mountPath: /skills
            - name: workspace
              mountPath: /workspace
            - name: fork-scripts
              mountPath: /workspace/scripts
              readOnly: true
            - name: fork-checks
              mountPath: /workspace/checks
              readOnly: true
            - name: fork-defs
              mountPath: /workspace/forks
              readOnly: true
            - name: fork-hooks
              mountPath: /workspace/post-merge-hooks
              readOnly: true
            # No /plugins/fork-maintenance-plugins mount: fork-sync is a
            # worker-image built-in since ADR-0011; the engine payload rides at
            # /workspace. A plugin ConfigMap here had no producer in the chart
            # and was an instant CreateContainerConfigError (r1 review, P3).
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: skills
          emptyDir: {}
        - name: workspace
          emptyDir: {}
        - name: fork-scripts
          configMap:
            name: fork-maintenance-scripts
            defaultMode: 0755
        - name: fork-checks
          configMap:
            name: fork-maintenance-checks
            defaultMode: 0755
        - name: fork-defs
          configMap:
            name: fork-maintenance-defs
            defaultMode: 0644
        - name: fork-hooks
          configMap:
            name: fork-maintenance-hooks
            defaultMode: 0755

