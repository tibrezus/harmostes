# Golden-render fixture (#368-8) — a production-SHAPED but fictional values
# file that exercises every gated template layer in one render:
# fork-maintenance consumers (phase 4: the engine itself rides the template
# repo), the conflict resolver (with its checksum annotations), credentials,
# and the MR-bridge env. Phase 4 (#792): zero templates, zero task texts.
#
# `make golden-update` renders this into chart/ci/golden/full.yaml; CI diffs
# a fresh render against the committed golden, so any rendered-output change
# — intended or accidental — shows up as a reviewable diff instead of a
# 3 a.m. runtime surprise. The fixture is deliberately fictional (golden
# upstream/fork hosts) so it can never be mistaken for a real fleet def.
#
# Chart-version labels (helm.sh/chart, app.kubernetes.io/version) are filtered
# out of the golden — they change every release and carry no information.
namespace: harmostes-ci

# Phase 4 (#792): the engine payload + defs ride the template repo / config
# tier — the chart renders only consumers. The fixture keeps forkMaintenance
# enabled to exercise the consumer render (mounts + env + resolver).
forkMaintenance:
  enabled: true
  resolver:
    enabled: true
    # Decision field with an obviously-test value — this fixture is the
    # deployment for the golden render (ADR-0011 Amendment).
    model: litellm/test/golden-resolver

# Phase 4 (#792): workflowTemplates are repo-delivered — the fixture
# carries none; the chart renders zero templates by construction.

credentials:
  - name: golden-token
    template:
      type: Opaque
    data:
      - secretKey: token
        remoteRef:
          key: GOLDEN_TOKEN
      - secretKey: url
        remoteRef:
          key: GOLDEN_URL

# ui.templateSource (#420): the MR bridge's env rendering — JSON source
# config + token secretKeyRef — is pinned in the golden like every other
# gated layer. The bridge proposes MRs against the template git source; it
# never writes templates in-cluster (the RBAC gate enforces that shape).
ui:
  templateSource:
    host: github
    owner: golden-username
    repo: golden-harmostes
    baseBranch: main
    path: chart/values.yaml
    valuesKey: workflowTemplates
    secretName: golden-ui-source-token
    secretKey: token

# worker.cache (#336): exercised so the golden locks the PVC template's shape
# (RWX, size, conditional storageClass) — the disabled render is byte-stable
# by construction (the template renders nothing).
worker:
  cache:
    enabled: true
    size: 5Gi
  # Fleet-wide AGENT SESSION cap (owner directive 2026-11-04): the fixture
  # exercises the rendered env so the golden locks the knob's shape. A
  # fictional number, obviously-test (a shape pin, not a fleet decision —
  # the deployment decides the real cap).
  job:
    agentSessionCap: "2"
  # Failover deadline (owner directive 2026-11-14, reactiveness): rendered
  # as LITELLM_PRIMARY_TIMEOUT_S — the proxy-side shift bound the
  # litellm-provider attaches to chained models (timeout + num_retries 0).
  # A fictional number for the shape pin; the deployment decides the real
  # deadline (100 in prod/dev — strictly under pi's 2-minute HTTP wall).
  litellmPrimaryTimeoutS: "77"
