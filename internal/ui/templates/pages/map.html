{{- $wf := .WorkflowName -}}
<div class="view-description">
	<strong>Map</strong> — System topology. The pipeline graph for the selected workflow, with live run status overlaid on each node.
</div>
<div class="map-view">
	<div class="map-graph-container" id="cytoscape-map"></div>
	<div class="map-details" id="map-details"></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
	{{- if $wf}}
	var graphUrl = '/api/workflows/{{.WorkflowName}}/graph';
	var sseUrl = '/api/pipelines/{{.WorkflowName}}/events';
	var templateMode = false;
	{{- else}}
	var graphUrl = null;
	var sseUrl = null;
	var templateMode = false;
	{{- end}}
	if (window.initHarmostesMap) {
		window.initHarmostesMap('cytoscape-map', graphUrl, sseUrl, templateMode);
	}
});
</script>
