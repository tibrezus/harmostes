---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflowtemplates.harmostes.dev
  labels:
    app.kubernetes.io/name: harmostes
spec:
  group: harmostes.dev
  names:
    kind: WorkflowTemplate
    listKind: WorkflowTemplateList
    plural: workflowtemplates
    singular: workflowtemplate
    shortNames:
      - wftemplate
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - description
                - prepare
                - agent
                - deploy
              properties:
                description:
                  type: string
                prepare:
                  type: object
                  properties:
                    plugin:
                      type: object
                      properties:
                        name:
                          type: string
                agent:
                  type: object
                  properties:
                    model:
                      type: string
                    skill:
                      type: string
                    tools:
                      type: array
                      items:
                        type: string
                    taskTemplate:
                      type: object
                      properties:
                        name:
                          type: string
                    maxFixes:
                      type: integer
                      minimum: 1
                    gate:
                      type: object
                      properties:
                        plugin:
                          type: object
                          properties:
                            name:
                              type: string
                deploy:
                  type: object
                  properties:
                    plugin:
                      type: object
                      properties:
                        name:
                          type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Description
          type: string
          jsonPath: .spec.description
        - name: Prepare
          type: string
          jsonPath: .spec.prepare.plugin.name
        - name: Gate
          type: string
          jsonPath: .spec.agent.gate.plugin.name
        - name: Deploy
          type: string
          jsonPath: .spec.deploy.plugin.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
