# Source: harmostes/templates/fork-conflict-resolver.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fork-conflict-resolver
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: fork-conflict-resolver
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fork-conflict-resolver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fork-conflict-resolver
      annotations:
        # ConfigMap-only changes must roll this pod too: it is Recreate with a
        # fixed image tag, so a scripts/skill/defs/extension change would
        # otherwise leave the old pod serving stale engine code forever
        # (stale-pod-wins; #368-1). Checksums cover everything the pod mounts:
        # the fork-maintenance.yaml template output (scripts/checks/defs/
        # hooks/skill CMs) and the litellm extension payload.
        checksum/fork-maintenance: 082d8c5472ee15b9beacfd112a46beff3f5121af68d95f1af2eadb6fd64372f4
        checksum/litellm-extension: b48e7a02c4d911c0def232e6c0cf41528c4cac8cec9bc6e19c65627688f48be1
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: resolver
          image: "ghcr.io/tibrezus/llm-wiki-controller:0.3.0"
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Register the litellm-provider pi extension (mounted at
              # /extensions/litellm-provider) so resolve-conflict.sh's agent can
              # use litellm/* models. The worker image bakes this into the image;
              # the resolver image doesn't, so write it at startup.
              mkdir -p /root/.pi/agent &&
              printf '%s\n' '{"packages":["/extensions/litellm-provider"]}' > /root/.pi/agent/settings.json &&
              # Note: the worker image additionally bakes npm:pi-searxng; the
              # resolver image does not and startup `pi install` would add an
              # npm-registry dependency at pod start. Conflict resolution is
              # git surgery, not web research — no searxng here is deliberate.
              exec python3 /workspace/scripts/conflict-subscriber.py
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NAMESPACE
              value: harmostes-ci
            - name: RESOLVER_SCRIPT
              value: /workspace/scripts/resolve-conflict.sh
            - name: MAINT_DIR
              value: /workspace
            # harmostes — the shared pi RPC orchestrator (downloaded on startup)
            - name: HARMOSTES
              value: python3 /usr/local/bin/harmostes.py
            - name: SKILL_PATH
              value: /workspace/skill/SKILL.md
            # The model id MUST carry the litellm/ provider prefix — the
            # provider is registered by the mounted litellm-provider extension;
            # an unqualified default (the script's own fallback) is unreachable
            # under these settings (r1 review, P4).
            - name: RESOLVER_MODEL
              value: "litellm/zai/glm-4.7"
            - name: HOME
              value: /root
            # LiteLLM proxy (pi + litellm/* via litellm-provider extension)
            - name: LITELLM_URL
              valueFrom:
                secretKeyRef:
                  name: harmostes-litellm-token
                  key: url
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harmostes-litellm-token
                  key: key
            # Host PAT (git push/PR/merge)
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harmostes-github-token
                  key: token
            # GH_TOKEN authenticates the `gh` CLI (read automatically by gh).
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harmostes-github-token
                  key: token
          resources:
            limits:
              cpu: "2"
              memory: 8Gi
            requests:
              cpu: 200m
              memory: 1Gi
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: scripts, mountPath: /workspace/scripts, readOnly: true }
            - { name: checks,  mountPath: /workspace/checks, readOnly: true }
            - { name: defs,    mountPath: /workspace/forks, readOnly: true }
            - { name: hooks,   mountPath: /workspace/post-merge-hooks, readOnly: true }
            - { name: skill,   mountPath: /workspace/skill, readOnly: true }
            - { name: litellm-ext, mountPath: /extensions/litellm-provider, readOnly: true }
            - { name: manifests, mountPath: /workspace/manifests }
            - { name: home,    mountPath: /root }
      volumes:
        - name: scripts
          configMap: { name: fork-maintenance-scripts, defaultMode: 0755 }
        - name: checks
          configMap: { name: fork-maintenance-checks, defaultMode: 0755 }
        - name: defs
          configMap: { name: fork-maintenance-defs }
        - name: hooks
          configMap: { name: fork-maintenance-hooks, defaultMode: 0755 }
        - name: skill
          configMap:
            name: fork-maintenance-skill
            items:
              - { key: SKILL.md, path: SKILL.md }
              - { key: conflict-resolution.md, path: references/conflict-resolution.md }
              - { key: safeguards.md, path: references/safeguards.md }
              - { key: architecture.md, path: references/architecture.md }
        - name: manifests
          emptyDir: {}
        - name: litellm-ext
          configMap:
            name: litellm-provider-extension
        - name: home
          emptyDir: {}

