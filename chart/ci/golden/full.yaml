# Source: harmostes/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harmostes-controller
  namespace: harmostes-ci
rules:
  - apiGroups: ["harmostes.dev"]
    resources: ["workflows", "workflows/status", "workflows/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pipeline CRs (graph-native platform — G1+). Worker reads Pipeline CRs to
  # execute their graph spec.
  - apiGroups: ["harmostes.dev"]
    resources: ["pipelines", "pipelines/status", "pipelines/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Attempt CRs (Canonical Orchestration History — ADR-0005). Controller
  # resolves-or-creates Attempts when scheduling a worker + records the run
  # start; worker records the run outcome + Node Result Envelopes. Both use
  # status; retention GC deletes old terminal attempts (#385 — delete verb
  # below; supersedes the earlier owner-refs-only story).
  - apiGroups: ["harmostes.dev"]
    resources: ["attempts", "attempts/status", "attempts/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"] # delete: retention GC (#385) — supersedes the owner-refs-only story above
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # #613 sidecar-guard self-heal: a pod the dapr injector skipped (admission
  # during injector downtime, failurePolicy:Ignore) cannot gain its sidecar by
  # restarting the container — the controller/worker deletes its OWN pod so
  # the ReplicaSet re-admits against a healthy injector. Namespace-scoped;
  # delete is only ever invoked with POD_NAME/HOSTNAME = this process's pod.
  - apiGroups: [""]
    resources: ["pods"]
    # list: the janitor's orphaned-runner-pod leg (#651) lists terminal
    # attempt-runner pods whose Job is gone; delete was the #613 self-heal.
    # watch: the controller-runtime pod cache (per-attempt runner tracking,
    # consume-on-completion #650) — without it the informer's watch is
    # denied, the cache never syncs, and every attempt wedges in
    # `reconciling` (observed 2026-10-06: all pr-review gates fleet-wide).
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # The recorder (mgr.GetEventRecorder, the post-deprecation events API,
  # #794) writes v1 Events: events.events.k8s.io — core "" events is the
  # LEGACY surface the old GetEventRecorderFor used. Both groups granted:
  # the AgentProfile compat refusal (#785) must be VISIBLE (kubectl events /
  # the UI), not just a controller log line (hit live on harmostes-dev:
  # "Server rejected event ... cannot create resource events.events.k8s.io").
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  # Webhook handler reads Secrets to resolve webhook.secretRef for HMAC verification.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # WorkflowTemplates — the worker resolves spec.templateRef at run start and
  # inherits prepare/agent/deploy defaults (thin Workflow instances). The
  # update/patch pair belongs to the template-history recorder (#420,
  # ADR-0012 §5): when Flux delivers a spec change, the controller records
  # the revision window into template.harmostes.dev/revisions — annotations
  # only, never spec; git stays the authoring source of truth.
  # AgentProfile (ADR-0011 amendment 2026-10-26, phase 1a): the controller
  # reads the namespace's profile at due-time to evaluate its compatibility
  # statement; the worker reads it at run start for model resolution.
  # Read-only by construction — profiles are the DEPLOYMENT's decision
  # surface (delivered via Flux), never written by the kernel.
  - apiGroups: ["harmostes.dev"]
    resources: ["agentprofiles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["harmostes.dev"]
    resources: ["workflowtemplates"]
    verbs: ["get", "list", "watch", "update", "patch"]

---
# Source: harmostes/templates/ui-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harmostes-ui
  namespace: harmostes-ci
rules:
  # Workflows: the full self-service lifecycle (ADR-0012 §5/§7, #418):
  # create (composition) + enable/disable/trigger (arming + the manual wake
  # annotation) + delete (instance removal). Reads stay owner-scoped in the
  # handlers; k8s RBAC cannot express ownership, so verbs are granted here
  # and isolation is enforced per-object in the UI's guard chain.
  - apiGroups: ["harmostes.dev"]
    resources: ["workflows"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Read attempts (observability-first primary view — Attempt timeline).
  - apiGroups: ["harmostes.dev"]
    resources: ["attempts"]
    verbs: ["get", "list"]
  # Read workflow templates (the creation form's catalog; resolution reads).
  - apiGroups: ["harmostes.dev"]
    resources: ["workflowtemplates"]
    verbs: ["get", "list"]
  # Read jobs (run history, filtered by owner label)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  # Read pods + pod logs (run detail log viewer). Pods are looked up
  # by job-name label; logs are streamed from the worker container. Access is
  # gated by the workflow owner-label check in the run-detail handler.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  # Deliberately ABSENT privilege (PR #427 review P1):
  #  - no `pipelines` rule: the canvas was dismantled AND the resource with
  #    it — chart/crds ships no pipelines CRD and no Go type exists.
  #  - no `watch` verb: the UI runs a direct, non-cached client and never
  #    calls Watch — live updates arrive via the daprd event sidecar.
  #  - no secrets / externalsecrets rules: the per-user token manager was
  #    pruned (#291); credential sync is chart-rendered ExternalSecrets
  #    (ADR-0011). Verbs are granted only when a route needs them, never
  #    speculatively.

