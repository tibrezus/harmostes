# Source: harmostes/templates/dapr.yaml
# Dapr components — the deterministic event-system application layer. State for
# skip/dedup, pub/sub for choreography + observability. Reuse the cluster Valkey
# with an isolated DB (default 3) so harmostes never crosses llm-wiki (0/1) or
# fork-maintenance (2). Swap backends by changing these Component CRs only.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: valkey.llm-wiki.svc.cluster.local:6379
    - name: redisDB
      value: "3"
    # Flat keyspace shared by every harmostes app-id (worker writes evidence,
    # UI reads it). The default keyPrefix ("app") would namespace keys per
    # sidecar app-id — harmostes-worker-pool||k vs harmostes-ui||k — making
    # cross-app state invisible (live: /timeline saw present-empty for keys
    # the worker had written). "none" also drops TTL-bound markers in flight
    # once (skip/dedup re-arm at worst); timeline evidence is TTL-ephemeral
    # anyway.
    - name: keyPrefix
      value: "none"

