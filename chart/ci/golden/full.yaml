# Source: harmostes/templates/rbac.yaml
# One ServiceAccount + Role serve both the controller (watch Workflows, create
# worker Jobs) and the worker Jobs it spawns (read ConfigMaps, patch Workflow
# status). Namespaced to harmostes-ci.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harmostes-controller
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
# Per-attempt Job pods (ADR-0007) run as this SA and inherit the pull
# secret here — the long-running Deployments carry it in their pod spec,
# but Jobs created by the dispatcher never did (#281).
imagePullSecrets:
  - name: ghcr-pull

