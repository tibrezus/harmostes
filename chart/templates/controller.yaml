# The monitor controller: always-on, watches Workflow CRs, schedules worker Jobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harmostes-controller
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harmostes
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harmostes
        app.kubernetes.io/component: controller
      {{- if .Values.observability.controllerSidecar }}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: harmostes-controller
        dapr.io/config: harmostes-config
        {{- if .Values.observability.daprdImage }}
        dapr.io/sidecar-image: {{ .Values.observability.daprdImage | quote }}
        {{- end }}
        {{- if .Values.observability.otlpInsecure }}
        dapr.io/env: "OTEL_EXPORTER_OTLP_INSECURE=true"
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.controller.serviceAccount }}
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      containers:
        - name: controller
          image: {{ .Values.image.controller }}
          imagePullPolicy: Always
          args:
            - --namespace={{ .Values.namespace }}
            {{- if .Values.observability.enabled }}
            - --otlp-endpoint={{ .Values.observability.otlpEndpoint }}
            - --otlp-insecure={{ .Values.observability.otlpInsecure }}
            {{- end }}
            - --poll-interval={{ .Values.controller.pollInterval }}
            - --trigger-topic={{ .Values.workerPool.topic | default "harmostes-triggers" }}
          env:
            - name: HARMOSTES_ATTEMPT_RETENTION
              value: {{ .Values.controller.attemptRetention | default "720h" | quote }}
            - name: HARMOSTES_WORKER_IMAGE
              value: {{ .Values.image.worker }}
            # #613: arms the controller's dapr sidecar startup guard — ONLY
            # when the sidecar itself is rendered. The requirement and the
            # injection are ONE contract: #613's guard treats a missing
            # DAPR_HTTP_PORT as a misconfiguration and self-heal-deletes the
            # pod, so arming it while observability.controllerSidecar leaves
            # the annotations unrendered boot-loops the controller forever
            # (hit live on harmostes-dev with 1.5.0: pod deleted every ~30s,
            # zero dispatches). Deployments that want the sidecar set
            # observability.controllerSidecar: true — then BOTH render, and
            # the guard protects the event system exactly as #613 designed.
            # Deployments that don't get the pre-#613 behavior: no sidecar,
            # no requirement, webhook + OTel SDK carry the controller.
            {{- if .Values.observability.controllerSidecar }}
            - name: HARMOSTES_DAPR_REQUIRED
              value: "true"
            {{- end }}
            {{- if .Values.agentProfile }}
            # ADR-0011 amendment 2026-10-26 (phase 1a): the namespace's
            # AgentProfile — its compatibility statement gates dispatch.
            - name: HARMOSTES_AGENT_PROFILE
              value: {{ .Values.agentProfile | quote }}
            {{- end }}
            {{- if .Values.observability.enabled }}
            # Controller's own OTel SDK: exports its reconcile/create-worker spans +
            # metrics (Phase 4). Without these, observability.Init is a no-op.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ .Values.observability.otlpInsecure | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
