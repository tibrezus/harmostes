# Source: harmostes/templates/controller.yaml
# The monitor controller: always-on, watches Workflow CRs, schedules worker Jobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harmostes-controller
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harmostes
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harmostes
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: harmostes-controller
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: controller
          image: ghcr.io/tibrezus/harmostes-controller:0.6.0
          imagePullPolicy: Always
          args:
            - --namespace=harmostes-ci
            - --otlp-endpoint=signoz-otel-collector.signoz.svc.cluster.local:4317
            - --otlp-insecure=true
            - --poll-interval=5m
            - --trigger-topic=harmostes-triggers
          env:
            - name: HARMOSTES_ATTEMPT_RETENTION
              value: "720h"
            - name: HARMOSTES_WORKER_IMAGE
              value: ghcr.io/tibrezus/harmostes-worker:0.4.2
            # #613: arms the controller's dapr sidecar startup guard — ONLY
            # when the sidecar itself is rendered. The requirement and the
            # injection are ONE contract: #613's guard treats a missing
            # DAPR_HTTP_PORT as a misconfiguration and self-heal-deletes the
            # pod, so arming it while observability.controllerSidecar leaves
            # the annotations unrendered boot-loops the controller forever
            # (hit live on harmostes-dev with 1.5.0: pod deleted every ~30s,
            # zero dispatches). Deployments that want the sidecar set
            # observability.controllerSidecar: true — then BOTH render, and
            # the guard protects the event system exactly as #613 designed.
            # Deployments that don't get the pre-#613 behavior: no sidecar,
            # no requirement, webhook + OTel SDK carry the controller.
            # Controller's own OTel SDK: exports its reconcile/create-worker spans +
            # metrics (Phase 4). Without these, observability.Init is a no-op.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "signoz-otel-collector.signoz.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            limits:
              cpu: 1
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi

