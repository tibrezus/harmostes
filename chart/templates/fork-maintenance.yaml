{{- $fm := .Values.forkMaintenance }}
{{- if $fm.payload }}{{- if not (eq $fm.payload "external") }}{{- fail (printf "forkMaintenance.payload must be 'external' (or empty) — chart payload mode was REMOVED in three-tier phase 4 (#792): the engine lives in tibrezus/harmostes-template-fork-maintenance and the defs in the config tier. got %q" $fm.payload) }}{{- end }}{{- end }}
# ── Fork-maintenance engine consumers (ADR-0011; phase 4: #792) ─────────────
# The engine PAYLOAD (scripts/checks/hooks/skill = code; defs = per-env data)
# is delivered by the deployment under the SAME names the mounts consume:
#   - tibrezus/harmostes-template-fork-maintenance → scripts/checks/hooks/skill
#   - the config tier (harmostes-config overlays)   → defs
# The chart renders ONLY the consumers — the worker-pool mounts +
# HARMOSTES_EXTRA_CONFIGMAP_MOUNTS + the fork-conflict-resolver mounts (those
# live in their own templates). A missing ConfigMap fails the pod at rollout
# (CreateContainerConfigError): fail-loud at the boundary, not at 3 a.m.
# One writer per object: exactly one delivery per namespace, by construction.
{{- end }}
