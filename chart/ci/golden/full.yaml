---
# Source: harmostes/templates/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/instance: harmostes

---
# Source: harmostes/templates/rbac.yaml
# One ServiceAccount + Role serve both the controller (watch Workflows, create
# worker Jobs) and the worker Jobs it spawns (read ConfigMaps, patch Workflow
# status). Namespaced to harmostes-ci.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harmostes-controller
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
# Per-attempt Job pods (ADR-0007) run as this SA and inherit the pull
# secret here — the long-running Deployments carry it in their pod spec,
# but Jobs created by the dispatcher never did (#281).
imagePullSecrets:
  - name: ghcr-pull

---
# Source: harmostes/templates/ui-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harmostes-ui
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/component: ui

---
# Source: harmostes/templates/fork-conflict-resolver.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-provider-extension
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/managed-by: Helm
# Keys are DERIVED from the directory (Files.Glob), not enumerated — a new
# source file (e.g. fallbacks.ts) rides along automatically; enumerating keys
# here is exactly how the copy went stale-incomplete the first time (r1 review,
# P2: index.ts imported fallbacks.ts that no .Files.Get ever rendered).
data:
  fallbacks.test.ts: |
    import assert from "node:assert/strict";
    import { test } from "node:test";
    import { DEFAULT_FALLBACKS, resolveFallbackChains, wiringSummary } from "./fallbacks.ts";
    
    test("no env keeps the default chain", () => {
      const { chains, warning } = resolveFallbackChains(undefined);
      assert.deepEqual(chains, DEFAULT_FALLBACKS);
      assert.equal(warning, undefined);
    });
    
    test("empty env keeps the default chain", () => {
      const { chains, warning } = resolveFallbackChains("  ");
      assert.deepEqual(chains, DEFAULT_FALLBACKS);
      assert.equal(warning, undefined);
    });
    
    test("valid override replaces the whole map", () => {
      const { chains, warning } = resolveFallbackChains('{"a/b": ["c/d"]}');
      assert.deepEqual(chains, { "a/b": ["c/d"] });
      assert.equal(warning, undefined);
    });
    
    test("unparsable JSON degrades loudly to the default", () => {
      const { chains, warning } = resolveFallbackChains("{not json");
      assert.deepEqual(chains, DEFAULT_FALLBACKS);
      assert.match(warning!, /not valid JSON/);
    });
    
    // #363: the DEFAULT table's CONTENT is load-bearing (ops review templates
    // flipped to speed primary, k8s-config 8c1fb609; this chart's values.yaml
    // default still runs flash) — the resolveFallbackChains tests above only
    // compare against the DEFAULT_FALLBACKS export itself (they flip silently
    // with any edit). The invariant is COMPOSITION, not count: every LIVE
    // primary direction must have an entry, because a chain keyed by any other
    // primary is inert (applyChains never reaches it). The index.ts header
    // drifted exactly this way once (said flash→speed while the code said
    // flash→glm) — comments are not a pin.
    test("default chain composition covers every live primary (#363, #401 r2)", () => {
      // Three live primaries in this repo: speed (ops review templates),
      // flash (this chart's values.yaml default), glm (cmd/harmostes-agent +
      // harmostes.py --model default). A live primary with no entry would
      // attach no failover at all — the condition #363 was filed to fix.
      assert.deepEqual(DEFAULT_FALLBACKS, {
        "mtplx/qwen38-27b-optimized-speed-fp16": ["ali/anthropic/qwen3.8-flash"],
        "ali/anthropic/qwen3.8-flash": ["zai/anthropic/glm-5.3-flash"],
        "zai/anthropic/glm-5.3-flash": ["ali/anthropic/qwen3.8-flash"],
      });
      // And ALL THREE wire over a proxy exposing exactly the three known
      // groups: speed keeps its own 256 KiB window (fallback LARGER — no
      // clamp, no early compaction); flash pays the documented fallback clamp
      // down to glm (128 Ki ctx / 8k out) — the pre-#363 shape, retained on
      // purpose; glm clamps nothing (flash is larger in both dimensions).
      const proxy = new Map([
        ["mtplx/qwen38-27b-optimized-speed-fp16", { max_input_tokens: 262144, max_output_tokens: 32768 }],
        ["ali/anthropic/qwen3.8-flash", { max_input_tokens: 1048576, max_output_tokens: 32768 }],
        ["zai/anthropic/glm-5.3-flash", { max_input_tokens: 131072, max_output_tokens: 8192 }],
      ]);
      const models = [...proxy.entries()].map(([id, m]) => ({ id, ...m }));
      const { annotated, wired, unwiredChains } = applyChains(models, DEFAULT_FALLBACKS, proxy);
      const speed = annotated.find((m) => m.id === "mtplx/qwen38-27b-optimized-speed-fp16")!;
      assert.deepEqual(speed.samplingParams, { fallbacks: ["ali/anthropic/qwen3.8-flash"] });
      assert.equal(speed.contextWindow, 262144); // min(262144, 1048576) = own window
      assert.equal(speed.clampNote, undefined); // no ctx/maxTokens clamp, no early compaction
      const flash = annotated.find((m) => m.id === "ali/anthropic/qwen3.8-flash")!;
      assert.deepEqual(flash.samplingParams, { fallbacks: ["zai/anthropic/glm-5.3-flash"] });
      assert.equal(flash.contextWindow, 131072); // clamped to glm — the retained #373 chain's cost
      assert.match(flash.clampNote!, /ctx 1048576→131072/);
      const glm = annotated.find((m) => m.id === "zai/anthropic/glm-5.3-flash")!;
      assert.deepEqual(glm.samplingParams, { fallbacks: ["ali/anthropic/qwen3.8-flash"] });
      assert.equal(glm.contextWindow, 131072); // own window — flash is larger, no clamp
      assert.equal(glm.clampNote, undefined);
      assert.deepEqual(wired.sort(), [
        "ali/anthropic/qwen3.8-flash → zai/anthropic/glm-5.3-flash", // wired entries are primary→fallback summaries
        "mtplx/qwen38-27b-optimized-speed-fp16 → ali/anthropic/qwen3.8-flash",
        "zai/anthropic/glm-5.3-flash → ali/anthropic/qwen3.8-flash",
      ]);
      assert.deepEqual(unwiredChains, []); // every default key is a served primary
    });
    
    // The documented off-switch, pinned (#401 review r2: it had no test at any
    // layer, while a PARTIAL override silently strips the platform decision —
    // whole-map substitution is the documented semantics, so the protection
    // for it is the composition pin above plus the summary log in index.ts
    // that distinguishes "none configured" from "configured but none wired").
    test("resolveFallbackChains: '{}' is the off-switch — empty chains, no warning", () => {
      const { chains, warning } = resolveFallbackChains("{}");
      assert.deepEqual(chains, {});
      assert.equal(warning, undefined);
    });
    
    // The default table is a deliberate SUPERSET of any one proxy's groups
    // (#401 review r3): over a 2-group proxy (the chart-default shape, where
    // speed is ops-side), exactly the speed key is reported inert and the two
    // served directions still wire — the unwired note is expected output, not
    // an alarm.
    test("applyChains: a subset proxy reports exactly the unserved key", () => {
      const two = new Map([
        ["ali/anthropic/qwen3.8-flash", { max_input_tokens: 1048576, max_output_tokens: 32768 }],
        ["zai/anthropic/glm-5.3-flash", { max_input_tokens: 131072, max_output_tokens: 8192 }],
      ]);
      const twoModels = [...two.entries()].map(([id, m]) => ({ id, ...m }));
      const { wired, unwiredChains } = applyChains(twoModels, DEFAULT_FALLBACKS, two);
      assert.deepEqual(unwiredChains, ["mtplx/qwen38-27b-optimized-speed-fp16"]);
      assert.deepEqual(wired.sort(), [
        "ali/anthropic/qwen3.8-flash → zai/anthropic/glm-5.3-flash",
        "zai/anthropic/glm-5.3-flash → ali/anthropic/qwen3.8-flash",
      ]);
    });
    
    // The summary branches are table-tested here because index.ts itself is
    // import-gate only (its factory returns early without LITELLM_URL).
    test("wiringSummary: wired / configured-but-unwired / off-switch", () => {
      assert.equal(
        wiringSummary(["a → b"], { "a": ["b"] }),
        " | fallbacks wired: a → b",
      );
      assert.equal(
        wiringSummary([], { "mtplx/x": ["ali/y"], "ali/y": ["zai/z"] }),
        " | no fallbacks wired — chains configured for: mtplx/x, ali/y",
      );
      assert.equal(
        wiringSummary([], {}),
        " | no fallbacks wired — none configured (LITELLM_FALLBACKS='{}' disables all chains)",
      );
    });
    
    // A chain keyed by a primary the proxy does not serve must SURFACE, not
    // vanish silently into "no fallbacks wired" (#401 review, pillar 7).
    test("applyChains: chain keys with an undiscovered primary are reported inert", () => {
      const served = new Map([
        ["mtplx/qwen38-27b-optimized-speed-fp16", { max_input_tokens: 262144, max_output_tokens: 32768 }],
        ["ali/anthropic/qwen3.8-flash", { max_input_tokens: 1048576, max_output_tokens: 32768 }],
      ]);
      const servedModels = [...served.entries()].map(([id, m]) => ({ id, ...m }));
      const { wired, unwiredChains } = applyChains(servedModels, {
        "mtplx/qwen38-27b-optimized-speed-fp16": ["ali/anthropic/qwen3.8-flash"],
        "ghost/group": ["mtplx/qwen38-27b-optimized-speed-fp16"],
      }, served);
      assert.deepEqual(unwiredChains, ["ghost/group"]); // the proxy does not serve it
      assert.deepEqual(wired, ["mtplx/qwen38-27b-optimized-speed-fp16 → ali/anthropic/qwen3.8-flash"]);
    });
    
    test("JSON array (not object) degrades to the default", () => {
      const { chains, warning } = resolveFallbackChains('["a/b"]');
      assert.deepEqual(chains, DEFAULT_FALLBACKS);
      assert.match(warning!, /not a JSON object/);
    });
    
    const malformedShapes = ['{"a/b": "c/d"}', '{"a/b": []}', '{"a/b": [null]}', '{"a/b": [42]}', '{"a/b": [""]}'];
    for (const raw of malformedShapes) {
      test(`semantically-bad value ${raw} degrades to the default`, () => {
        const { chains, warning } = resolveFallbackChains(raw);
        assert.deepEqual(chains, DEFAULT_FALLBACKS);
        assert.match(warning!, /not a non-empty array/);
      });
    }
    import { applyChains } from "./fallbacks.ts";
    
    const proxy = new Map([
      ["ali/anthropic/qwen3.8-flash", { max_input_tokens: 1048576, max_output_tokens: 32768 }],
      ["mtplx/qwen38-27b-optimized-speed-fp16", { max_input_tokens: 262144, max_output_tokens: 32768 }],
      ["zai/anthropic/glm-5.3-flash", { max_input_tokens: 131072, max_output_tokens: 8192 }],
    ]);
    const models = [
      { id: "ali/anthropic/qwen3.8-flash", max_input_tokens: 1048576, max_output_tokens: 32768 },
      { id: "zai/anthropic/glm-5.3-flash", max_input_tokens: 131072 },
    ];
    
    test("applyChains: unchained model carries NO fallbacks key (an explicit [] overrides proxy config)", () => {
      const { annotated, wired } = applyChains(models, {}, proxy);
      const glm = annotated.find((m) => m.id === "zai/anthropic/glm-5.3-flash")!;
      assert.equal(glm.samplingParams, undefined);
      assert.equal(wired.length, 0);
    });
    
    test("applyChains: chained model gets the chain and the min-window clamp", () => {
      const { annotated, wired } = applyChains(models, {
        "ali/anthropic/qwen3.8-flash": ["mtplx/qwen38-27b-optimized-speed-fp16"],
      }, proxy);
      const flash = annotated.find((m) => m.id === "ali/anthropic/qwen3.8-flash")!;
      assert.deepEqual(flash.samplingParams, { fallbacks: ["mtplx/qwen38-27b-optimized-speed-fp16"] });
      assert.equal(flash.contextWindow, 262144); // min(1048576, 262144) — the replay must fit
      assert.match(flash.clampNote!, /fallback clamp/);
      assert.equal(wired.length, 1);
    });
    
    test("applyChains: unknown fallback ids are dropped, partial chains stay wired", () => {
      const { annotated, wired } = applyChains(models, {
        "ali/anthropic/qwen3.8-flash": ["mtplx/gone", "mtplx/qwen38-27b-optimized-speed-fp16"],
      }, proxy);
      const flash = annotated.find((m) => m.id === "ali/anthropic/qwen3.8-flash")!;
      assert.deepEqual(flash.samplingParams, { fallbacks: ["mtplx/qwen38-27b-optimized-speed-fp16"] });
      assert.deepEqual(flash.droppedIds, ["mtplx/gone"]);
      assert.equal(wired.length, 1); // r17 failure mode: wired must not read unwired
    });
    
    test("applyChains: a chain that filters to empty attaches nothing", () => {
      const { annotated, wired } = applyChains(models, {
        "ali/anthropic/qwen3.8-flash": ["mtplx/gone"],
      }, proxy);
      const flash = annotated.find((m) => m.id === "ali/anthropic/qwen3.8-flash")!;
      assert.equal(flash.samplingParams, undefined);
      assert.deepEqual(flash.droppedIds, ["mtplx/gone"]);
      assert.equal(wired.length, 0);
    });
    
    test("applyChains: self-chain (a→a) is dropped entirely — no failing-over to the group that just failed", () => {
      const { annotated, wired } = applyChains(models, {
        "ali/anthropic/qwen3.8-flash": ["ali/anthropic/qwen3.8-flash"],
      }, proxy);
      const flash = annotated.find((m) => m.id === "ali/anthropic/qwen3.8-flash")!;
      assert.equal(flash.samplingParams, undefined);
      assert.deepEqual(flash.droppedIds, ["ali/anthropic/qwen3.8-flash"]);
      assert.equal(wired.length, 0);
    });
    
    test("applyChains: duplicate fallback ids are deduped", () => {
      const { annotated } = applyChains(models, {
        "ali/anthropic/qwen3.8-flash": ["mtplx/qwen38-27b-optimized-speed-fp16", "mtplx/qwen38-27b-optimized-speed-fp16"],
      }, proxy);
      const flash = annotated.find((m) => m.id === "ali/anthropic/qwen3.8-flash")!;
      assert.deepEqual(flash.samplingParams, { fallbacks: ["mtplx/qwen38-27b-optimized-speed-fp16"] });
    });
    
    test("applyChains: prototype-named models (toString) read own properties only", () => {
      // A proxy model literally named "toString" with NO own chain entry must
      // read `undefined` (own-property lookup), not the inherited function —
      // r18-review P4.3: Array.isArray(function) is false, so the old code
      // crashed rawChain.filter inside the factory and killed every agent run.
      const models2 = [{ id: "toString", max_input_tokens: 1000 }];
      const { annotated, wired } = applyChains(models2, {}, proxy);
      assert.equal(annotated[0].samplingParams, undefined);
      assert.equal(wired.length, 0);
      // And an OWN "toString" chain still wires normally (own-key lookup wins).
      const { annotated: own, wired: wiredOwn } = applyChains(models2, { toString: ["zai/anthropic/glm-5.3-flash"] }, proxy);
      assert.deepEqual(own[0].samplingParams, { fallbacks: ["zai/anthropic/glm-5.3-flash"] });
      assert.equal(wiredOwn.length, 1);
    });
    
    test("applyChains: maxTokens-only clamp is reported as such", () => {
      const proxy2 = new Map([
        ["ali/anthropic/qwen3.8-flash", { max_input_tokens: 1048576, max_output_tokens: 32768 }],
        ["small-out", { max_input_tokens: 1048576, max_output_tokens: 4096 }],
      ]);
      const { annotated } = applyChains(models, {
        "ali/anthropic/qwen3.8-flash": ["small-out"],
      }, proxy2);
      const flash = annotated.find((m) => m.id === "ali/anthropic/qwen3.8-flash")!;
      assert.match(flash.clampNote!, /maxTokens 32768→4096/);
      assert.doesNotMatch(flash.clampNote!, /ctx 1048576→1048576/);
    });
    
    test("resolveFallbackChains: the default does not leak by reference", () => {
      const { chains } = resolveFallbackChains(undefined);
      (chains as Record<string, unknown>)["injected"] = ["x"];
      const { chains: again } = resolveFallbackChains(undefined);
      assert.equal(Object.keys(again).length, Object.keys(DEFAULT_FALLBACKS).length);
      // And on the WARNING paths too (#401 review, pillar 8): they returned
      // DEFAULT_FALLBACKS itself, so an in-place normalisation could grow the
      // exported platform decision. Mutate a value ARRAY, not just a key —
      // the shallow copy must cover the map, values are read-only by contract.
      const { chains: degraded } = resolveFallbackChains("{not json");
      (degraded["mtplx/qwen38-27b-optimized-speed-fp16"] as string[]).push("injected");
      const { chains: after } = resolveFallbackChains("{not json");
      // Compare against the EXPECTED literal, not the export: with the leak,
      // `after` IS the mutated export and deepEqual(x, x) is trivially true.
      assert.deepEqual(after, {
        "mtplx/qwen38-27b-optimized-speed-fp16": ["ali/anthropic/qwen3.8-flash"],
        "ali/anthropic/qwen3.8-flash": ["zai/anthropic/glm-5.3-flash"],
        "zai/anthropic/glm-5.3-flash": ["ali/anthropic/qwen3.8-flash"],
      });
    });
    
  fallbacks.ts: |
    /**
     * Fallback-chain resolution for the litellm-provider extension (#358).
     *
     * Pure and table-tested (the extension body only wires the result): the
     * contract is "a semantically-bad override degrades to the DEFAULT chain,
     * loudly" — never a crash, never a silently-wrong chain (r16-style review
     * of #359: valid JSON with a wrong shape is the accidental-value risk).
     */
    
    // Platform decision (#363): the review primary is the mtplx speed target
    // (ops template flip, k8s-config 8c1fb609) — speed → qwen3.8-flash.
    // History: speed was demoted 2026-09-08 (#373's rollback — it STALLED at
    // long context: an HTTP-level stall at ~20k tokens, nowhere near a window
    // boundary, so no window arithmetic prevents it; the honest justification
    // for re-promotion is the platform's call that the provider defect is
    // resolved — and if it recurs, this chain turns the stall into a mid-run
    // failover to flash instead of a dead stream).
    //
    // The flash → glm entry (#373's chain) is retained deliberately: chains
    // are keyed by PRIMARY model id, so a single-entry table silently strips
    // failover from every other primary — and this chart's own default
    // (chart/values.yaml pr-review) still runs flash. Both live directions
    // ship; a key whose primary this proxy does not serve is inert and is
    // reported at startup (unwiredChains, below). All ids live in the proxy
    // key's scope.
    export const DEFAULT_FALLBACKS: Record<string, string[]> = {
      "mtplx/qwen38-27b-optimized-speed-fp16": ["ali/anthropic/qwen3.8-flash"],
      "ali/anthropic/qwen3.8-flash": ["zai/anthropic/glm-5.3-flash"],
      // glm is a live primary too — the --model default of cmd/harmostes-agent
      // and harmostes.py (#401 review r2): without an entry a glm-primary run
      // attaches no failover at all. flash is LARGER in both dimensions, so
      // this entry clamps nothing.
      //
      // Ring note: flash→glm→flash is a cycle at the TABLE level, but LiteLLM
      // request-level fallbacks are one list deep — a failing fallback ENDS
      // the request, and the next attempt restarts at the configured primary.
      // There is no in-request ping-pong; cross-attempt retry storms are the
      // worker's attempt bound, not the chain's.
      "zai/anthropic/glm-5.3-flash": ["ali/anthropic/qwen3.8-flash"],
    };
    
    /**
     * Parse a LITELLM_FALLBACKS override: a JSON object whose keys are model ids
     * and whose values are NON-EMPTY ARRAYS of non-empty string model ids.
     * Anything else — unparsable JSON, non-object, non-array values, empty
     * arrays, non-string members — degrades to the default with a reason string
     * (logged by the caller).
     */
    // The default must not leak by reference into callers that might normalise
    // in place (r18-review P2: a key mutation reached the exported const; the
    // #401 review extended it to VALUES — a shallow copy still shares the
    // chain arrays, so a push() grew the platform decision). Clone one level
    // down: fresh map, fresh arrays.
    const copyDefaultChains = (): Record<string, string[]> =>
      Object.fromEntries(Object.entries(DEFAULT_FALLBACKS).map(([k, v]) => [k, [...v]]));
    
    export function resolveFallbackChains(
      raw: string | undefined,
    ): { chains: Record<string, string[]>; warning?: string } {
      if (raw === undefined || raw.trim() === "") {
        return { chains: copyDefaultChains() };
      }
      let parsed: unknown;
      try {
        parsed = JSON.parse(raw);
      } catch {
        return { chains: copyDefaultChains(), warning: "LITELLM_FALLBACKS is not valid JSON — keeping default chains" };
      }
      if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) {
        return { chains: copyDefaultChains(), warning: "LITELLM_FALLBACKS is not a JSON object — keeping default chains" };
      }
      const chains: Record<string, string[]> = {};
      for (const [model, chain] of Object.entries(parsed as Record<string, unknown>)) {
        if (!Array.isArray(chain) || chain.length === 0 || !chain.every((id) => typeof id === "string" && id.trim() !== "")) {
          return {
            chains: copyDefaultChains(),
            warning: `LITELLM_FALLBACKS["${model}"] is not a non-empty array of model ids — keeping default chains`,
          };
        }
        chains[model] = chain as string[];
      }
      return { chains };
    }
    
    /**
     * The wiring summary line's tail: distinguishes "nothing configured" (the
     * '{}' off-switch) from "configured but nothing usable" (typo'd/partial
     * override, group dropped mid-rollout) — the dead-stream symptom becomes a
     * one-glance diagnosis (#401 review r2; pure so the branches are
     * table-tested — index.ts itself is import-gate only).
     */
    export function wiringSummary(wired: string[], chains: Record<string, string[]>): string {
      if (wired.length) return ` | fallbacks wired: ${wired.join("; ")}`;
      const keys = Object.keys(chains);
      return keys.length
        ? ` | no fallbacks wired — chains configured for: ${keys.join(", ")}`
        : " | no fallbacks wired — none configured (LITELLM_FALLBACKS='{}' disables all chains)";
    }
    
    /** One model's registration-relevant fields after chain application. */
    
    export interface ChainedModel {
      id: string;
      contextWindow: number;
      maxTokens: number;
      /** Present ONLY when a non-empty, fully-resolved chain applies. */
      samplingParams?: Record<string, unknown>;
      /** Set when a chain clamped this model's window (observability, r17 P7b). */
      clampNote?: string;
      /** Fallback ids dropped for not being discovered proxy groups. */
      droppedIds: string[];
    }
    
    /**
     * Apply fallback chains to the proxy's discovered model list. Pure: no
     * fetch, no env — the table tests own every branch.
     *
     * Contract (r17-review P4/P7):
     * - an unchained model carries NO samplingParams key (an explicit empty
     *   `fallbacks: []` would OVERRIDE proxy-configured fallbacks — the
     *   opposite of this feature's name, on every model, fleet-wide);
     * - a chained model's ids are filtered to DISCOVERED groups (a router
     *   cannot fail over to a group it does not know); dropped ids surface in
     *   `droppedIds` for the warning log;
     * - a chain that filters to empty attaches nothing (invisible in
     *   `wired` — the caller's summary log distinguishes "none configured"
     *   from "configured but none wired");
     * - chained models register min(primary, fallback) windows so the
     *   post-failover replay fits the fallback group (with a clampNote for
     *   the log).
     */
    export function applyChains(
      models: Array<{ id: string; max_input_tokens?: number; max_output_tokens?: number }>,
      chains: Record<string, string[]>,
      byId: Map<string, { max_input_tokens?: number; max_output_tokens?: number }>,
    ): { wired: string[]; annotated: ChainedModel[]; unwiredChains: string[] } {
      const wired: string[] = [];
      // Chains keyed by a primary this proxy does not serve are INERT — the
      // per-model loop below never reaches them (no droppedIds, no clampNote,
      // no warning). Surface exactly that: keys with NO DISCOVERED PRIMARY.
      // This does NOT cover every inert shape — undiscovered FALLBACK ids
      // surface per-model via droppedIds, an empty-filtering chain attaches
      // nothing, and a served primary with no entry here is invisible to this
      // field (the caller's summary log covers the last two) (#401 review r2).
      const unwiredChains = Object.keys(chains).filter((id) => !byId.has(id));
      const annotated = models.map((model) => {
        const rawChain = chains[model.id];
        const contextWindow = model.max_input_tokens ?? 131072;
        const maxTokens = model.max_output_tokens ?? 8192;
        const out: ChainedModel = { id: model.id, contextWindow, maxTokens, droppedIds: [] };
        // Own-property lookup + shape guard: a proxy model literally named
        // "toString" would otherwise read a FUNCTION off the prototype and
        // crash the extension factory (r18-review P4.3, probe-verified).
        if (!Object.hasOwn(chains, model.id)) return out;
        if (!Array.isArray(rawChain)) return out;
    
        const chain = [...new Set(rawChain)] // dedupe — a doubled id fails over to the same dead group twice
          .filter((id) => {
            if (id !== model.id && byId.has(id)) return true;
            out.droppedIds.push(id);
            return false;
          });
        if (chain.length === 0) return out; // nothing usable — attach no key at all
    
        let cw = contextWindow;
        let mt = maxTokens;
        for (const id of chain) {
          const fb = byId.get(id)!;
          if (fb.max_input_tokens && fb.max_input_tokens < cw) cw = fb.max_input_tokens;
          if (fb.max_output_tokens && fb.max_output_tokens < mt) mt = fb.max_output_tokens;
        }
        if (cw < contextWindow || mt < maxTokens) {
          // Report whichever dimension ACTUALLY clamped (r18-review P4.2: a
          // maxTokens-only clamp logged "ctx A→A" — a clamp that did not
          // happen, hiding the one that did).
          const parts: string[] = [];
          if (cw < contextWindow) parts.push(`ctx ${contextWindow}→${cw}`);
          if (mt < maxTokens) parts.push(`maxTokens ${maxTokens}→${mt}`);
          out.clampNote = `${parts.join(", ")} (fallback clamp)`;
          out.contextWindow = cw;
          out.maxTokens = mt;
        }
        out.samplingParams = { fallbacks: chain };
        wired.push(`${model.id} → ${chain.join(", ")}`);
        return out;
      });
      return { wired, annotated, unwiredChains };
    }
    
  index.ts: |
    /**
     * LiteLLM Proxy provider extension for pi.
     *
     * Registers all models exposed by a LiteLLM proxy as the "litellm" provider.
     * LiteLLM is an OpenAI-compatible router/gateway, so every model uses the
     * openai-completions streaming API.
     *
     * Required env vars (injected by the harmostes controller from the
     * harmostes-litellm-token secret):
     *
     *   LITELLM_URL      e.g. https://litellm.example.com
     *   LITELLM_API_KEY  the proxy's master key or virtual key
     *
     * Models are referenced as litellm/<model-id>, e.g. litellm/zai/anthropic/glm-5.3-flash.
     * The <model-id> is passed verbatim to LiteLLM's /v1/chat/completions endpoint,
     * which routes it to the correct upstream provider.
     *
     * Model discovery is dynamic: the extension fetches /v1/models at startup so
     * new models added to the proxy are available immediately without rebuilding
     * the worker image.
     *
     * Fallbacks (#358): models with a configured fallback chain carry LiteLLM's
     * request-level `fallbacks` param (via Model.samplingParams) — when the
     * primary model group fails mid-run, the proxy's router fails over to the
     * fallback group and the agent's stream continues instead of dying. Default
     * chains: mtplx/qwen38-27b-optimized-speed-fp16 → ali/anthropic/qwen3.8-flash
     * and ali/anthropic/qwen3.8-flash → zai/anthropic/glm-5.3-flash (every live
     * primary direction carries an entry — chains are keyed by primary, and an
     * entry for any other primary would be inert; #363, #401 review). Override with
     * LITELLM_FALLBACKS, a JSON object
     * mapping model id → array of fallback ids — resolved by fallbacks.ts, which
     * degrades to the default chain on any semantically-bad value. NOTE the
     * naming boundary: on the proxy, ids are BARE group names (mtplx/...);
     * harmostes-side model strings carry the litellm/ provider prefix
     * (litellm/mtplx/...).
     *
     * Honest limits (r16/r17/r18 reviews — the canonical statement; the code
     * points here instead of restating it): (1) LITELLM_FALLBACKS is delivered
     * to agents via jobEnvAllowlist (worker/dispatch.go) from the pool pod's
     * env — set it on the worker Deployment. `LITELLM_FALLBACKS='{}'` DISABLES
     * all chains (the off-switch); unset keeps the default. (2) A run that
     * failed over is indistinguishable from a healthy run here (same --model
     * string); attribute via the proxy's router logs, which record the serving
     * group per request. (3) Chained models register min(primary, fallback)
     * windows so the post-failover replay fits the fallback group — a real
     * capacity cost on every healthy run, taken for correctness — pi compacts
     * at window−reserve, so a chain whose fallback has a SMALLER window pulls
     * the primary's budget down. Per-direction, for the CURRENT table: speed
     * → flash none (min = speed's own 256 KiB); glm → flash none (flash is
     * larger in both dimensions); flash → glm is the costly one — ~8× ctx
     * clamp (1 MiB→128 KiB) PLUS a 4× output clamp (32k→8k tokens), retained
     * on purpose because flash is this chart's default primary and glm is its
     * only other served group (the historical flash→speed direction cost ~4×,
     * 1 MiB→256 KiB — smaller than what we ship today).
     * The alternative, clamping only the fallback and letting the first
     * over-long replay 400, was considered and rejected: it trades a clean
     * early compaction for a dead stream exactly when the primary is already
     * down. (4) The clamp
     * is not transitive: a proxy-side chain hanging off the fallback group is
     * invisible here. Chains are keyed by PRIMARY model id: an entry for a
     * model this proxy does not serve is inert (reported at startup,
     * unwiredChains = keys with no discovered primary; undiscovered fallback
     * ids and empty-filtering chains surface via droppedIds / the wiring
     * summary instead). The default table carries an entry for every live
     * primary direction (speed, flash, glm); a LITELLM_FALLBACKS override
     * REPLACES the whole map — '{}' is the off-switch. (5) A failover moves
     * the whole review context to a
     * DIFFERENT upstream group — chains are Deployment-env-settable, so the
     * trust boundary for review payloads is whoever can edit that Deployment.
     */
    import type { ExtensionAPI } from "@earendil-works/pi-coding-agent";
    import { applyChains, resolveFallbackChains, wiringSummary } from "./fallbacks.ts";
    
    export default async function (_pi: ExtensionAPI) {
      const rawUrl = process.env.LITELLM_URL;
      const apiKey = process.env.LITELLM_API_KEY;
    
      if (!rawUrl) {
        console.error("[litellm-provider] LITELLM_URL not set — provider not registered");
        return;
      }
      if (!apiKey) {
        console.error("[litellm-provider] LITELLM_API_KEY not set — provider not registered");
        return;
      }
    
      // Normalise: strip trailing slash for clean URL composition.
      const baseUrl = rawUrl.replace(/\/+$/, "");
    
      let models: Array<{ id: string; max_input_tokens?: number; max_output_tokens?: number }>;
      try {
        const resp = await fetch(`${baseUrl}/v1/models`, {
          headers: { Authorization: `Bearer ${apiKey}` },
        });
        if (!resp.ok) {
          console.error(`[litellm-provider] /v1/models returned ${resp.status} ${resp.statusText}`);
          return;
        }
        const payload = (await resp.json()) as {
          data: Array<{ id: string; max_input_tokens?: number; max_output_tokens?: number }>;
        };
        models = payload.data ?? [];
      } catch (err) {
        console.error(`[litellm-provider] failed to fetch models from ${baseUrl}/v1/models: ${err}`);
        return;
      }
    
      if (models.length === 0) {
        console.error("[litellm-provider] proxy returned 0 models — provider not registered");
        return;
      }
    
      // Fallback chains (#358): model id → LiteLLM request-level `fallbacks`.
      // Resolution/validation is pure and table-tested (fallbacks.ts); a
      // semantically-bad LITELLM_FALLBACKS degrades to the default chain loudly.
      // NOTE: the env is read in the worker IMAGE (piargs loads this extension for
      // every agent) — reaching the override from a deployment means setting it on
      // the worker Deployment/env template, not per-Job.
      const { chains: fallbacks, warning } = resolveFallbackChains(process.env.LITELLM_FALLBACKS);
      if (warning) {
        console.error(`[litellm-provider] ${warning}`);
      }
      const byId = new Map(models.map((m) => [m.id, m]));
    
      const { wired, annotated, unwiredChains } = applyChains(models, fallbacks, byId);
      if (unwiredChains.length > 0) {
        // Expected on any proxy that serves a SUBSET of the live primaries
        // (the default table is deliberately a superset — honest-limits (4)):
        // a note, not an alarm. The alarm-shaped case is the wiring summary
        // below ("no fallbacks wired").
        console.error(`[litellm-provider] note: default-table primary not served by this proxy (chain inert): ${unwiredChains.join(", ")}`);
      }
    
      _pi.registerProvider("litellm", {
        name: "LiteLLM Proxy",
        baseUrl: `${baseUrl}/v1`,
        apiKey: "$LITELLM_API_KEY",
        api: "openai-completions",
        authHeader: true,
        // All chain math is pure and table-tested (fallbacks.ts:applyChains) —
        // the wiring below only translates the result into provider config.
        models: annotated.map((model) => ({
          id: model.id,
          name: model.id,
          reasoning: false,
          input: ["text" as const],
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 },
          contextWindow: model.contextWindow,
          maxTokens: model.maxTokens,
          // LiteLLM's request-level failover: when this model group fails, the
          // proxy retries the chain server-side and the stream never breaks.
          // ABSENT on unchained models — an explicit `fallbacks: []` would
          // override proxy-configured fallbacks with "none", fleet-wide
          // (r17-review P4.1: observed live via a stubbed /v1/models).
          samplingParams: model.samplingParams,
          compat: {
            // LiteLLM proxies upstream providers; use the broadest-compatible flags.
            supportsDeveloperRole: false,
            maxTokensField: "max_tokens",
          },
        })),
      });
    
      for (const model of annotated) {
        for (const id of model.droppedIds) {
          console.error(`[litellm-provider] WARNING: fallback "${id}" (for ${model.id}) is not a known proxy group — dropped`);
        }
        if (model.clampNote) {
          console.error(`[litellm-provider] ${model.id}: ${model.clampNote}`);
        }
      }
      // Honest wiring log: applyChains reports the chains actually ATTACHED —
      // fully-resolved (primary known, every fallback id a discovered group)
      // and non-empty. Anything else is "no fallbacks wired" for that model.
      console.error(
        `[litellm-provider] registered ${models.length} model(s): ${models.map((m) => m.id).join(", ")}` +
          wiringSummary(wired, fallbacks),
      );
    }
    
  package.json: |
    {
      "name": "pi-extension-litellm-provider",
      "private": true,
      "version": "0.1.0",
      "type": "module",
      "scripts": {
        "clean": "echo 'nothing to clean'",
        "build": "echo 'nothing to build'",
        "check": "echo 'nothing to check'"
      },
      "pi": {
        "extensions": [
          "./index.ts"
        ]
      }
    }
    

---
# Source: harmostes/templates/fork-maintenance.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: fork-maintenance-scripts
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/managed-by: Helm
data:
  sync-fork.sh: |
    #!/usr/bin/env bash
    # =============================================================================
    # sync-fork.sh — Universal fork sync script (MERGE model, phase-addressable)
    # =============================================================================
    # Merges the upstream release branch INTO the fork's release branch (off a sync
    # branch → PR), runs post-merge hooks, verifies patches + divergence integrity,
    # validates, and opens a host-routed PR. Merge model: the fork's
    # release branch carries our customizations as immutable commits; each sync
    # appends an upstream merge, so custom SHAs never change (append-only, bisectable,
    # no replay/accumulation). Conflicts are localized 3-way regions — the ideal
    # substrate for the LLM conflict-resolver (resolve-conflict.sh). Parameterized by
    # a fork definition YAML.
    #
    # PHASE MODE (graph-native fork-maintenance workflows): each phase is one harmostes
    # graph node (plugin fork-sync <fork> <phase>). Phases share the clone via
    # HARMOSTES_WORKDIR/fork-<name> and pass state through .git/harmostes-state.env.
    # Phased mode merges the LOCAL MIRROR BRANCH (fork.mirror_branch, kept current by
    # the upstream-mirror action + push webhook) — it never fetches the upstream host.
    # Result semantics (PluginResult JSON on the last stdout line):
    #   merge     exit 0 {changed:false}            upstream unchanged (no-op run)
    #             exit 0 {changed:true}             merged cleanly
    #             exit 2                            conflict (resolver delegated, async)
    #   hook      exit 0/1                          post-merge codegen
    #   gates     exit 0 {changed:true}             divergence + patches intact
    #             exit 1                            lost feature → needs-fix PR pushed
    #   validate  exit 0/1                          the fork's declared validation suite
    #   pr        exit 0 {changed:true|false}       false = PR left for review (no auto-merge)
    #   tag       exit 0 {changed:true|false}       machine-cut v<upstream>-rezus.<N+1>
    #
    # ALL MODE (default — legacy single-shot for forks not yet graph-native):
    # exit codes: 0 = up to date or PR opened (auto-merged if auto.merge);
    #             2 = merge conflict (needs resolution PR created); 3 = push failure.
    #
    # Usage: sync-fork.sh <fork-name> [merge|hook|gates|validate|pr|tag|all]
    # Requires: git, gh (GitHub CLI), yq, bash
    # Environment: GITHUB_TOKEN (PAT with repo + workflow scope on the forks)
    # =============================================================================
    
    set -euo pipefail
    
    FORK_NAME="${1:?Usage: sync-fork.sh <fork-name> [merge|hook|gates|validate|pr|tag|all]}"
    PHASE="${2:-all}"
    case "$PHASE" in
      merge|hook|gates|validate|pr|tag) PHASED=1 ;;
      all) PHASED=0 ;;
      *) echo "ERROR: unknown phase '$PHASE'" >&2; exit 1 ;;
    esac
    
    SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    # MAINT_DIR is the parent of scripts/ — either platform/harmostes/fork-maintenance/ in the
    # repo, or /workspace/ in the worker (ConfigMap mount).
    MAINT_DIR="$(dirname "$SCRIPT_DIR")"
    DEF_FILE="$MAINT_DIR/forks/${FORK_NAME}.yaml"
    
    if [ ! -f "$DEF_FILE" ]; then
      echo "ERROR: fork definition not found: $DEF_FILE" >&2
      exit 1
    fi
    
    echo "=== [$PHASE] fork: $FORK_NAME ==="
    
    # Parse YAML definition into shell variables
    read_yaml() { yq -r "$1" "$DEF_FILE"; }
    
    # Mode dispatch (schema v2): merge (default, whole-repo forks) vs subtree
    # (vendored upstream trees) vs mapping (the forgejo self-sync — sync.yml's
    # mapping-table walk in the plugin). The subtree/mapping machinery lives at
    # the END of this script — dispatching there and exiting; every merge-mode
    # path below is unreachable for those defs, keeping the merge-mode code
    # byte-untouched.
    MODE="$(read_yaml '.mode // "merge"' 2>/dev/null || echo merge)"
    case "$MODE" in
      merge|subtree|mapping) ;;
      *) echo "ERROR: unknown mode '$MODE' for fork '$FORK_NAME'" >&2; exit 1 ;;
    esac
    
    # Mapping-table defs are SELF-HOSTED (sync.yml in the fork repo walks the
    # rows) unless they opt into the plugin transport (mode: mapping — #97).
    if [ "$(read_yaml '.mappings | length' 2>/dev/null || echo 0)" != "0" ] && [ "$MODE" != "mapping" ]; then
      echo "fork ${FORK_NAME} is self-hosted (mapping table; transport declared per row)"
      echo "sync runs in the fork repo: .github/workflows/sync.yml — nothing to do here"
      exit 0
    fi
    
    UPSTREAM_URL=$(read_yaml '.upstream.url')
    UPSTREAM_BRANCH=$(read_yaml '.upstream.branch')
    FORK_URL=$(read_yaml '.fork.url')
    FORK_DEFAULT_BRANCH=$(read_yaml '.fork.default_branch')
    FORK_MIRROR_BRANCH=$(read_yaml '.fork.mirror_branch' 2>/dev/null || echo "")
    
    # Deliver a fork.conflict.needs-resolution event (structured needs-fix payload) to
    # the conflict-resolver. Delivered by direct HTTP POST to the resolver's /events
    # endpoint (conflict-subscriber.py), with retries. We previously routed this
    # through Dapr pub/sub (pubsub.redis), but Redis pub/sub is fire-and-forget —
    # events published while the resolver was restarting were silently lost, AND
    # the daprd sidecar in the sync Job never terminated so the Job hung and re-emission
    # (every 30m) never happened. Direct HTTP fixes both. The payload is ALWAYS
    # written to manifests/<fork>-needs-fix.json first (audit / manual-runs fallback).
    # See skill/references/conflict-resolution.md "Agentic integration shape".
    emit_conflict_event() {
      local cfiles="${1:-}" payload patches_json pcount i
      patches_json="[]"
      pcount=$(read_yaml '.patches | length' 2>/dev/null || true)
      for i in $(seq 0 $((pcount - 1))); do
        local pf ps pd st="LOST"
        pf=$(read_yaml ".patches[$i].file"); ps=$(read_yaml ".patches[$i].signature"); pd=$(read_yaml ".patches[$i].description")
        if [ -f "$pf" ]; then { [ "$(grep -cF "$ps" "$pf" 2>/dev/null || true)" -gt 0 ] && st="OK"; } || st="LOST"; else st="MISSING"; fi
        patches_json=$(echo "$patches_json" | jq --arg f "$pf" --arg s "$ps" --arg d "$pd" --arg st "$st" '. += [{file:$f,signature:$s,description:$d,status:$st}]')
      done
      payload=$(jq -n \
        --arg fork "$FORK_NAME" \
        --arg upstream_url "$UPSTREAM_URL" --arg upstream_branch "$UPSTREAM_BRANCH" \
        --arg upstream_range "${MERGE_BASE:0:12}..${UPSTREAM_HEAD:0:12}" \
        --argjson patches "$patches_json" \
        --arg conflict_files "$cfiles" \
        '{fork:$fork, upstream_url:$upstream_url, upstream_branch:$upstream_branch,
          upstream_range:$upstream_range, patches_at_risk:$patches,
          conflict_files: ($conflict_files | split("\n") | map(select(length>0)))}')
      mkdir -p "$MAINT_DIR/manifests" 2>/dev/null || true
      echo "$payload" > "$MAINT_DIR/manifests/${FORK_NAME}-needs-fix.json"
      # Direct HTTP delivery to the resolver (replaces Dapr pub/sub — see header).
      RESOLVER_URL="${RESOLVER_URL:-http://fork-conflict-resolver.harmostes.svc.cluster.local/events}"
      ce=$(echo "$payload" | jq -c '{source:"fork-sync", type:"fork.conflict.needs-resolution", data:.}')
      delivered=false
      for attempt in 1 2 3 4 5; do
        if curl -sf -m 5 -X POST "$RESOLVER_URL" -H "Content-Type: application/json" -d "$ce" >/dev/null 2>&1; then
          echo "  delivered fork.conflict.needs-resolution → resolver"
          delivered=true; break
        fi
        echo "  resolver unreachable (attempt $attempt); retrying in ${attempt}s"
        sleep "$attempt"
      done
      $delivered || echo "  WARNING: resolver unreachable after retries — needs-fix payload at manifests/${FORK_NAME}-needs-fix.json"
    }
    
    # ── Phase-mode plumbing ──────────────────────────────────────────────────────
    # The clone lives under HARMOSTES_WORKDIR (the graph executor shares one workdir
    # across the run's nodes) and state passes through .git/harmostes-state.env
    # (inside .git so it never pollutes the working tree).
    STATE_FILE=""
    state_save() {
      { for v in FORK_NAME UPSTREAM_URL UPSTREAM_BRANCH FORK_URL FORK_DEFAULT_BRANCH \
                 FORK_MIRROR_BRANCH SYNC_DATE SYNC_BRANCH MERGE_BASE UPSTREAM_HEAD \
                 NEW_COMMITS BASELINE PATCH_STATUS PATCH_RESULTS HOOK_RAN; do
          printf '%s=%q\n' "$v" "${!v:-}"
        done
        printf 'VALIDATION_FAILED=%q\n' "${VALIDATION_FAILED:-false}"
        printf 'DIVERGENCE_FAILED=%q\n' "${DIVERGENCE_FAILED:-false}"
        printf 'VALIDATION_RESULTS=%q\n' "${VALIDATION_RESULTS:-(validation not run)}"
      } > "$STATE_FILE"
    }
    state_load() {
      # STATE_FILE is per-process state: recompute it for phased runs (the merge
      # phase that created it ran in a different process/node).
      if [ "$PHASED" = "1" ] && [ -z "${STATE_FILE:-}" ]; then
        STATE_FILE="${HARMOSTES_WORKDIR:-/tmp}"
        STATE_FILE="${STATE_FILE%/}/fork-${FORK_NAME}/.git/harmostes-state.env"
      fi
      [ -n "${STATE_FILE:-}" ] && [ -f "$STATE_FILE" ] || { echo "ERROR: no sync state — run the merge phase first" >&2; exit 1; }
      # shellcheck disable=SC1090
      source "$STATE_FILE"
    }
    
    # push_sync_branch pushes the disposable sync branch: force-with-lease when a
    # remote-tracking ref is known (protects foreign updates), plain --force when the
    # shallow clone lacks the tracking ref (same-day re-runs legitimately recreate
    # the branch; it is derived state owned by this script).
    push_sync_branch() {
      if git rev-parse -q --verify "origin/$SYNC_BRANCH" >/dev/null 2>&1; then
        git push --force-with-lease --quiet origin "$SYNC_BRANCH"
      else
        git push --force --quiet origin "$SYNC_BRANCH"
      fi
    }
    
    # result_json prints the PluginResult contract line (LAST stdout line wins).
    result_json() {
      local changed="$1" artifact="$2" phase="$3" msg="$4"
      printf '{"changed":%s,"artifact":"%s","event":{"phase":"%s"},"message":"%s"}\n' \
        "$changed" "$artifact" "$phase" "$msg"
    }
    
    # ── Phase: merge (clone → merge-base check → merge → divergences) ────────────
    phase_merge() {
      if [ "$PHASED" = "1" ]; then
        WORKDIR_ROOT="${HARMOSTES_WORKDIR:-/tmp}"
        WORKDIR="${WORKDIR_ROOT%/}/fork-${FORK_NAME}"
        rm -rf "$WORKDIR"          # stale clone from a prior failed run on this pod
        mkdir -p "$WORKDIR_ROOT"
        STATE_FILE="$WORKDIR/.git-state.env"  # placeholder; real .git exists after clone
      else
        WORKDIR=$(mktemp -d)
      fi
    
      echo ""
      echo "=== Cloning fork (shallow) ==="
      git clone --depth 100 "$FORK_URL" "$WORKDIR"
      cd "$WORKDIR"
      STATE_FILE="$WORKDIR/.git/harmostes-state.env"
    
      # shellcheck source=scripts/git-host.sh
      # shellcheck disable=SC1091
      source "$SCRIPT_DIR/git-host.sh"
      host_setup
    
      # Phased mode merges the LOCAL MIRROR BRANCH (same host as the fork, kept
      # current by the upstream-mirror action + push webhook) — no upstream-host
      # fetch. The alias remote keeps every downstream `upstream/<branch>` ref
      # working. Legacy (all) mode fetches the upstream host directly.
      if [ "$PHASED" = "1" ]; then
        git remote add upstream "$FORK_URL"
        git fetch --depth 100 upstream "$UPSTREAM_BRANCH" --tags
      else
        git remote add upstream "$UPSTREAM_URL"
        git fetch --depth 100 upstream "$UPSTREAM_BRANCH" --tags
      fi
    
      CURRENT_BRANCH=$(git branch --show-current)
      if [ "$CURRENT_BRANCH" != "$FORK_DEFAULT_BRANCH" ]; then
        git checkout "$FORK_DEFAULT_BRANCH" 2>/dev/null || git checkout -b "$FORK_DEFAULT_BRANCH" "origin/$FORK_DEFAULT_BRANCH"
      fi
    
      MERGE_BASE=$(git merge-base "HEAD" "upstream/$UPSTREAM_BRANCH" 2>/dev/null || echo "")
      UPSTREAM_HEAD=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
    
      if [ "$MERGE_BASE" = "$UPSTREAM_HEAD" ]; then
        echo ""
        echo "=== Already up to date — mirror has no new commits ==="
        if [ "$PHASED" = "1" ]; then
          result_json false "fork-sync-$FORK_NAME" merge "up to date — nothing to merge"
          exit 0
        fi
        exit 0
      fi
    
      NEW_COMMITS=$(git rev-list --count "${MERGE_BASE}..upstream/${UPSTREAM_BRANCH}" 2>/dev/null || echo "?")
      echo ""
      echo "=== Upstream has $NEW_COMMITS new commits — syncing ==="
    
      # ── Capture divergence baseline (deterministic, BEFORE sync) ────────────
      DT="$SCRIPT_DIR/divergence-track.sh"
      { read_yaml '.additive_paths[]' 2>/dev/null || true; } > "/tmp/${FORK_NAME}-additive.txt"
      { read_yaml '.deletions[]'       2>/dev/null || true; } > "/tmp/${FORK_NAME}-deletions.txt"
      BASELINE="/tmp/${FORK_NAME}-divergence-baseline.json"
      echo ""
      echo "=== Capturing divergence baseline (declared additive + auto + deletions) ==="
      bash "$DT" capture "$WORKDIR" "upstream/$UPSTREAM_BRANCH" "$FORK_DEFAULT_BRANCH" "$BASELINE" \
           "/tmp/${FORK_NAME}-additive.txt" "/tmp/${FORK_NAME}-deletions.txt"
    
      SYNC_DATE=$(date +%Y-%m-%d)
      SYNC_BRANCH="rezus/sync-${SYNC_DATE}"
    
      # Branch the sync work off the RELEASE branch (not upstream) so the merge
      # result is release + upstream-delta — a clean superset that PRs back.
      git checkout -b "$SYNC_BRANCH" "$FORK_DEFAULT_BRANCH"
    
      # --no-ff guarantees an explicit, auditable merge commit (revertible via -m 1).
      if ! git merge --no-ff --no-edit \
           -m "RZ/sync: merge upstream ${UPSTREAM_BRANCH} into ${FORK_DEFAULT_BRANCH} (${SYNC_DATE})" \
           "upstream/${UPSTREAM_BRANCH}"; then
        # The merge stopped on conflicts (localized 3-way regions). Conclude it WITH
        # markers on the sync branch, open a needs-conflict-resolution PR for the LLM
        # resolver, and emit fork.conflict.needs-resolution. The resolver re-creates
        # this exact merge, resolves each region from the patch's wiki intent, then
        # re-runs the gates as proof before merging.
        CONFLICT_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null | grep -v '^$' || true)
        echo ""
        echo "=== Merge conflict — opening a resolution PR for the LLM resolver ==="
        echo "Conflicting files:"; echo "$CONFLICT_FILES" | sed 's/^/  - /'
        git add -A 2>/dev/null || true
        git commit --no-edit --quiet 2>/dev/null || true   # conclude the merge WITH markers
        push_sync_branch 2>&1 || { echo "ERROR: cannot push conflict branch" >&2; exit 3; }
        host_label_create "needs-conflict-resolution" 0E8A16 2>/dev/null || true
        PR_URL=$(host_pr_create "$FORK_DEFAULT_BRANCH" "$SYNC_BRANCH" \
          "sync: $FORK_NAME — needs conflict resolution ($SYNC_DATE)" \
          "Upstream merge produced conflicts (merge model — localized 3-way regions). The LLM conflict-resolver will resolve on this branch using each patch's declared intent; the monitor merges once every gate passes." \
          "needs-conflict-resolution" 2>/dev/null || echo "")
        echo "  resolution PR: ${PR_URL:-<none>}"
        emit_conflict_event "$CONFLICT_FILES"
        exit 2
      fi
    
      # ── Permanent divergences (deletions from fork definition) ──────────────
      DELETIONS=$(read_yaml '.deletions[]' 2>/dev/null || true)
      if [ -n "$DELETIONS" ]; then
        echo ""
        echo "=== Applying permanent divergences ==="
        for del_path in $DELETIONS; do
          clean_path="${del_path%/}"
          if [ -e "$clean_path" ]; then
            echo "  rm -rf $clean_path"
            git rm -rf --quiet "$clean_path" 2>/dev/null || true
          fi
        done
        git add -A 2>/dev/null || true
        if [ -f .git/MERGE_HEAD ]; then
          git commit --no-edit --quiet 2>/dev/null || true
        fi
      fi
    
      # ── Re-apply divergences the merge dropped (self-heal) ──────────────────
      echo ""
      echo "=== Re-applying dropped divergences (self-heal) ==="
      bash "$DT" reapply "$WORKDIR" "$FORK_DEFAULT_BRANCH" "$BASELINE" || true
    
      # ── Final marker guard (defensive assertion) ────────────────────────────
      CONFLICT_FILES=$(git grep -l -E '^(<<<<<<<|>>>>>>>|=======) ' -- . 2>/dev/null || true)
      if [ -n "$CONFLICT_FILES" ]; then
        echo "ERROR: unexpected conflict markers after a clean merge — aborting sync" >&2
        echo "$CONFLICT_FILES" | sed 's/^/  - /' >&2
        exit 3
      fi
    
      echo ""
      echo "=== Merge completed cleanly ==="
      if [ "$PHASED" = "1" ]; then
        state_save
        result_json true "fork-sync-$FORK_NAME" merge "merged ${NEW_COMMITS} upstream commit(s)"
      fi
    }
    
    # ── Phase: hook (per-fork codegen: SDK regen, chart vendor, …) ───────────────
    phase_hook() {
      cd_repo
      # Def-level post_merge_hook wins (lets channels SHARE a hook — e.g.
      # forgejo-next reuses forgejo.sh); convention fallback keeps old defs working.
      HOOK_DEF=$(read_yaml '.post_merge_hook' 2>/dev/null || echo "")
      HOOK_FILE="$MAINT_DIR/${HOOK_DEF:-post-merge-hooks/${FORK_NAME}.sh}"
      HOOK_RAN=false
      if [ -f "$HOOK_FILE" ]; then
        echo ""
        echo "=== Running post-merge hook: ${FORK_NAME}.sh ==="
        FORK_DIR="$PWD" MAINT_DIR="$MAINT_DIR" bash "$HOOK_FILE" || {
          echo "WARNING: post-merge hook failed — continuing but review needed"
        }
        HOOK_RAN=true
      fi
      if [ "$PHASED" = "1" ]; then
        state_save
        result_json true "fork-sync-$FORK_NAME" hook "post-merge hook complete"
      fi
    }
    
    # ── Phase: gates (divergence integrity + patch signatures + manifest) ────────
    phase_gates() {
      cd_repo
      DIVERGENCE_FAILED=false
      echo ""
      echo "=== Verifying divergence integrity ==="
      if DIVERGENCE_REPORT=$(bash "$SCRIPT_DIR/divergence-track.sh" verify "$PWD" "$BASELINE" 2>&1); then
        echo "  divergence: ✅ intact"
      else
        echo "$DIVERGENCE_REPORT" >&2
        echo "  divergence: ❌ LOST — a fork feature is missing"
        DIVERGENCE_FAILED=true
      fi
    
      echo ""
      echo "=== Verifying patches ==="
      PATCH_STATUS="all-intact"
      PATCH_RESULTS=""
      PATCH_COUNT=$(read_yaml '.patches | length')
      for i in $(seq 0 $((PATCH_COUNT - 1))); do
        PATCH_FILE=$(read_yaml ".patches[$i].file")
        PATCH_SIG=$(read_yaml ".patches[$i].signature")
        PATCH_DESC=$(read_yaml ".patches[$i].description")
        if [ ! -f "$PATCH_FILE" ]; then
          STATUS="MISSING"
          PATCH_STATUS="needs-review"
        else
          OCCURRENCES=$(grep -cF "$PATCH_SIG" "$PATCH_FILE" 2>/dev/null || true)
          if [ "$OCCURRENCES" -gt 0 ]; then
            STATUS="OK (${OCCURRENCES}x)"
          else
            STATUS="LOST"
            PATCH_STATUS="needs-review"
          fi
        fi
        echo "  ${STATUS} ${PATCH_FILE} — ${PATCH_DESC}"
        PATCH_RESULTS="${PATCH_RESULTS}  ${STATUS} ${PATCH_FILE}\n"
      done
      echo ""
      echo "Patch status: $PATCH_STATUS"
    
      # Audit manifest.
      MANIFEST_FILE="$MAINT_DIR/manifests/${FORK_NAME}-rezus.yaml"
      mkdir -p "$MAINT_DIR/manifests"
      if [ -f "$MAINT_DIR/scripts/generate-manifest.sh" ]; then
        echo ""
        echo "=== Generating divergence manifest ==="
        bash "$MAINT_DIR/scripts/generate-manifest.sh" "$FORK_DEFAULT_BRANCH" "upstream/$UPSTREAM_BRANCH" > "$MANIFEST_FILE" 2>/dev/null || true
        echo "  manifest written: $MANIFEST_FILE"
      fi
    
      if [ "$PHASED" = "1" ]; then
        if $DIVERGENCE_FAILED || [ "$PATCH_STATUS" != "all-intact" ]; then
          # Honest red node + a review surface: push the sync branch and open a
          # needs-fix PR so a human can fix on the merged branch (no auto-merge).
          echo ""
          echo "=== Gates RED — pushing sync branch + needs-fix PR ==="
          push_sync_branch 2>&1 || { echo "ERROR: failed to push sync branch" >&2; exit 3; }
          host_label_create "needs-fix" D93F0B 2>/dev/null || true
          host_pr_create "$FORK_DEFAULT_BRANCH" "$SYNC_BRANCH" \
            "sync: $FORK_NAME — gates RED ($SYNC_DATE)" \
            "Divergence or patch verification failed after the upstream merge. See the run envelopes; fix on this branch, then re-run." \
            "needs-fix" 2>/dev/null || echo "  (PR creation failed)"
          state_save
          echo "ERROR: gates red — a fork feature or patch signature did not survive the merge" >&2
          exit 1
        fi
        state_save
        result_json true "fork-sync-$FORK_NAME" gates "divergence + patches intact"
      fi
    }
    
    # ── Phase: validate (the fork's declared validation suite) ───────────────────
    phase_validate() {
      cd_repo
      VALIDATION_FILE="/tmp/fork-validation-${FORK_NAME}.md"
      rm -f "$VALIDATION_FILE"
      VALIDATION_RESULTS="(validation not run)"
      VALIDATION_FAILED=false
      if [ -f "$MAINT_DIR/checks/validate-fork.sh" ]; then
        echo ""
        echo "=== Running validation ==="
        VALIDATION_OUTPUT=$(bash "$MAINT_DIR/checks/validate-fork.sh" "$FORK_NAME" "$PWD" 2>&1) && VALIDATION_RC=0 || VALIDATION_RC=$?
        echo "$VALIDATION_OUTPUT"
        echo "$VALIDATION_OUTPUT" > "$VALIDATION_FILE"
        VALIDATION_RESULTS="$VALIDATION_OUTPUT"
        if [ "$VALIDATION_RC" -eq 0 ]; then
          echo "  validation: ✅"
        else
          echo "  validation: ❌ (see above)"
          VALIDATION_FAILED=true
        fi
      else
        echo "=== No validator available — skipping ==="
      fi
      if [ "$PHASED" = "1" ]; then
        state_save
        if $VALIDATION_FAILED; then
          echo "ERROR: validation failed — see output above" >&2
          exit 1
        fi
        result_json true "fork-sync-$FORK_NAME" validate "validation green"
      fi
    }
    
    # ── Phase: pr (push + PR + opt-in auto-merge) ────────────────────────────────
    phase_pr() {
      cd_repo
      AUTO_MERGE=$(read_yaml '.auto.merge // false')
    
      echo ""
      echo "=== Pushing sync branch ==="
      push_sync_branch 2>&1 || {
        echo "ERROR: failed to push sync branch" >&2
        exit 3
      }
    
      UPSTREAM_TAG=$(git describe --tags --abbrev=0 "upstream/$UPSTREAM_BRANCH" 2>/dev/null || echo "HEAD")
      UPSTREAM_COMMITS_RANGE="${MERGE_BASE:0:8}..${UPSTREAM_HEAD:0:8}"
    
      PR_TITLE="RZ/sync: merge upstream ${UPSTREAM_BRANCH} (${SYNC_DATE})"
      PR_LABEL="auto-merge"
      if [ "$PATCH_STATUS" = "needs-review" ]; then
        PR_LABEL="needs-conflict-resolution"
      elif $VALIDATION_FAILED || $DIVERGENCE_FAILED; then
        PR_LABEL="needs-fix"
      fi
    
      PR_BODY=$(compose_pr_body)
    
      echo ""
      echo "=== Opening PR ==="
      for label in "$PR_LABEL" "needs-conflict-resolution"; do
        host_label_create "$label" 0E8A16
      done
      PR_URL=$(host_pr_create "$FORK_DEFAULT_BRANCH" "$SYNC_BRANCH" "$PR_TITLE" "$PR_BODY" "$PR_LABEL") || {
        echo "WARNING: failed to open PR: $PR_URL" >&2
      }
      echo "  PR: ${PR_URL:-<none>} (label: $PR_LABEL)"
    
      if [ "$PR_LABEL" = "auto-merge" ] && [ "$AUTO_MERGE" = "true" ]; then
        echo ""
        echo "=== Auto-merging PR (all gates green, auto.merge enabled) ==="
        MERGE_SHA=$(host_pr_merge "$SYNC_BRANCH" 2>&1) || {
          echo "WARNING: auto-merge failed: $MERGE_SHA" >&2
        }
        [ "$PHASED" = "1" ] && printf 'MERGE_SHA=%q\n' "${MERGE_SHA:-}" >> "$STATE_FILE"
        if [ "$PHASED" = "1" ]; then
          result_json true "fork-sync-$FORK_NAME" pr "PR merged (${MERGE_SHA:0:12})"
        fi
      elif [ "$PHASED" = "1" ]; then
        result_json false "fork-sync-$FORK_NAME" pr "PR left for review (label=$PR_LABEL; auto.merge=$AUTO_MERGE)"
      fi
    }
    
    # ── Phase: tag (machine-cut release trigger) ─────────────────────────────────
    phase_tag() {
      cd_repo
      AUTO_RELEASE=$(read_yaml '.auto.release // false')
      MERGE_SHA="${MERGE_SHA:-}"
      RELEASE_TAG=""
    
      if [ "$AUTO_RELEASE" != "true" ] || [ -z "$MERGE_SHA" ]; then
        echo ""
        echo "=== No release (auto.release=$AUTO_RELEASE, merged=${MERGE_SHA:+yes}${MERGE_SHA:-no}) ==="
        if [ "$PHASED" = "1" ]; then
          result_json false "fork-sync-$FORK_NAME" tag "no release"
        fi
        return 0
      fi
    
      # Re-sync the release branch so we can tag the merged commit.
      git fetch --quiet origin "$FORK_DEFAULT_BRANCH"
      git checkout --quiet "$FORK_DEFAULT_BRANCH" 2>/dev/null || true
      git reset --hard --quiet "origin/$FORK_DEFAULT_BRANCH"
    
      # Nearest upstream tag → release identity. Two failure modes in shallow
      # clones: (1) describe can't reach the real tag (--tags at depth N only
      # fetches within the window — v16.0.2 wasn't even in the clone), (2) describe
      # succeeds but returns a NON-RELEASE tag (v16.0.0-dev) reachable in the
      # window. So: describe under || true (never under pipefail into set -e),
      # then VALIDATE the result is a pure version; anything else (-dev/-rc/-rezus
      # suffixes) falls back to the highest pure-version tag ON THE REMOTE for this
      # release line (branch prefix v16.0/forgejo → v16.0.*, via ls-remote).
      UPSTREAM_VER=$( { git describe --tags --abbrev=0 "upstream/$UPSTREAM_BRANCH" 2>/dev/null || true; } \
        | sed -E 's/(-rc\.[0-9]+|-rezus\.[0-9]+).*$//')
      TAG_PREFIX="${UPSTREAM_BRANCH%%/*}"
      if ! echo "$UPSTREAM_VER" | grep -qE "^v[0-9]+\.[0-9]+\.[0-9]+$"; then
        # Pure-version tags live on the UPSTREAM repo (the fork only carries our
        # v*-rezus.N triggers + possibly legacy hand tags) — query the real host.
        # Version = three segments: <prefix=vMAJOR.MINOR>.<PATCH>.
        UPSTREAM_VER=$(git ls-remote --tags "$UPSTREAM_URL" "refs/tags/${TAG_PREFIX}.*" 2>/dev/null \
          | awk -F/ '{print $NF}' | grep -E "^${TAG_PREFIX//./\\.}\.[0-9]+$" | sort -V | tail -1)
      fi
      if [ -z "$UPSTREAM_VER" ]; then
        echo "WARNING: could not determine upstream version for release tag — skipping auto-release"
      else
        # Highest existing rezus build for this upstream version — query the
        # REMOTE (shallow clones may not have fetched a prior run's tags); default 0.
        LAST_REZUS=$(git ls-remote --tags origin "refs/tags/${UPSTREAM_VER}-rezus.*" 2>/dev/null \
          | awk -F/ '{print $NF}' | sort -V | tail -1)
        LAST_N=$(echo "${LAST_REZUS}" | sed -nE 's/.*-rezus\.([0-9]+).*/\1/p')
        [ -z "$LAST_N" ] && LAST_N=0
        NEXT_N=$((LAST_N + 1))
        RELEASE_TAG="${UPSTREAM_VER}-rezus.${NEXT_N}"
    
        HEAD_TAG=$(git tag --points-at HEAD | grep -E "${UPSTREAM_VER}-rezus\." || true)
        if [ -n "$HEAD_TAG" ]; then
          echo "=== HEAD already tagged ($HEAD_TAG) — skipping auto-release ==="
          RELEASE_TAG=""
        else
          echo "=== Auto-releasing: tagging $FORK_DEFAULT_BRANCH as $RELEASE_TAG ==="
          git tag "$RELEASE_TAG"
          if git push --quiet origin "$RELEASE_TAG" 2>&1; then
            echo "  tagged $RELEASE_TAG → fork release workflow will build + publish image"
          else
            echo "WARNING: failed to push tag $RELEASE_TAG"
            RELEASE_TAG=""
          fi
        fi
      fi
      if [ "$PHASED" = "1" ]; then
        [ -n "$RELEASE_TAG" ] && result_json true "$RELEASE_TAG" tag "release tag cut" \
                             || result_json false "fork-sync-$FORK_NAME" tag "no release"
      fi
    }
    
    # cd into the phased clone (state must exist). Re-sources the host abstraction:
    # each phase runs as its own process (its own graph node) and needs the
    # host_* helpers + credentials.
    cd_repo() {
      if [ "$PHASED" = "1" ]; then
        state_load                 # separate process per node — reload state
        WORKDIR="${HARMOSTES_WORKDIR:-/tmp}"; WORKDIR="${WORKDIR%/}/fork-${FORK_NAME}"
        cd "$WORKDIR"
      else
        cd "$WORKDIR"              # single process — state is in memory
      fi
      # shellcheck source=scripts/git-host.sh
      # shellcheck disable=SC1091
      source "$SCRIPT_DIR/git-host.sh"
      host_setup
    }
    
    # compose_pr_body builds the PR body from the current state variables.
    compose_pr_body() {
      cat <<EOF
    ## Upstream sync: ${FORK_NAME}
    
    **Upstream**: ${UPSTREAM_URL} (\`${UPSTREAM_BRANCH}\`)
    **New commits**: ${NEW_COMMITS} since last sync
    **Range**: ${MERGE_BASE:0:8}..${UPSTREAM_HEAD:0:8}
    
    ### Patch verification
    
    $(echo -e "$PATCH_RESULTS")
    
    **Status**: ${PATCH_STATUS}
    
    $(if [ "$PATCH_STATUS" = "needs-review" ]; then echo "⚠️ Some patches need manual review — a signature was not found after the merge."; else echo "✅ All patches verified — this PR is auto-mergeable."; fi)
    
    ### Post-merge hook
    
    $(if [ "${HOOK_RAN:-false}" = "true" ]; then echo "Ran \`post-merge-hooks/${FORK_NAME}.sh\`"; else echo "(no post-merge hook)"; fi)
    
    ---
    
    ${VALIDATION_RESULTS}
    
    ---
    
    ### Divergence integrity
    
    $(if $DIVERGENCE_FAILED; then echo "❌ A fork feature was LOST in this sync (see job logs). PR is labelled \`needs-fix\` — it will not auto-merge."; else echo "✅ All declared additive paths + auto divergences intact (Gate 4b)."; fi)
    
    ---
    
    _Automated by platform/harmostes/fork-maintenance (k8s-config GitOps)._
    EOF
    }
    
    # ── Dispatch ─────────────────────────────────────────────────────────────────
    if [ "$MODE" = "mapping" ]; then
      # Mapping-table transport (the forgejo self-sync, sync.yml's walk in the
      # plugin). See docs/forgejo-cutover.md for the equivalence contract.
      # shellcheck disable=SC1091
      source "$SCRIPT_DIR/mapping-mode.sh"
      mapping_dispatch
      exit 0
    fi
    
    if [ "$MODE" = "subtree" ]; then
      # Vendored-tree mode: everything lives in scripts/subtree-mode.sh (sourced
      # here so the phases see this script's helpers: read_yaml, result_json,
      # push_sync_branch). Merge-mode code below is never reached for subtree defs.
      # shellcheck source=scripts/subtree-mode.sh
      # shellcheck disable=SC1091
      source "$SCRIPT_DIR/subtree-mode.sh"
      subtree_dispatch
      exit 0
    fi
    
    case "$PHASE" in
      merge)    phase_merge ;;
      hook)     phase_hook ;;
      gates)    phase_gates ;;
      validate) phase_validate ;;
      pr)       phase_pr ;;
      tag)      phase_tag ;;
      all)
        # Legacy single-shot flow for forks not yet graph-native. Exit codes:
        # 0 = up to date or PR opened (auto-merged if auto.merge); 2 = conflict;
        # 3 = push failure. Identical semantics to the pre-phase-mode single-shot flow.
        phase_merge          # exits 0 (up-to-date) or 2 (conflict) or 3 on its own
        phase_hook
        phase_validate
        phase_gates
        phase_pr
        AUTO_RELEASE=$(read_yaml '.auto.release // false')
        if [ "$PR_LABEL" = "auto-merge" ] && [ "$AUTO_MERGE" = "true" ]; then
          phase_tag
        fi
        echo ""
        echo "=== Sync complete ==="
        echo "  PR: ${PR_URL:-<none>}"
        echo "  Label: ${PR_LABEL}"
        echo "  Patch status: ${PATCH_STATUS}"
        echo "  Divergence: $(if $DIVERGENCE_FAILED; then echo '❌ LOST (needs-fix)'; else echo '✅ intact'; fi)"
        [ -n "${RELEASE_TAG:-}" ] && echo "  Released tag: $RELEASE_TAG (image build triggered)"
        ;;
    esac
    
    # Exit 0 explicitly: with set -e, a bare `[ -n "" ] && ...` as the final
    # statement returns 1, which made every successful sync (auto.release: false
    # → empty RELEASE_TAG) report "sync failed (exit 1)" despite a merged PR.
    exit 0
    
  subtree-mode.sh: |
    #!/usr/bin/env bash
    # =============================================================================
    # subtree-mode.sh — vendored upstream trees, as data (fork.yaml schema v2)
    # =============================================================================
    # Sourced by sync-fork.sh when a fork def declares `mode: subtree`. The sync
    # unit is (target repo, vendored path, pin file) — not a fork repo. The plugin
    # NEVER edits vendored content: detection compares upstream tags
    # (upstream.selector) against the pin, the policy matrix decides, and
    # propagation is DELEGATED to the target repo's own sync_command; the pristine
    # gate then verifies the delegate's result against the upstream archive.
    #
    # Severity/policy model (mirrors the monorepo's vendored-guards rule — RED =
    # something automation should have already fixed):
    #   patch → propagate: auto, merge: auto (only AFTER the PR's CI is green —
    #           host_pr_watch; never merge red)
    #   minor → propagate: auto, merge: manual (merge is ALWAYS manual unless a
    #           policy explicitly says auto)
    #   major → propagate: never (evaluation required — verdict-only run)
    # Releases are structural: they ride the target repo's tag cycle — the tag
    # phase only reports unreleased-pending; auto.release is not consulted.
    #
    # DRY_RUN=1 stops after planning (no branch content pushed, no PR) — the
    # onboarding tool for new subtree sources and this script's acceptance harness.
    #
    # CR shape (schema v2 — merge-mode defs are unchanged and never reach here):
    #   mode: subtree
    #   upstream:
    #     url: https://host/owner/upstream
    #     selector: '^v[0-9]+\.[0-9]+\.[0-9]+$'   # tag regex (subtrees pin releases)
    #   subtree:
    #     url: https://host/owner/target           # repo carrying the vendored tree
    #     branch: release-branch                   # PR target
    #     platform: github|forgejo|local
    #     token_env: GITHUB_TOKEN
    #     path: vendor/ tree location              # trailing slash optional
    #     pin_file: path/to/PIN                    # single source of truth
    #     sync_command: hack/sync-thing.sh         # delegate; called with <tag>
    #     archive: 'https://host/owner/upstream/archive/{tag}.tar.gz'
    #     patches_dir: ''                          # optional; see gate limitation
    #   policy:
    #     patch: { propagate: auto, merge: auto }
    #     minor: { propagate: auto, merge: manual }
    #     major: { propagate: never }
    #   lockstep:                                  # alert-level expectations (data)
    #     - "k8s-iac module image tag == pin"
    # =============================================================================
    
    sub_state_save() {
      { for v in FORK_NAME UPSTREAM_URL SELECTOR SUB_URL SUB_BRANCH SUB_PATH \
                 SUB_PIN_FILE SUB_SYNC_CMD SUB_ARCHIVE SUB_PATCHES_DIR \
                 PIN LATEST LANE_TAG CLASS ADVISORIES SYNC_BRANCH; do
          printf '%s=%q\n' "$v" "${!v:-}"
        done
      } > "$STATE_FILE"
    }
    
    sub_state_load() {
      STATE_FILE="${HARMOSTES_WORKDIR:-/tmp}"; STATE_FILE="${STATE_FILE%/}/fork-${FORK_NAME}/.git/harmostes-state.env"
      [ -f "$STATE_FILE" ] || { echo "ERROR: no subtree sync state — run the merge phase first" >&2; exit 1; }
      # shellcheck disable=SC1090
      source "$STATE_FILE"
    }
    
    sub_cd_repo() {
      if [ "$PHASED" = "1" ]; then
        sub_state_load
        WORKDIR="${HARMOSTES_WORKDIR:-/tmp}"; WORKDIR="${WORKDIR%/}/fork-${FORK_NAME}"
        cd "$WORKDIR"
      else
        cd "$WORKDIR"
      fi
      FORK_URL="$SUB_URL"             # host_setup's local-platform log line reads FORK_URL
      FORK_DEFAULT_BRANCH="$SUB_BRANCH"  # host_pr_merge's local case merges into this
      # shellcheck source=scripts/git-host.sh
      # shellcheck disable=SC1091
      source "$SCRIPT_DIR/git-host.sh"
      host_setup
    }
    
    sub_parse_cfg() {
      SUB_URL=$(read_yaml '.subtree.url')
      SUB_BRANCH=$(read_yaml '.subtree.branch')
      SUB_PATH=$(read_yaml '.subtree.path' | sed 's:/*$::')
      SUB_PIN_FILE=$(read_yaml '.subtree.pin_file')
      SUB_SYNC_CMD=$(read_yaml '.subtree.sync_command')
      SUB_ARCHIVE=$(read_yaml '.subtree.archive // ""' 2>/dev/null || echo "")
      SUB_PATCHES_FILE=$(read_yaml '.subtree.patches_file // ""' 2>/dev/null || echo "")
      SELECTOR=$(read_yaml '.upstream.selector')
      local v
      for v in "$SUB_URL" "$SUB_BRANCH" "$SUB_PATH" "$SUB_PIN_FILE" "$SUB_SYNC_CMD" "$SELECTOR"; do
        if [ -z "$v" ] || [ "$v" = "null" ]; then
          echo "ERROR: subtree def missing required field (url='$SUB_URL' branch='$SUB_BRANCH' path='$SUB_PATH' pin_file='$SUB_PIN_FILE' sync_command='$SUB_SYNC_CMD' selector='$SELECTOR')" >&2
          exit 1
        fi
      done
      # archive tarball is the git-upstream probe; OCI upstreams probe via helm pull
      case "$UPSTREAM_URL" in
        oci://*) ;;
        *) case "$SUB_ARCHIVE" in
             *'{tag}'*) ;;
             *) echo "ERROR: subtree.archive must contain {tag} for git upstreams" >&2; exit 1;;
           esac ;;
      esac
    }
    
    sub_read_pin() {  # $1 = clone dir → stdout: pin tag (last non-comment line)
      awk 'NF && $0 !~ /^[[:space:]]*#/ {v=$0} END {print v}' "$1/$SUB_PIN_FILE" 2>/dev/null | tr -d '[:space:]'
    }
    
    oci_tags() {  # $1 = oci://host/ns/repo → newline-separated tags (v2 API, anonymous token dance)
      local host path reg hdr realm service tok json
      path="${1#oci://}"; host="${path%%/*}"; path="${path#*/}"
      reg="https://$host"
      # flip to plain-http only on connect/TLS failure — an HTTP 401 on /v2/
      # (anonymous) still proves the HTTPS registry is there
      curl -s -o /dev/null --max-time 10 "$reg/v2/" || reg="http://$host"
      hdr=$(curl -s "$reg/v2/" -o /dev/null -D - | tr -d '\r' | awk 'tolower($1)=="www-authenticate:"{print $0}')
      tok=""
      if [ -n "$hdr" ]; then
        realm=$(echo "$hdr" | sed -nE 's/.*realm="([^"]+)".*/\1/p')
        service=$(echo "$hdr" | sed -nE 's/.*service="([^"]+)".*/\1/p')
        if [ -n "$realm" ]; then
          tok=$(curl -s "$realm?service=${service}&scope=repository:${path}:pull" | jq -r '.token // .access_token // empty')
        fi
      fi
      if [ -n "$tok" ]; then
        json=$(curl -s -H "Authorization: Bearer $tok" "$reg/v2/$path/tags/list")
      else
        json=$(curl -s "$reg/v2/$path/tags/list")   # registry without auth (drills)
      fi
      echo "$json" | jq -r '.tags[]?'
    }
    
    sub_fetch_upstream_tree() {  # $1 = tag → stdout: upstream tree dir (under $TMP)
      local tag="$1"
      case "$UPSTREAM_URL" in
        oci://*)
          mkdir -p "$TMP/up"
          helm pull "$UPSTREAM_URL" --version "$tag" --untar --untardir "$TMP/up" >/dev/null 2>&1 \
            || helm pull "$UPSTREAM_URL" --version "$tag" --untar --untardir "$TMP/up" --plain-http >/dev/null 2>&1 \
            || { echo "ERROR: helm pull $UPSTREAM_URL:$tag failed" >&2; return 1; }
          find "$TMP/up" -mindepth 1 -maxdepth 1 -type d | head -1
          ;;
        *)
          local archive_url="${SUB_ARCHIVE/\{tag\}/$tag}"
          mkdir -p "$TMP/src"
          curl -fsSL "$archive_url" -o "$TMP/src.tar.gz" \
            || { echo "ERROR: archive fetch failed: $archive_url" >&2; return 1; }
          tar -xzf "$TMP/src.tar.gz" -C "$TMP/src"
          find "$TMP/src" -mindepth 1 -maxdepth 1 -type d | head -1
          ;;
      esac
    }
    
    sub_class() {  # $1=candidate $2=pin → major|minor|patch|same
      local cMa cMi cPa pMa pMi pPa
      IFS=. read -r cMa cMi cPa <<< "${1#v}"
      IFS=. read -r pMa pMi pPa <<< "${2#v}"
      [ "$cMa" != "$pMa" ] && { echo major; return; }
      [ "$cMi" != "$pMi" ] && { echo minor; return; }
      [ "$cPa" != "$pPa" ] && { echo patch; return; }
      echo same
    }
    
    sub_lane_latest() {  # $1 = newline-separated tags, $2 = pin → newest tag in the pin's major.minor line
      local lane
      lane="$(echo "$2" | sed -E 's/^v?([0-9]+\.[0-9]+)\..*/\1/')"   # v-optional (OCI chart tags carry none)
      lane="${lane//./\\.}"
      echo "$1" | grep -E "^v?${lane}\." | sort -V | tail -1
    }
    
    sub_major_latest() {  # $1 = newline-separated tags, $2 = pin → newest tag in the pin's MAJOR (minor candidate)
      local major
      major="$(echo "$2" | sed -E 's/^v?([0-9]+)\..*/\1/')"
      major="${major//./\\.}"
      echo "$1" | grep -E "^v?${major}\." | sort -V | tail -1
    }
    
    sub_advisories() {  # human summary of upstream classes ahead beyond the propagated lane
      local cls pol
      cls=$(sub_class "$LATEST" "$PIN")
      [ "$cls" = "same" ] && return 0
      pol=$(read_yaml ".policy.$cls.propagate // \"auto\"")
      case "$cls" in
        patch)
          # a patch gap is the auto lane's own work — no review ask, just pending
          echo "ADVISORY: patch $LATEST ahead of pin $PIN — auto-propagates on the next live run"
          ;;
        major)
          echo "ADVISORY: upstream major release $LATEST ahead of pin $PIN — policy: major bump = evaluation required"
          ;;
        *)
          echo "ADVISORY: upstream $cls release $LATEST ahead of pin $PIN — policy: $cls bump = manual merge + validation contract"
          ;;
      esac
    }
    
    sub_lockstep_note() {
      local note
      note=$(read_yaml '.lockstep[]' 2>/dev/null || true)
      if [ -n "$note" ]; then
        echo "Lockstep expectations (alert-level):"
        echo "$note" | sed 's/^/  - /'
      fi
    }
    
    # ── phase: merge (detect → policy guard → delegate propagation) ──────────────
    phase_subtree_merge() {
      sub_parse_cfg
      if [ "$PHASED" = "1" ]; then
        WORKDIR="${HARMOSTES_WORKDIR:-/tmp}"; WORKDIR="${WORKDIR%/}/fork-${FORK_NAME}"
        rm -rf "$WORKDIR"; mkdir -p "$(dirname "$WORKDIR")"
      else
        WORKDIR=$(mktemp -d)
      fi
    
      echo ""
      echo "=== Cloning target repo (shallow): $SUB_URL @ $SUB_BRANCH ==="
      git clone --depth 50 --branch "$SUB_BRANCH" "$SUB_URL" "$WORKDIR"
      cd "$WORKDIR"
      FORK_URL="$SUB_URL"
      # shellcheck source=scripts/git-host.sh
      # shellcheck disable=SC1091
      source "$SCRIPT_DIR/git-host.sh"
      host_setup
    
      PIN=$(sub_read_pin "$WORKDIR")
      if [ -z "$PIN" ]; then
        echo "ERROR: pin file '$SUB_PIN_FILE' carries no version" >&2; exit 1
      fi
      echo "$PIN" | grep -qE "$SELECTOR" || { echo "ERROR: pin '$PIN' does not match selector '$SELECTOR'" >&2; exit 1; }
    
      case "$UPSTREAM_URL" in
        oci://*)
          UPSTREAM_TAGS=$(oci_tags "$UPSTREAM_URL" | grep -E "$SELECTOR" | sort -V)
          ;;
        *)
          UPSTREAM_TAGS=$(git ls-remote --tags "$UPSTREAM_URL" 2>/dev/null | sed 's#.*refs/tags/##' \
                          | grep -E "$SELECTOR" | grep -v '\^{}$' | sort -V)
          ;;
      esac
      LATEST=$(echo "$UPSTREAM_TAGS" | tail -1)
      if [ -z "$LATEST" ]; then
        echo "ERROR: no upstream tags match selector '$SELECTOR' at $UPSTREAM_URL" >&2; exit 1
      fi
      echo "=== detect: pin=$PIN  upstream latest=$LATEST ==="
    
      # Decide from the pin's LANE first: a patch-class bump in the pin's own
      # major.minor line is the auto-propagatable unit (auto-merge after CI watch).
      # Next, the newest MINOR in the pin's major propagates as a prepared PR with
      # manual merge (policy minor.propagate=auto) — humans review and run smoke.
      # A newer MAJOR is an advisory, never the bump.
      LANE_TAG=$(sub_lane_latest "$UPSTREAM_TAGS" "$PIN")
      LANE_CLASS=$(sub_class "${LANE_TAG:-$PIN}" "$PIN")
      CLASS=$(sub_class "$LATEST" "$PIN")   # overall-latest class (for verdicts/advisories)
    
      if [ "$LANE_CLASS" = "patch" ]; then
        # patch bump available — the patch lane's policy decides
        POLICY_PROP=$(read_yaml '.policy.patch.propagate // "auto"')
        ADVISORIES=$(sub_advisories)
        if [ "$POLICY_PROP" != "auto" ]; then
          echo "=== Patch $LANE_TAG available — policy: propagate=$POLICY_PROP, verdict only ==="
          [ -n "$ADVISORIES" ] && echo "$ADVISORIES"
          sub_lockstep_note
          [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" merge "patch $LANE_TAG available — propagate=$POLICY_PROP"
          exit 0
        fi
        CLASS=patch   # what we are propagating — downstream phases (pr/tag) key off this
      else
        # lane current — minor-of-major or verdict
        if [ "$CLASS" = "same" ]; then
          echo "=== Up to date: pin $PIN is the newest upstream tag ==="
          [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" merge "up to date — pin $PIN"
          exit 0
        fi
        ADVISORIES=$(sub_advisories)
        # Minor candidate: newest tag sharing the pin's MAJOR (pin v12.7.3 → newest
        # v12.*). A newer overall major upstream does NOT suppress it — the bump
        # matrix treats minors as review-gated bumps, majors as evaluations.
        local minor_tag minor_policy
        minor_tag=$(sub_major_latest "$UPSTREAM_TAGS" "$PIN")
        minor_policy=$(read_yaml '.policy.minor.propagate // "auto"')
        if [ -n "$minor_tag" ] && [ "$minor_tag" != "$PIN" ] && [ "$minor_policy" = "auto" ]; then
          # The plugin PREPARES the PR (delegate does the vendoring); merge is
          # manual by hard policy — only the patch class may auto-merge. Humans
          # review the changelog/CVEs and run the validation contract (smoke).
          echo "=== minor-class $minor_tag — policy: propagate=auto, PR waits for manual merge (+ validation contract) ==="
          [ -n "$ADVISORIES" ] && echo "$ADVISORIES"
          LANE_TAG="$minor_tag"   # what we propagate is the newest minor
          CLASS=minor              # ...and the propagation class IS minor
        else
          POLICY_PROP=$(read_yaml ".policy.$CLASS.propagate // \"auto\"")
          echo "=== Pin's lane is current; $CLASS-class $LATEST — policy: propagate=$POLICY_PROP, verdict only ==="
          [ -n "$ADVISORIES" ] && echo "$ADVISORIES"
          sub_lockstep_note
          [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" merge "$CLASS-class $LATEST — propagate=$POLICY_PROP"
          exit 0
        fi
      fi
    
      SYNC_BRANCH="rezus/sync-subtree-${FORK_NAME}-${LANE_TAG#v}"
      if [ "${DRY_RUN:-0}" = "1" ]; then
        echo "=== DRY RUN — plan (nothing written) ==="
        echo "  branch:      $SYNC_BRANCH (off $SUB_BRANCH)"
        echo "  propagate:   $SUB_SYNC_CMD $LANE_TAG"
        echo "  gate:        pristine diff vs ${SUB_ARCHIVE/\{tag\}/$LANE_TAG}"
        echo "  pr:          → $SUB_BRANCH"
        [ -n "$ADVISORIES" ] && echo "  $ADVISORIES"
        sub_lockstep_note
        [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" merge "dry-run: would propagate $LANE_TAG"
        exit 0
      fi
    
      echo ""
      echo "=== Branching $SYNC_BRANCH off $SUB_BRANCH ==="
      git checkout -b "$SYNC_BRANCH"
    
      echo "=== Propagating via delegate: $SUB_SYNC_CMD $LANE_TAG ==="
      UPSTREAM_OCI="$UPSTREAM_URL" bash "$SUB_SYNC_CMD" "$LANE_TAG"   # the plugin knows the upstream; the delegate honors it
    
      git add -A
      if [ -z "$(git status --porcelain)" ]; then
        echo "ERROR: delegate produced no changes for $LANE_TAG — silent no-op, refusing" >&2
        exit 1
      fi
      git commit --quiet -m "chore(sync-${FORK_NAME}): vendor ${LANE_TAG}"
      echo "  committed vendored ${LANE_TAG}"
    
      STATE_FILE="$WORKDIR/.git/harmostes-state.env"
      sub_state_save
      [ "$PHASED" = "1" ] && result_json true "fork-sync-$FORK_NAME" merge "propagated $LANE_TAG (patch-class, auto)"
      return 0
    }
    
    # ── phase: gates (pristine diff vs the upstream archive) ─────────────────────
    phase_subtree_gates() {
      sub_cd_repo
      sub_parse_cfg
      TMP=$(mktemp -d)
      trap 'rm -rf "$TMP"' EXIT
      local src_dir
      src_dir="$(sub_fetch_upstream_tree "$LANE_TAG")" || exit 1
      echo ""
    
      if [ -z "$SUB_PATCHES_FILE" ] || [ ! -f "$SUB_PATCHES_FILE" ]; then
        # ── pristine gate (no patch contract) ──
        echo "=== Pristine gate: vendored tree vs upstream at $LANE_TAG ==="
        # --strip-trailing-cr: the target repo's EOL normalization policy is not drift.
        if diff -r --strip-trailing-cr "$src_dir" "$SUB_PATH" >/dev/null; then
          echo "  pristine: OK — byte-identical to upstream $LANE_TAG (modulo EOL policy)"
        else
          echo "  pristine: DRIFT — the delegate left unaccounted edits in $SUB_PATH" >&2
          diff -rq --strip-trailing-cr "$src_dir" "$SUB_PATH" | head -20 >&2
          exit 1
        fi
      else
        # ── patch-accounting gate: the diff must be exactly the declared contract ──
        echo "=== Patch-accounting gate: $SUB_PATH vs upstream $LANE_TAG (contract: $SUB_PATCHES_FILE) ==="
        local red=0
        local d line rel
        while IFS= read -r d; do
          case "$d" in
            "Files $src_dir"*)
              rel=$(echo "$d" | sed -E "s#^Files $src_dir/(.*) and .*#\1#")
              local sig
              sig=$(yq -r ".patches[] | select(.path == \"$rel\") | .signature" "$SUB_PATCHES_FILE" 2>/dev/null)
              if [ -z "$sig" ] || [ "$sig" = "null" ]; then
                echo "  RED: $rel differs from upstream and is not in the patch contract" >&2; red=1
              elif ! grep -qF -- "$sig" "$SUB_PATH/$rel" 2>/dev/null; then
                echo "  RED: $rel differs but signature '$sig' not found — patch unaccounted or rebased away" >&2; red=1
              else
                echo "  patch: OK — $rel (signature '$sig' present)"
              fi
              ;;
            "Only in $SUB_PATH"*)
              rel=$(echo "$d" | sed -E "s#^Only in $SUB_PATH/?(.*): (.*)#\1/\2#" | sed 's#^/##')
              if yq -r ".preserve[]" "$SUB_PATCHES_FILE" 2>/dev/null | grep -qxF "$(echo "$rel" | sed -E 's#^([^/]+/).*#\1#')" \
                 || yq -r ".preserve[]" "$SUB_PATCHES_FILE" 2>/dev/null | grep -qxF "$rel"; then
                echo "  preserve: OK — $rel (locally-added, declared)"
              else
                echo "  RED: $rel exists only locally and is not in the preserve list" >&2; red=1
              fi
              ;;
            "Only in $src_dir"*)
              rel=$(echo "$d" | sed -E "s#^Only in $src_dir/?(.*): (.*)#\1/\2#" | sed 's#^/##')
              echo "  RED: $rel exists upstream but is missing from $SUB_PATH — deletions are not modeled" >&2; red=1
              ;;
          esac
        done < <(diff -rq --strip-trailing-cr "$src_dir" "$SUB_PATH" 2>/dev/null)
        # preserve entries are promises of PRESENCE (a vanished preserved file is
        # invisible to the diff — nothing catches it otherwise)
        while IFS= read -r p; do
          [ -z "$p" ] && continue
          [ -e "$SUB_PATH/$p" ] || { echo "  RED: preserve entry $p missing from $SUB_PATH" >&2; red=1; }
        done < <(yq -r '.preserve[]' "$SUB_PATCHES_FILE" 2>/dev/null)
        # stale patches: declared but no longer differing
        while IFS= read -r p; do
          [ -z "$p" ] && continue
          if [ ! -e "$SUB_PATH/$p" ]; then
            echo "  RED: patch entry $p missing from $SUB_PATH" >&2; red=1
          elif diff -q --strip-trailing-cr "$src_dir/$p" "$SUB_PATH/$p" >/dev/null 2>&1; then
            echo "  WARN: patch entry $p is byte-identical to upstream — stale contract entry"
          fi
        done < <(yq -r '.patches[].path' "$SUB_PATCHES_FILE" 2>/dev/null)
        [ "$red" = "1" ] && { echo "  patch-accounting: RED — unaccounted differences in $SUB_PATH" >&2; exit 1; }
        echo "  patch-accounting: OK — every difference is declared and signed"
      fi
      sub_lockstep_note
      [ "$PHASED" = "1" ] && result_json true "fork-sync-$FORK_NAME" gates "${SUB_PATCHES_FILE:+patches accounted vs }$LANE_TAG"
      return 0
    }
    
    # ── phase: pr (push → PR → CI watch → merge strictly per policy) ─────────────
    phase_subtree_pr() {
      sub_cd_repo
      local merge_policy
      merge_policy=$(read_yaml '.policy.patch.merge // "manual"')
      [ "$CLASS" = "patch" ] || merge_policy="manual"   # only the auto class may auto-merge
    
      if [ "${DRY_RUN:-0}" = "1" ]; then
        echo "=== DRY RUN — PR plan (nothing pushed) ==="
        echo "  push:   $SYNC_BRANCH → origin"
        echo "  PR:     $SYNC_BRANCH → $SUB_BRANCH"
        echo "  merge:  policy.$CLASS.merge=$merge_policy (auto merges only after host_pr_watch sees the PR CI green)"
        [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" pr "dry-run: PR planned"
        exit 0
      fi
    
      echo ""
      echo "=== Pushing $SYNC_BRANCH ==="
      push_sync_branch 2>&1 || { echo "ERROR: failed to push sync branch" >&2; exit 3; }
    
      local pr_title="chore(sync-${FORK_NAME}): vendor ${LANE_TAG} (${CLASS}-class)"
      local pr_body
      pr_body="## Vendored-tree sync: ${FORK_NAME} → ${LANE_TAG}"
      pr_body+=$'\n\n'
      pr_body+="**Pin**: ${PIN} → **${LANE_TAG}** (${CLASS}-class; policy merge=${merge_policy})"$'\n'
      pr_body+="**Upstream newest**: ${LATEST}"$'\n\n'
      if [ -n "${ADVISORIES:-}" ]; then pr_body+="${ADVISORIES}"$'\n\n'; fi
      local validate_list
      validate_list=$(read_yaml '.validate // []' | sed 's/^- //')
      if [ -n "$validate_list" ]; then
        pr_body+="### Validation contract"$'\n'
        while IFS= read -r v; do
          [ -n "$v" ] && pr_body+="- [ ] ${v}"$'\n'
        done <<EOF
    $validate_list
    EOF
        pr_body+=$'\n'
      fi
      pr_body+="### Pristine gate"$'\n'"Byte-diff of \`${SUB_PATH}/\` against the upstream archive at ${LANE_TAG} — green in the run logs."$'\n\n'
      pr_body+="### Release"$'\n'"Rides the target repo's tag cycle (\`v*-rezus.*\`) — this PR does not release."$'\n\n'
      pr_body+="---"$'\n\n_Automated by the fork-maintenance workflow (subtree mode) — k8s-config GitOps._'$'\n'
    
      local label="needs-review"
      [ "$merge_policy" = "auto" ] && label="auto-merge"
      host_label_create "$label" 0E8A16 2>/dev/null || true
    
      echo "=== Opening PR ==="
      local pr_url
      pr_url=$(host_pr_create "$SUB_BRANCH" "$SYNC_BRANCH" "$pr_title" "$pr_body" "$label") || {
        echo "WARNING: failed to open PR: $pr_url" >&2
      }
      echo "  PR: ${pr_url:-<none>} (label: $label)"
    
      if [ "$merge_policy" = "auto" ]; then
        echo ""
        echo "=== Watching PR CI (auto-merge only on green — never red) ==="
        if host_pr_watch "$SYNC_BRANCH"; then
          local merge_sha
          merge_sha=$(host_pr_merge "$SYNC_BRANCH" 2>&1) || {
            echo "WARNING: auto-merge failed: $merge_sha" >&2
          }
          [ "$PHASED" = "1" ] && result_json true "fork-sync-$FORK_NAME" pr "PR merged (${merge_sha:0:12})"
        else
          echo "  CI red or pending — PR left open for review (never merge red)"
          [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" pr "PR left open — CI not green"
        fi
      else
        [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" pr "PR left for review (policy merge=$merge_policy)"
      fi
      return 0
    }
    
    # ── phase: tag (structural: releases ride the target repo's tag) ─────────────
    phase_subtree_tag() {
      sub_cd_repo
      local latest_release
      latest_release=$(git ls-remote --tags origin 'refs/tags/v*-rezus.*' 2>/dev/null \
                       | sed 's#.*refs/tags/##' | sort -V | tail -1)
      local note="releases ride the target repo's tag cycle (structural)"
      if [ -n "$LANE_TAG" ] && [ -n "$latest_release" ]; then
        local cls; cls=$(sub_class "$latest_release" "$LANE_TAG")
        [ "$cls" != "same" ] && note="unreleased-pending: vendored ${LANE_TAG}, latest target release ${latest_release}"
      fi
      echo "=== $note ==="
      [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" tag "$note"
      return 0
    }
    
    # ── phase: validate (subtree validation IS the target repo's CI) ─────────────
    phase_subtree_validate() {
      sub_cd_repo
      echo "=== Subtree validation = the target repo's own CI (watched in the pr phase) ==="
      [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" validate "monorepo-ci is the validation surface"
      return 0
    }
    
    subtree_dispatch() {
      case "$PHASE" in
        merge)    phase_subtree_merge ;;
        gates)    phase_subtree_gates ;;
        validate) phase_subtree_validate ;;
        pr)       phase_subtree_pr ;;
        tag)      phase_subtree_tag ;;
        all)
          # Single-shot: propagate → gate → PR. Exit codes match merge-mode all:
          # 0 = up to date / PR opened (auto-merged if policy allows); 3 = push failure.
          phase_subtree_merge
          phase_subtree_gates
          phase_subtree_pr
          phase_subtree_tag
          echo ""
          echo "=== Subtree sync complete ==="
          echo "  Pin: $PIN → $LANE_TAG ($CLASS-class)"
          [ -n "${ADVISORIES:-}" ] && echo "  $ADVISORIES"
          ;;
        *) echo "ERROR: unknown phase '$PHASE'" >&2; exit 1 ;;
      esac
    }
    
  mapping-mode.sh: |
    #!/usr/bin/env bash
    # mapping-mode.sh — mode: mapping (the forgejo self-sync, in the plugin)
    # =============================================================================
    # Sourced by sync-fork.sh when the def carries `mode: mapping`. Reproduces
    # sync.yml's mapping-table walk with plugin conventions; the equivalence
    # checklist (docs/forgejo-cutover.md) is the contract this implements:
    #
    #   per row (theirs → ours):
    #     1. ours ⊇ theirs already → no-op verdict (the common case)
    #     2. merge --no-ff "RZ/sync: <theirs> → <ours> (DATE)"
    #     3. validation delegate (repo-local, called with the merge-base):
    #        green AND its regen output (SDK/tidy) commits on top as
    #        "RZ/sync: post-merge regen for <theirs>"
    #     4. direct push to ours on green — the green run IS the review
    #     5. conflicts: force-push conflict/<theirs>-<date> + ONE PR labelled
    #        needs-conflict-resolution (conflict-resolver machinery downstream)
    #   A sync NEVER mints a version (tags: derive — deliberate cuts only).
    #
    # Phases: merge|all — the row walk is atomic (validate runs per-merge,
    # repo-locally). gates/pr/tag are structural no-ops here: there is no PR
    # to watch for clean merges, and releases are deliberate.
    # =============================================================================
    
    MAPPING_VALIDATE_CMD=$(read_yaml '.validation_command // ".github/fork/sync-validate.sh"')
    
    mapping_walk() {
      local rows theirs ours conflicted=0 changed=0 base sync_date row_n=0
      rows=$(read_yaml '.mappings[] | .theirs + " " + .ours')
      sync_date=$(date +%F)
    
      while read -r theirs ours; do
        [ -z "$theirs" ] && continue
        row_n=$((row_n + 1))
        echo ""
        echo "══ row: $theirs → $ours ══"
    
        git fetch -q upstream "$theirs" 2>/dev/null || { echo "ERROR: upstream has no $theirs" >&2; return 1; }
        git fetch -q origin "$ours"
    
        if git merge-base --is-ancestor "upstream/$theirs" "origin/$ours"; then
          echo "  ⊇ holds — no-op"
          continue
        fi
    
        base=$(git rev-parse "origin/$ours")
        git checkout -q -B sync-work "origin/$ours"
    
        if git merge --no-ff --no-edit \
             -m "RZ/sync: $theirs → $ours ($sync_date)" \
             "upstream/$theirs"; then
          echo "  merged clean — validating (repo-local delegate: $MAPPING_VALIDATE_CMD)"
          if bash "$MAPPING_VALIDATE_CMD" "$base"; then
            # Regen output (SDK/tidy) rides on top of the merge commit.
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git add -A
              git commit -q -m "RZ/sync: post-merge regen for $theirs"
            fi
            git push origin "HEAD:$ours"
            changed=1
            echo "  pushed — invariant restored (dev-build fires)"
          else
            echo "ERROR: validation failed for $theirs → $ours; nothing pushed" >&2
            return 1
          fi
        else
          echo "  conflicts — concluding with markers for resolution"
          conflicted=1
          git add -A 2>/dev/null || true
          git commit --no-edit --quiet 2>/dev/null || true
          local conflict_branch="conflict/$(echo "$theirs" | tr '/' '-')-$sync_date"
          git push --force-with-lease origin "HEAD:$conflict_branch"
          local pr_url
          pr_url=$(host_pr_create "$ours" "$conflict_branch" \
            "sync: $theirs → $ours needs conflict resolution ($sync_date)" \
            "Upstream moved into files our delta touches. Resolve the 3-way regions on this branch (the rezus intent lives in our side of each marker); merging this PR restores \`ours ⊇ theirs\`." \
            needs-conflict-resolution) || echo "  (PR may already exist)"
          echo "  conflict PR: ${pr_url:-<none>} (label: needs-conflict-resolution)"
        fi
      done <<< "$rows"
    
      if [ "$conflicted" = "1" ]; then
        echo "::notice::one or more rows await conflict resolution (PRs above)"
        [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" merge "conflicts — PRs open for resolution"
        return 0
      fi
      if [ "$changed" = "1" ]; then
        [ "$PHASED" = "1" ] && result_json true "fork-sync-$FORK_NAME" merge "row(s) merged+validated+pushed"
      else
        [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" merge "no-op — invariant holds"
      fi
      return 0
    }
    
    mapping_dispatch() {
      case "$PHASE" in
        merge|all)
          echo "=== [$PHASE] fork: $FORK_NAME (mode: mapping) ==="
          if [ "${DRY_RUN:-0}" = "1" ]; then
            echo "DRY RUN — fetch-only detect (nothing merged/pushed):"
            git ls-remote --heads "$UPSTREAM_URL" | head -5
            echo "  rows: $(read_yaml '.mappings[] | .theirs + " → " + .ours' | tr '\n' ';')"
            exit 0
          fi
          # Full-history clone: merge-base must not lie (sync.yml's fetch-depth 0).
          echo ""
          echo "=== Cloning target (FULL history) ==="
          WORKDIR=$(mktemp -d)
          git clone -q "$FORK_URL" "$WORKDIR"
          cd "$WORKDIR"
          # shellcheck source=scripts/git-host.sh
          # shellcheck disable=SC1091
          source "$SCRIPT_DIR/git-host.sh"
          host_setup
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || true
          mapping_walk
          ;;
        gates|validate)
          echo "=== [$PHASE] mapping mode: validation is repo-local and runs inside the row walk — structural no-op"
          [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" "$PHASE" "no-op (repo-local validation rides the merge phase)"
          ;;
        pr)
          echo "=== [$PHASE] mapping mode: clean merges push directly (green run IS the review); conflict PRs are opened during the walk — structural no-op"
          [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" pr "no-op (direct push; conflict PRs ride the walk)"
          ;;
        tag)
          echo "=== [$PHASE] mapping mode: a sync NEVER mints a version — tags are deliberate cuts (tags: derive) ==="
          [ "$PHASED" = "1" ] && result_json false "fork-sync-$FORK_NAME" tag "no-op (deliberate tags only)"
          ;;
        *) echo "ERROR: unknown phase '$PHASE'" >&2; exit 1 ;;
      esac
    }
    
  backport.sh: |
    #!/usr/bin/env bash
    # =============================================================================
    # backport.sh — agent-driven upstream backports
    # =============================================================================
    # Cherry-picks critical upstream fixes (security, data integrity) onto the
    # release branch ahead of the next upstream patch release, with RZ/bp:
    # provenance, through the same gate chain as a sync; the pi agent covers the
    # conflict case (same escalation contract as sync-fork.sh).
    #
    # Every backport lands through the SAME gate chain as a sync:
    #   cherry-pick (-x) → subject rewritten to "RZ/bp: <original>" →
    #   marker scan → validate-fork.sh → verify-patches.sh → PR → auto-merge
    #
    # No release is cut here: a backport only advances the release branch; the
    # next sync's auto-release (or a manual v*-rezus.N tag) builds the image.
    #
    # Usage: backport.sh <fork-name> <upstream-sha> [<upstream-sha> ...]
    # Exit codes:
    #   0 — backported (PR merged if auto.merge)
    #   2 — cherry-pick conflict (partial work pushed; agent runbook applies)
    #   3 — push failure
    # =============================================================================
    set -euo pipefail
    
    FORK_NAME="${1:?Usage: backport.sh <fork-name> <upstream-sha> [...]}"
    shift
    [ "$#" -ge 1 ] || { echo "ERROR: at least one upstream SHA required" >&2; exit 1; }
    
    MAINT_DIR="${MAINT_DIR:-$(cd "$(dirname "$0")/.." && pwd)}"
    SCRIPT_DIR="$MAINT_DIR/scripts"
    SYNC_DATE="$(date -u +%Y-%m-%d)"
    WORKDIR="$(mktemp -d)"
    cleanup() { rm -rf "$WORKDIR"; }
    trap cleanup EXIT
    
    # shellcheck source=scripts/git-host.sh
    # shellcheck source=scripts/git-host.sh
    # shellcheck disable=SC1091
    source "$SCRIPT_DIR/git-host.sh"
    DEF="$MAINT_DIR/forks/${FORK_NAME}.yaml"
    [ -f "$DEF" ] || { echo "ERROR: no fork definition for $FORK_NAME" >&2; exit 1; }
    
    read_yaml() { yq e "$1" "$DEF"; }
    UPSTREAM_URL=$(read_yaml '.upstream.url')
    FORK_URL=$(read_yaml '.fork.url')
    # Release row: mapping-table defs carry theirs→ours rows; the release row is
    # the one with tags: derive. Legacy defs keep flat fields.
    if read_yaml '.mappings' >/dev/null 2>&1 && [ "$(read_yaml '.mappings | length')" != "0" ]; then
      UPSTREAM_BRANCH=$(read_yaml '[.mappings[] | select(.tags == "derive")][0].theirs')
      FORK_DEFAULT_BRANCH=$(read_yaml '[.mappings[] | select(.tags == "derive")][0].ours')
    else
      UPSTREAM_BRANCH=$(read_yaml '.upstream.branch')
      FORK_DEFAULT_BRANCH=$(read_yaml '.fork.default_branch')
    fi
    BP_BRANCH="rezus/bp-${SYNC_DATE}"
    
    echo "=== Backport: ${FORK_NAME} — $# upstream commit(s) → ${FORK_DEFAULT_BRANCH} ==="
    echo "  upstream: ${UPSTREAM_URL} (${UPSTREAM_BRANCH})"
    echo "  fork:     ${FORK_URL} (${FORK_DEFAULT_BRANCH})"
    
    # ── 1. Clone + fetch upstream ────────────────────────────────────────────────────
    echo ""
    echo "=== Cloning fork (shallow) ==="
    git clone --depth 100 "$FORK_URL" "$WORKDIR/repo"
    cd "$WORKDIR/repo"
    host_setup
    
    git remote add upstream "$UPSTREAM_URL"
    git fetch --depth 100 upstream "$UPSTREAM_BRANCH" --tags
    
    # ── 2. Verify every SHA is on the upstream release branch ───────────────────
    for SHA in "$@"; do
      if ! git merge-base --is-ancestor "$SHA" "upstream/${UPSTREAM_BRANCH}" 2>/dev/null; then
        echo "ERROR: ${SHA} is not on upstream/${UPSTREAM_BRANCH} — refusing to backport foreign commits" >&2
        exit 1
      fi
    done
    
    git checkout --quiet -b "$BP_BRANCH" "origin/$FORK_DEFAULT_BRANCH"
    
    # ── 3. Cherry-pick with the RZ/bp: convention ───────────────────────────────
    # -x records "(cherry picked from commit <sha>)" — the standard backport
    # provenance line; the subject gets the RZ/bp: prefix.
    PICKED=()
    for SHA in "$@"; do
      SUBJECT=$(git log -1 --format='%s' "$SHA")
      echo "  cherry-picking ${SHA:0:12} — ${SUBJECT}"
      if ! git cherry-pick -x "$SHA" >/dev/null 2>&1; then
        echo ""
        echo "=== Cherry-pick conflict on ${SHA:0:12} — escalating ==="
        git diff --name-only --diff-filter=U 2>/dev/null || true
        mkdir -p "$MAINT_DIR/manifests" 2>/dev/null || true
        NEEDS_FIX="$MAINT_DIR/manifests/${FORK_NAME}-needs-fix.json"
        cat > "$NEEDS_FIX" <<EOF
    {
      "kind": "backport-conflict",
      "fork": "${FORK_NAME}",
      "branch": "${BP_BRANCH}",
      "sha": "${SHA}",
      "subject": $(git log -1 --format='%s' "$SHA" | jq -Rs .),
      "files": $(git diff --name-only --diff-filter=U 2>/dev/null | jq -Rs .),
      "protocol": "Resolve the 3-way regions like a sync conflict (skill: fork-maintenance / conflict-resolution), reword the subject to RZ/bp:, then re-run the gates and push ${BP_BRANCH}."
    }
    EOF
        git push --quiet origin "$BP_BRANCH" --force-with-lease 2>/dev/null || true
        echo "  partial work pushed to ${BP_BRANCH}; manifest: ${NEEDS_FIX}"
        exit 2
      fi
      # Rewrite subject with the convention prefix; keep body + provenance line.
      git log -1 --format='%B' | sed "1s/^/RZ\/bp: /" | git commit --amend --quiet -F -
      PICKED+=("${SHA:0:12}")
    done
    
    echo ""
    echo "=== Backported: ${PICKED[*]} ==="
    
    # ── 4. Gates (the non-negotiables) ───────────────────────────────────────────
    MARKERS=$(git grep -l -E '^(<<<<<<<|>>>>>>>|=======) ' -- . 2>/dev/null || true)
    if [ -n "$MARKERS" ]; then
      echo "ERROR: conflict markers remain:" >&2; echo "$MARKERS" >&2; exit 2
    fi
    
    if [ -f "$MAINT_DIR/checks/validate-fork.sh" ]; then
      echo "=== Validating fork ==="
      VALIDATION_MD=$(bash "$MAINT_DIR/checks/validate-fork.sh" "$FORK_NAME" "$PWD") || {
        echo "ERROR: validation failed — see above" >&2; exit 2
      }
    else
      VALIDATION_MD="(no validator)"
    fi
    
    if [ -f "$MAINT_DIR/scripts/verify-patches.sh" ]; then
      echo "=== Verifying patches ==="
      bash "$MAINT_DIR/scripts/verify-patches.sh" "$DEF" "$PWD" || {
        echo "ERROR: patch signatures lost" >&2; exit 2
      }
    fi
    
    # ── 5. Push + PR + (opt-in) merge ───────────────────────────────────────────
    echo ""
    echo "=== Pushing ${BP_BRANCH} ==="
    git push --quiet origin "$BP_BRANCH" 2>&1 || { echo "ERROR: push failed" >&2; exit 3; }
    
    echo "=== Opening PR ==="
    host_label_create "auto-merge" 0E8A16 2>/dev/null || true
    PR_BODY="Backport of ${#PICKED[@]} upstream commit(s) onto \`${FORK_DEFAULT_BRANCH}\` (RZ/bp: convention).
    
    $(printf '%s\n' "${PICKED[@]}" | sed 's/^/- `/;s/$/`/')
    
    ${VALIDATION_MD}
    
    Cherry-picks carry \`(cherry picked from commit …)\` provenance lines. No release tag is cut: the next sync's auto-release builds the image."
    PR_URL=$(host_pr_create "$FORK_DEFAULT_BRANCH" "$BP_BRANCH" \
      "RZ/bp: ${#PICKED[@]} upstream commit(s) (${SYNC_DATE})" "$PR_BODY" "auto-merge")
    echo "  PR: ${PR_URL:-<none>}"
    
    AUTO_MERGE=$(read_yaml '.auto.merge // false')
    if [ "$AUTO_MERGE" = "true" ]; then
      echo "=== Auto-merging PR (gates green, auto.merge enabled) ==="
      MERGE_SHA=$(host_pr_merge "$BP_BRANCH" 2>&1) || echo "WARNING: merge failed: $MERGE_SHA" >&2
    fi
    
    echo ""
    echo "=== Backport complete ==="
    echo "  commits: ${#PICKED[@]}"
    echo "  PR: ${PR_URL:-<none>}"
    exit 0
    
  git-host.sh: |
    #!/usr/bin/env bash
    # =============================================================================
    # git-host.sh — Git-host abstraction for fork maintenance
    # =============================================================================
    # Sources by sync-fork.sh. Dispatches git-push, label, and PR creation to the
    # correct host API based on the fork definition's `fork.platform` field.
    #
    # Supported platforms:
    #   github  — uses the `gh` CLI (default; works for GitHub-hosted forks)
    #   forgejo — uses the Codeberg/Forgejo/Gitea REST API via curl (no `tea` dep)
    #
    # The fork definition declares its host:
    #
    #   fork:
    #     url: https://codeberg.org/rezuscloud/foo   # or github.com/...
    #     platform: forgejo                           # github (default) | forgejo
    #     api_url: https://codeberg.org/api/v1        # forgejo only — REST base
    #     token_env: CODEBERG_TOKEN                   # env var holding the PAT
    #                                                  # default: GITHUB_TOKEN (github)
    #                                                  #          CODEBERG_TOKEN (forgejo)
    #
    # Git push uses the credential helper regardless of platform — only the label
    # and PR creation differ (gh CLI vs REST). Auth is set up once via host_setup.
    # =============================================================================
    # Usage (from sync-fork.sh):
    #   source git-host.sh
    #   host_setup             # configure git auth + resolve platform/token
    #   host_label_create NAME COLOR
    #   host_pr_create BASE HEAD TITLE BODY LABEL  -> echoes PR URL
    # =============================================================================
    
    # Read a YAML path from the active fork definition ($DEF_FILE, set by caller).
    _git_host_ry() { yq -r "$1" "${DEF_FILE:?DEF_FILE must be set by caller}" 2>/dev/null; }
    
    # ---- accessors ---------------------------------------------------------------
    
    host_platform() {
      local p
      p=$(_git_host_ry '.fork.platform // .subtree.platform // "github"')
      case "$p" in github|forgejo|local) echo "$p" ;; *) echo "github" ;; esac
    }
    
    # Env var holding the PAT for this fork's host (defaults per platform).
    host_token_env() {
      local env_name platform
      env_name=$(_git_host_ry '.fork.token_env // .subtree.token_env // ""')
      if [ -z "$env_name" ]; then
        platform=$(host_platform)
        case "$platform" in
          forgejo) env_name="CODEBERG_TOKEN" ;;
          *)       env_name="GITHUB_TOKEN" ;;
        esac
      fi
      echo "$env_name"
    }
    
    # owner/repo parsed from fork.url (host-agnostic: works for github + codeberg).
    host_owner_repo() {
      _git_host_ry '.fork.url // .subtree.url' | sed -E 's#https?://[^/]+/([^/]+)/([^/]+)(\.git)?/?.*#\1/\2#'
    }
    
    # Bare hostname of the fork repo (for the git credential helper).
    host_git_host() {
      _git_host_ry '.fork.url // .subtree.url' | sed -E 's#(https?://[^/]+)/.*#\1#' | sed -E 's#https?://##'
    }
    
    # ---- one-time setup (call after cloning the fork) ---------------------------
    
    host_setup() {
      local platform token_env token
      platform=$(host_platform)
    
      # Local file:// repos (testing / local validation): no auth, no API.
      if [ "$platform" = "local" ]; then
        git config --global user.name "fork-maintenance-bot" 2>/dev/null || true
        git config --global user.email "flux@rezus.cloud" 2>/dev/null || true
        echo "[git-host] platform=local repo=$FORK_URL (no auth)"
        return 0
      fi
    
      token_env=$(host_token_env)
      token="${!token_env:-}"   # expand the env var named by token_env
    
      if [ -z "$token" ]; then
        echo "ERROR: token env var '$token_env' is empty for fork '$FORK_NAME'" >&2
        return 1
      fi
      export FORK_TOKEN="$token"
    
      # Git push works identically on both platforms via the credential helper.
      git config --global user.name "fork-maintenance-bot" 2>/dev/null || true
      git config --global user.email "flux@rezus.cloud" 2>/dev/null || true
      git config --global credential.helper store 2>/dev/null || true
      local gh_host
      gh_host=$(host_git_host)
      echo "https://x-access-token:${token}@${gh_host}" > ~/.git-credentials
      chmod 600 ~/.git-credentials
    
      case "$platform" in
        github)
          export GH_TOKEN="$token"
          ;;
        forgejo)
          local api
          api=$(_git_host_ry '.fork.api_url // ""')
          if [ -z "$api" ]; then
            echo "ERROR: forgejo fork '$FORK_NAME' requires fork.api_url (REST base)" >&2
            return 1
          fi
          export FORGEJO_API="$api"
          ;;
      esac
      echo "[git-host] platform=$platform token_env=$token_env repo=$(host_owner_repo)"
    }
    
    # ---- label creation ----------------------------------------------------------
    
    host_label_create() {
      local label="$1" color="${2:-0E8A16}"
      local platform owner_repo
      platform=$(host_platform)
      owner_repo=$(host_owner_repo)
    
      case "$platform" in
        github)
          # --repo accepts OWNER/REPO; full git URLs are not reliably resolved.
          gh label create "$label" --repo "$owner_repo" --color "$color" \
            --if-not-exists --quiet 2>/dev/null || true
          ;;
        forgejo)
          # Codeberg/Gitea expects color WITH leading '#'.
          curl -sf -X POST "${FORGEJO_API}/repos/${owner_repo}/labels" \
            -H "Authorization: token ${FORK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${label}\",\"color\":\"#${color}\"}" >/dev/null 2>&1 || true
          ;;
        local) ;;  # no-op
      esac
    }
    
    # ---- PR creation (echoes the new PR URL on success) --------------------------
    
    host_pr_create() {
      local base="$1" head="$2" title="$3" body="$4" label="${5:-}"
      local platform owner_repo
      platform=$(host_platform)
      owner_repo=$(host_owner_repo)
    
      case "$platform" in
        github)
          # First attempt with the label; fall back without it (label/perm issues).
          gh pr create --repo "$FORK_URL" --base "$base" --head "$head" \
            --title "$title" ${label:+--label "$label"} --body "$body" 2>&1 || \
            gh pr create --repo "$FORK_URL" --base "$base" --head "$head" \
              --title "$title" --body "$body" 2>&1
          ;;
        local)
          # No PR API on a file:// repo; report a synthetic URL. The merge itself
          # is performed by host_pr_merge (local git merge into the default branch).
          echo "local://${FORK_URL}#${head}"
          ;;
        forgejo)
          local body_json pr_url
          body_json=$(printf '%s' "$body" | jq -Rs .)
          pr_url=$(jq -n \
            --arg head "$head" --arg base "$base" --arg title "$title" \
            --argjson body "$body_json" \
            '{head:$head, base:$base, title:$title, body:$body}' \
            | curl -sf -X POST "${FORGEJO_API}/repos/${owner_repo}/pulls" \
                -H "Authorization: token ${FORK_TOKEN}" \
                -H "Content-Type: application/json" \
                -d @-)
          echo "$pr_url" | jq -r '.html_url // "ERROR: PR creation failed"' 2>&1
          # Attach the label to the new PR if provided.
          if [ -n "$label" ] && [ -n "$pr_url" ]; then
            local index
            index=$(echo "$pr_url" | jq -r '.number // empty' 2>/dev/null)
            [ -n "$index" ] && curl -sf -X POST \
              "${FORGEJO_API}/repos/${owner_repo}/issues/${index}/labels" \
              -H "Authorization: token ${FORK_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"labels\":[\"${label}\"]}" >/dev/null 2>&1 || true
          fi
          ;;
      esac
    }
    
    # ---- PR merge ---------------------------------------------------------------
    # Merges the sync branch's PR into the release branch. Merge model: the sync
    # branch is release + one upstream merge, so a normal PR merge (fast-forward when
    # possible) advances the release cleanly — APPEND-ONLY, never force-replace (that
    # would destroy the immutable history that is the whole point of the merge model).
    # Echoes the new release-branch HEAD SHA on success; returns non-zero on failure.
    host_pr_merge() {
      local pr_ref="$1"   # sync branch name (PR head); PR number resolved per host
      local platform owner_repo num
      platform=$(host_platform)
      owner_repo=$(host_owner_repo)
    
      case "$platform" in
        github)
          num=$(gh pr list --repo "$FORK_URL" --head "$pr_ref" --state open \
                --json number -q '.[0].number' 2>/dev/null || true)
          [ -n "$num" ] && gh pr merge "$num" --repo "$FORK_URL" --merge 2>&1 >/dev/null
          ;;
        forgejo)
          num=$(curl -sf "${FORGEJO_API}/repos/${owner_repo}/pulls?state=open" \
                -H "Authorization: token ${FORK_TOKEN}" 2>/dev/null \
                | jq -r --arg h "$pr_ref" '.[] | select(.head.ref==$h) | .number' 2>/dev/null | head -1 || true)
          [ -n "$num" ] && curl -sf -X POST "${FORGEJO_API}/repos/${owner_repo}/pulls/${num}/merge" \
                -H "Authorization: token ${FORK_TOKEN}" -H "Content-Type: application/json" \
                -d '{"Do":"merge"}' >/dev/null 2>&1
          ;;
        local)
          # Merge model: merge the sync branch INTO the release (append). Fast-forward
          # when the release hasn't moved; otherwise a normal merge commit.
          git checkout "$FORK_DEFAULT_BRANCH" 2>/dev/null || git checkout -b "$FORK_DEFAULT_BRANCH"
          git merge --ff-only "$pr_ref" >/dev/null 2>&1 || git merge --no-edit "$pr_ref" >/dev/null 2>&1
          ;;
      esac
    
      # Echo the new release-branch HEAD (caller re-syncs + tags from this).
      git fetch --quiet origin "$FORK_DEFAULT_BRANCH" 2>/dev/null || true
      git rev-parse "origin/$FORK_DEFAULT_BRANCH" 2>/dev/null || git rev-parse HEAD
    }
    
    # ---- PR CI watch (subtree auto-merge guard — never merge red) ----------------
    
    host_pr_watch() {
      # $1 = branch whose PR checks must be green. Blocks until terminal state
      # (60 min cap), returns non-zero if any check failed or the deadline passed.
      local branch="$1"
      case "$(host_platform)" in
        github)
          gh pr checks "$branch" --repo "$(host_owner_repo)" --watch --interval 20 >/dev/null 2>&1 || return 1
          gh pr checks "$branch" --repo "$(host_owner_repo)" --json state \
            -q 'length == 0 or all(.[]; .state == "SUCCESS")' 2>/dev/null | grep -q true
          ;;
        forgejo)
          # Poll the head commit's combined status until terminal.
          local deadline=$(( $(date +%s) + 3600 )) st sha
          sha=$(git rev-parse HEAD 2>/dev/null) || return 1
          while [ "$(date +%s)" -lt "$deadline" ]; do
            st=$(curl -sf -H "Authorization: token ${FORK_TOKEN}" \
                  "${FORGEJO_API}/repos/$(host_owner_repo)/commits/${sha}/status" \
                  | jq -r '.status // empty' 2>/dev/null) || { sleep 30; continue; }
            case "$st" in
              success) return 0 ;;
              failure|error) return 1 ;;
            esac
            sleep 30
          done
          return 1
          ;;
        local) return 0 ;;   # file:// repos have no CI surface
      esac
    }
    
  resolve-conflict.sh: |
    #!/usr/bin/env bash
    # =============================================================================
    # resolve-conflict.sh — merge + harmostes-orchestrated agent + gate/deploy
    # =============================================================================
    # sync-fork.sh merges the upstream release branch into the fork's release branch
    # (off a sync branch); on conflict it opens a needs-conflict-resolution PR +
    # emits fork.conflict.needs-resolution. THIS script is the consumer: it REDOES
    # the merge (Phase 1) and, where it conflicts, hands the work to harmostes
    # (Phase 2) — a shared pi.dev RPC orchestrator (github.com/tibrezus/harmostes)
    # that runs ONE warm agent session: the agent resolves the merge's localized
    # 3-way regions + pushes, harmostes runs gate-resolved.sh (markers +
    # validate-fork.sh + signatures), and on failure feeds the error back to the
    # SAME session (the agent keeps context) up to N fixes. Only a green gate
    # deploys. Then this script PR-merges the sync branch into the release + releases.
    #
    # This replaces the old `pi --print` + cold-reinvoke-on-failure loop: warm
    # session continuation + full tool-call observability + a tool allowlist.
    #
    # Usage: resolve-conflict.sh <fork-name>
    # Env:   ZAI_API_KEY|LLM_WIKI_ZAI_TOKEN, <host token>, RESOLVER_MODEL, SKILL_PATH,
    #        MAINT_DIR, HARMOSTES (default 'harmostes'), FORK_MAINTENANCE_WIKI,
    #        RESOLVER_FIX_RETRIES (default 3), RESOLVER_TIMEOUT (default 1800)
    # =============================================================================
    set -euo pipefail
    
    FORK_NAME="${1:?Usage: resolve-conflict.sh <fork-name>}"
    SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    MAINT_DIR="${MAINT_DIR:-$(dirname "$SCRIPT_DIR")}"
    DEF_FILE="$MAINT_DIR/forks/${FORK_NAME}.yaml"
    MODEL="${RESOLVER_MODEL:-zai/glm-5.2}"
    SKILL_PATH="${SKILL_PATH:-$HOME/.agents/skills/fork-maintenance/SKILL.md}"
    WIKI_REPO="${FORK_MAINTENANCE_WIKI:-https://github.com/rezuscloud/llm-wiki}"
    HARMOSTES="${HARMOSTES:-harmostes}"
    
    [ -f "$DEF_FILE" ] || { echo "ERROR: fork definition not found: $DEF_FILE" >&2; exit 1; }
    if [ -z "${ZAI_API_KEY:-}" ] && [ -n "${LLM_WIKI_ZAI_TOKEN:-}" ]; then export ZAI_API_KEY="$LLM_WIKI_ZAI_TOKEN"; fi
    [ -n "${ZAI_API_KEY:-}" ] || { echo "ERROR: ZAI_API_KEY not set" >&2; exit 1; }
    command -v pi >/dev/null 2>&1 || { echo "ERROR: pi not on PATH" >&2; exit 1; }
    # Resolve the harmostes binary into an ARRAY so a "python3 /path/harmostes.py"
    # value word-splits correctly (a quoted scalar would be one command name →
    # exit 127). Honors $HARMOSTES, else 'harmostes' on PATH, else the baked-in .py.
    if [ -n "${HARMOSTES:-}" ]; then
        read -ra HARMOSTES_CMD <<<"$HARMOSTES"
    elif command -v harmostes >/dev/null 2>&1; then
        HARMOSTES_CMD=(harmostes)
    elif [ -x /usr/local/bin/harmostes.py ]; then
        HARMOSTES_CMD=(python3 /usr/local/bin/harmostes.py)
    else
        echo "ERROR: harmostes not found" >&2; exit 1
    fi
    
    read_yaml() { yq -r "$1" "$DEF_FILE"; }
    FORK_URL=$(read_yaml '.fork.url')
    FORK_DEFAULT_BRANCH=$(read_yaml '.fork.default_branch')
    UPSTREAM_URL=$(read_yaml '.upstream.url')
    UPSTREAM_BRANCH=$(read_yaml '.upstream.branch')
    
    echo "=== resolve-conflict: $FORK_NAME (merge + harmostes) ==="
    source "$SCRIPT_DIR/git-host.sh"
    host_setup
    
    WORKDIR=$(mktemp -d)
    WIKI_DIR=$(mktemp -d)
    trap 'rm -rf "$WORKDIR" "$WIKI_DIR"' EXIT
    
    # ── Phase 1: clone fork + upstream + wiki; start the merge ───────────────────
    echo ""
    echo "=== Cloning fork + upstream ==="
    git clone --depth 100 "$FORK_URL" "$WORKDIR"
    cd "$WORKDIR"
    git remote add upstream "$UPSTREAM_URL"
    git fetch --depth 100 upstream "$UPSTREAM_BRANCH" --tags
    
    MERGE_BASE=$(git merge-base "HEAD" "upstream/$UPSTREAM_BRANCH" 2>/dev/null || echo "")
    SYNC_DATE=$(date +%Y-%m-%d)
    SYNC_BRANCH="rezus/sync-${SYNC_DATE}"
    
    # Merge model: branch off the RELEASE line and merge upstream into it (not
    # cherry-pick onto fresh upstream). This re-creates the exact conflict the plugin
    # hit, so the agent resolves the real 3-way regions.
    git checkout -b "$SYNC_BRANCH" "$FORK_DEFAULT_BRANCH"
    
    # Clone the org wiki for the fork's intent (the "Fork Maintenance" chapter).
    WIKI_PAGE=""
    if git clone --depth 1 "$WIKI_REPO" "$WIKI_DIR" 2>/dev/null; then
      for cand in "wiki/entities/${FORK_NAME}.md" "wiki/concepts/${FORK_NAME}.md"; do
        [ -f "$WIKI_DIR/$cand" ] && { WIKI_PAGE="$WIKI_DIR/$cand"; break; }
      done
    fi
    
    echo ""
    echo "=== Merging upstream/$UPSTREAM_BRANCH into $SYNC_BRANCH ==="
    NEEDS_LLM=0
    if ! git merge --no-ff --no-edit \
         -m "RZ/sync: merge upstream ${UPSTREAM_BRANCH} into ${FORK_DEFAULT_BRANCH} (${SYNC_DATE})" \
         "upstream/${UPSTREAM_BRANCH}"; then
      NEEDS_LLM=1
      echo "  merge stopped on a conflict — harmostes will drive it"
    else
      echo "  merge clean"
    fi
    
    # ── Phase 2: harmostes — agent task → gate → feedback-as-session-continuation ─
    # harmostes drives ONE warm pi RPC session. The agent resolves the merge's 3-way
    # conflict regions + pushes; harmostes runs gate-resolved.sh (markers +
    # validate-fork.sh + signatures); on failure it feeds the error back to the SAME
    # session up to RESOLVER_FIX_RETRIES. Exit 0 = gate green; 1 = failed after N; 2 = pi error.
    if [ "$NEEDS_LLM" = "1" ]; then
      CONFLICT_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null | grep -v '^$' || true)
      cat > "/tmp/resolve-${FORK_NAME}-task.txt" <<PROMPT
    You are resolving a git merge conflict.
    
    Working directory: $WORKDIR  (clone of the '$FORK_NAME' fork; on branch $SYNC_BRANCH,
    mid-merge — merging upstream $UPSTREAM_BRANCH into the release line. The merge
    brought upstream's delta ON TOP of our customizations; only the regions where
    upstream AND our patches both changed are in conflict.)
    
    Conflicted files right now (also see \`git status\`):
    $(echo "$CONFLICT_FILES" | sed 's/^/  - /')
    
    Intent context — READ THIS to know WHY each customization exists and how to port it:
    $([ -n "$WIKI_PAGE" ] && echo "  $WIKI_PAGE  (the \"## Fork Maintenance\" chapter)" || echo "  (no wiki chapter found — infer intent from the fork definition patches + the diff)")
      Skill: $SKILL_PATH  (references/conflict-resolution.md)
      Fork definition: $DEF_FILE  (patches with signatures + descriptions)
    
    Drive the merge to completion, in a loop:
    1. Resolve every conflicted file: remove ALL <<<<<<< / ======= / >>>>>>> markers,
       porting each customization onto upstream's new shape (use the wiki intent — a
       customization whose signature no longer matches means upstream changed the API
       it depends on: port it, never drop it). \`git add\` each resolved file.
    2. \`git merge --continue\` (concludes the merge with a commit). A single merge has
       one set of conflicts — if new ones appear after --continue, resolve them too.
    3. Repeat 1–2 until the merge is FINISHED: \`git status\` is clean (no unmerged
       paths) AND there is no merge in progress (\`test ! -e .git/MERGE_HEAD\`).
    4. Then:
           git push -f origin $SYNC_BRANCH
    5. STOP. Do NOT merge into the release, open/comment on PRs, or run validation.
       Pushing the clean branch ends your work — the gate runs separately.
    
    If a later validation gate fails (you'll be told the exact error in this same
    session), fix it on $SYNC_BRANCH and push again. The release branch is sacrosanct.
    PROMPT
    
      echo ""
      echo "=== harmostes: agent task → gate → feedback (warm pi RPC session) ==="
      set +e
      "${HARMOSTES_CMD[@]}" task \
        --skill "$SKILL_PATH" --model "$MODEL" --tools read,bash,edit,grep \
        --workdir "$WORKDIR" \
        --task-file "/tmp/resolve-${FORK_NAME}-task.txt" \
        --gate "bash '$MAINT_DIR/checks/gate-resolved.sh' '$FORK_NAME' '$WORKDIR'" \
        --max-fixes "${RESOLVER_FIX_RETRIES:-3}" \
        --log "/tmp/resolve-${FORK_NAME}-events.jsonl" \
        --timeout "${RESOLVER_TIMEOUT:-1800}"
      HARMOSTES_RC=$?
      set -e
      if [ "$HARMOSTES_RC" -ne 0 ]; then
        echo ""
        echo "=== Not resolved (harmostes exit $HARMOSTES_RC) — PR stays labelled needs-conflict-resolution ==="
        git push --quiet origin "$SYNC_BRANCH" 2>&1 || true   # push partial work for review
        exit 1
      fi
    fi
    
    # ── Phase 3: gate green — PR-merge the sync branch into the release + release ─
    # (merge model: the sync branch is release + upstream merge. PR-merge it into
    # the release — APPEND, never force-replace. host_pr_merge does the host-routed merge.)
    git checkout --quiet "$SYNC_BRANCH" 2>/dev/null || true
    git add -A 2>/dev/null || true
    git diff --cached --quiet || git commit --no-edit --quiet 2>/dev/null || true
    git push --quiet origin "$SYNC_BRANCH" 2>&1 || true
    
    echo ""
    echo "=== Conflicts resolved — opening PR + triggering merge ==="
    host_label_create "auto-merge" 0E8A16 2>/dev/null || true
    PR_URL=$(host_pr_create "$FORK_DEFAULT_BRANCH" "$SYNC_BRANCH" \
      "RZ/resolve: $FORK_NAME — merge conflicts resolved by agent ($SYNC_DATE)" \
      "Upstream merge conflicts (localized 3-way regions) resolved via harmostes (pi RPC + skill + wiki intent + gate-feedback loop)." \
      "auto-merge" 2>/dev/null || echo "")
    echo "  PR: ${PR_URL:-<none>}"
    
    MERGE_SHA=$(host_pr_merge "$SYNC_BRANCH" 2>&1) || echo "WARNING: merge failed: $MERGE_SHA"
    AUTO_RELEASE=$(read_yaml '.auto.release // false')
    if [ -n "$MERGE_SHA" ] && [ "$AUTO_RELEASE" = "true" ]; then
      UPSTREAM_VER=$(git describe --tags --abbrev=0 "upstream/$UPSTREAM_BRANCH" 2>/dev/null | sed -E 's/(-rc\.[0-9]+|-rezus\.[0-9]+).*$//')
      if [ -n "$UPSTREAM_VER" ]; then
        LAST_N=$(git tag -l "${UPSTREAM_VER}-rezus.*" | sort -V | tail -1 | sed -nE 's/.*-rezus\.([0-9]+).*/\1/p'); [ -z "$LAST_N" ] && LAST_N=0
        REL="${UPSTREAM_VER}-rezus.$((LAST_N + 1))"
        git fetch --quiet origin "$FORK_DEFAULT_BRANCH"; git checkout --quiet "$FORK_DEFAULT_BRANCH" 2>/dev/null || true; git reset --hard --quiet "origin/$FORK_DEFAULT_BRANCH"
        [ -z "$(git tag --points-at HEAD | grep -E "${UPSTREAM_VER}-rezus\.")" ] && {
          git tag "$REL" && git push --quiet origin "$REL" 2>&1 && echo "=== Released $REL → image build → Flux deploys ==="
        }
      fi
    fi
    
    echo ""
    echo "=== resolve-conflict complete: $FORK_NAME (merged) ==="
    exit 0
    
  conflict-subscriber.py: |
    #!/usr/bin/env python3
    """conflict-subscriber.py — Dapr pub/sub consumer for fork-sync conflicts.
    
    Always-on Deployment that exposes an HTTP ``/events`` endpoint and spawns
    ``resolve-conflict.sh <fork>`` for each ``fork.conflict.needs-resolution``
    event it receives. The publisher is sync-fork.sh's emit_conflict_event, which
    POSTs directly to this endpoint with retries (no Dapr pub/sub in the path —
    see below). For each event it ACKs immediately (200 SUCCESS) and spawns the
    resolver detached in the background — resolution is long-running (minutes:
    pi + re-validation) and must not block the HTTP response.
    
    Delivery history: this previously consumed via Dapr pub/sub (pubsub.redis),
    but Redis pub/sub is fire-and-forget — it does NOT retain undelivered events,
    so a subscriber restart silently lost any event published meanwhile. Worse,
    the sync Job's daprd sidecar never terminated, so the Job hung and the
    "re-emit every 30m" self-heal never ran. Direct HTTP POST (publisher retries)
    fixes both. fork-sync still re-emits on every run for any conflict that
    persists, so the path self-heals on top of per-request retries. A per-fork
    in-flight guard prevents two concurrent resolutions of the same fork.
    
    Mirrors the llm-wiki event-subscriber pattern. Standard library only.
    """
    import http.server
    import json
    import os
    import socket
    import subprocess
    import threading
    from datetime import datetime, timezone
    
    LISTEN_PORT = int(os.environ.get("PORT", "8080"))
    NAMESPACE = os.environ.get("NAMESPACE", "fork-maintenance")
    PUBSUB_NAME = os.environ.get("DAPR_PUBSUB", "pubsub")
    TOPIC = "fork.conflict.needs-resolution"
    RESOLVER = os.environ.get("RESOLVER_SCRIPT", "/workspace/scripts/resolve-conflict.sh")
    LOG_DIR = os.environ.get("RESOLVER_LOG_DIR", "/tmp/resolver")
    
    SUBSCRIPTIONS = [{"pubsubname": PUBSUB_NAME, "topic": TOPIC, "route": "/events"}]
    
    # Per-fork in-flight guard: only one resolution per fork at a time.
    _inflight = set()
    _inflight_lock = threading.Lock()
    
    
    def log(msg: str) -> None:
        print(f"[conflict-subscriber] {datetime.now(timezone.utc).isoformat()} {msg}", flush=True)
    
    
    def spawn_resolution(fork: str, payload: dict) -> None:
        """Spawn resolve-conflict.sh detached, logging to a per-run file."""
        os.makedirs(LOG_DIR, exist_ok=True)
        ts = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%S")
        log_path = os.path.join(LOG_DIR, f"{fork}-{ts}.log")
        try:
            with open(log_path, "wb") as lf:
                # start_new_session=True detaches the child from this handler so it
                # keeps running after the HTTP response is sent. Env (LITELLM_URL,
                # GITHUB_TOKEN, MAINT_DIR, SKILL_PATH, ...) is inherited from the pod.
                proc = subprocess.Popen(
                    ["bash", RESOLVER, fork],
                    stdout=lf, stderr=subprocess.STDOUT,
                    stdin=subprocess.DEVNULL,
                    start_new_session=True,
                    cwd="/workspace",
                )
            with _inflight_lock:
                _inflight.add(fork)   # mark in-flight ONLY after a successful spawn
            log(f"spawned resolve-conflict.sh {fork} (pid {proc.pid}) → {log_path}")
            # Clear the in-flight guard when the resolution process exits (success or
            # fail). Without this, a failed resolution permanently blocks the fork —
            # the next sync's event is ACKed + dropped as "already resolving" until a
            # pod restart. The resolution is detached (start_new_session), so a daemon
            # thread waits on it and discards the fork from _inflight on exit.
            def _reap(p=proc, f=fork):
                p.wait()
                with _inflight_lock:
                    _inflight.discard(f)
                log(f"{f} resolution finished (rc={p.returncode}) — cleared in-flight")
            threading.Thread(target=_reap, daemon=True).start()
        except Exception as e:  # noqa: BLE001
            log(f"ERROR: could not spawn resolver for {fork}: {e}")
    
    
    class Handler(http.server.BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
    
        def _send(self, code, obj):
            body = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            if self.command != "HEAD":
                self.wfile.write(body)
    
        def do_GET(self):
            if self.path == "/dapr/subscribe":
                self._send(200, SUBSCRIPTIONS)
            elif self.path == "/healthz":
                self._send(200, {"status": "ok", "inflight": sorted(_inflight)})
            else:
                self._send(404, {"error": "not found"})
    
        def do_HEAD(self):
            self._send(200 if self.path == "/healthz" else 404, {})
    
        def do_POST(self):
            if self.path != "/events":
                self._send(404, {"error": "not found"})
                return
            length = int(self.headers.get("Content-Length", "0"))
            raw = self.rfile.read(length) if length else b"{}"
            try:
                envelope = json.loads(raw.decode() or "{}")
            except Exception:  # noqa: BLE001
                envelope = {}
            data = envelope.get("data", envelope) if isinstance(envelope, dict) else {}
            fork = data.get("fork", "unknown")
            log(f"event received: fork={fork} conflict_files={data.get('conflict_files')}")
    
            # In-flight guard: skip only if a resolution is ACTUALLY running. The
            # marker is added inside spawn_resolution AFTER a successful spawn (not
            # here), so a failed spawn never strands the fork. Direct HTTP delivery
            # (one event per sync per fork; CronJob is Forbid) removed the Dapr
            # redelivery this guard once deduped.
            with _inflight_lock:
                if fork in _inflight:
                    log(f"  {fork} already resolving — skipping")
                    self._send(200, {"status": "SUCCESS"})
                    return
            spawn_resolution(fork, data)
            self._send(200, {"status": "SUCCESS"})
    
        def log_message(self, fmt, *args):  # noqa: A003
            pass
    
    
    class DualStackServer(http.server.ThreadingHTTPServer):
        address_family = socket.AF_INET6
    
        def server_bind(self):
            try:
                self.socket.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 0)
            except OSError:
                pass
            super().server_bind()
    
    
    def ensure_yq():
        """Download yq if missing (the resolver image has git/jq/go/pi but not yq).
        resolve-conflict.sh + sync-fork.sh parse fork defs with yq."""
        import shutil
        import urllib.request
        if shutil.which("yq"):
            return
        dest = "/usr/local/bin/yq"
        url = "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
        try:
            urllib.request.urlretrieve(url, dest)
            os.chmod(dest, 0o755)
            log("installed yq → /usr/local/bin/yq")
        except Exception as e:  # noqa: BLE001
            log(f"WARN: could not install yq ({e}); resolve-conflict.sh will fail on fork defs")
    
    
    def ensure_gh():
        """Download the GitHub CLI if missing so the agent has `gh`, authenticated via
        GH_TOKEN (= FORK_MAINTENANCE_GITHUB_TOKEN from BWS). gh reads GH_TOKEN
        automatically — no `gh auth login` needed."""
        import shutil
        import tarfile
        import urllib.request
        if shutil.which("gh"):
            return
        import json as _json
        try:
            with urllib.request.urlopen(
                "https://api.github.com/repos/cli/cli/releases/latest", timeout=15
            ) as r:
                ver = _json.load(r)["tag_name"].lstrip("v")
            url = f"https://github.com/cli/cli/releases/download/v{ver}/gh_{ver}_linux_amd64.tar.gz"
            tgz = "/tmp/gh.tar.gz"
            urllib.request.urlretrieve(url, tgz)
            with tarfile.open(tgz) as t:
                t.extract(f"gh_{ver}_linux_amd64/bin/gh", "/tmp")
            src = f"/tmp/gh_{ver}_linux_amd64/bin/gh"
            os.chmod(src, 0o755)
            os.replace(src, "/usr/local/bin/gh")
            log(f"installed gh v{ver} → /usr/local/bin/gh")
        except Exception as e:  # noqa: BLE001
            log(f"WARN: could not install gh ({e}); PR operations will be unavailable")
    
    
    def ensure_harmostes():
        """Download harmostes (the shared pi RPC orchestrator, github.com/tibrezus/harmostes)
        if missing, so resolve-conflict.sh can call it. resolve-conflict.sh reads the
        HARMOSTES env (default 'harmostes'); the resolver Deployment sets it to this path."""
        import shutil
        import urllib.request
        dest = "/usr/local/bin/harmostes.py"
        if os.path.exists(dest):
            return
        url = "https://raw.githubusercontent.com/tibrezus/harmostes/main/harmostes.py"
        try:
            urllib.request.urlretrieve(url, dest)
            os.chmod(dest, 0o755)
            log("installed harmostes → /usr/local/bin/harmostes.py")
        except Exception as e:  # noqa: BLE001
            log(f"WARN: could not install harmostes ({e}); resolve-conflict.sh will fail")
    
    
    def main():
        ensure_yq()
        ensure_gh()
        ensure_harmostes()
        log(f"starting on [::]:{LISTEN_PORT} (dual-stack, ns={NAMESPACE})")
        log(f"subscribed to pubsub={PUBSUB_NAME} topic={TOPIC} → spawns {RESOLVER}")
        httpd = DualStackServer(("::", LISTEN_PORT), Handler)
        httpd.serve_forever()
    
    
    if __name__ == "__main__":
        main()
    
  generate-manifest.sh: |
    #!/usr/bin/env bash
    # =============================================================================
    # generate-manifest.sh — Fork divergence manifest generator
    # =============================================================================
    # Generates a YAML manifest of all differences between our fork's release
    # branch and the upstream branch. Three sections: deletions, patches, additive.
    #
    # Usage: generate-manifest.sh <our-branch> <upstream-ref>
    # Example: generate-manifest.sh rezus/forgejo upstream/forgejo
    #
    # Must be run from inside a git repository that has both refs available.
    # =============================================================================
    set -uo pipefail
    
    BRANCH="${1:?Usage: generate-manifest.sh <our-branch> <upstream-ref>}"
    UPSTREAM="${2:?Usage: generate-manifest.sh <our-branch> <upstream-ref>}"
    
    echo "# Fork Divergence Manifest"
    echo "# Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    echo "# Source: git diff ${BRANCH} ${UPSTREAM}"
    echo "# REGENERATE: platform/harmostes/fork-maintenance/scripts/generate-manifest.sh"
    echo ""
    
    WORKDIR=$(mktemp -d)
    trap "rm -rf $WORKDIR" EXIT
    
    # =============================================================================
    # Pass 1: Deletions (top-level dirs in upstream but not in ours)
    # =============================================================================
    echo "deletions:"
    for dir in $(git ls-tree -d --name-only "$UPSTREAM" | sort); do
      if ! git ls-tree -d --name-only "$BRANCH" | grep -qx "$dir"; then
        echo "  - ${dir}/"
      fi
    done
    
    # =============================================================================
    # Pass 2: Patches (files in both branches with different content)
    # =============================================================================
    echo ""
    echo "patches:"
    
    git diff --name-only "$BRANCH" "$UPSTREAM" -- \
      '*.go' '*.yaml' '*.yml' '*.xml' '*.ts' '*.tsx' '*.json' '*.jsx' '*.css' '*.toml' '*.mod' \
      ':(exclude)*.lock' ':(exclude)*.tgz' ':(exclude)go.sum' \
      > "$WORKDIR/files.txt" 2>/dev/null || true
    
    while IFS= read -r file; do
      [ -z "$file" ] && continue
      # Must exist in BOTH branches
      git show "${BRANCH}:${file}" >/dev/null 2>&1 || continue
      git show "${UPSTREAM}:${file}" >/dev/null 2>&1 || continue
      # Must actually differ
      git diff --quiet "$BRANCH" "$UPSTREAM" -- "$file" && continue
    
      # Extract signature from diff
      diff <(git show "${UPSTREAM}:${file}") <(git show "${BRANCH}:${file}") > "$WORKDIR/diff.txt" 2>/dev/null
      signature=$(grep '^>' "$WORKDIR/diff.txt" | sed 's/^> //' | sed 's/^[[:space:]]*//' \
        | grep -vE '^$|^//|^#' | sed -n '1p')
      occurrences=$(git show "${BRANCH}:${file}" | grep -cF "$signature" 2>/dev/null || echo 0)
    
      echo "  - file: ${file}"
      echo "    signature: '${signature}'"
      echo "    occurrences: ${occurrences}"
    done < "$WORKDIR/files.txt"
    
    # =============================================================================
    # Pass 3: Additive (files in ours not in upstream)
    # =============================================================================
    echo ""
    echo "additive:"
    
    comm -23 \
      <(git ls-tree -r --name-only "$BRANCH" | sort) \
      <(git ls-tree -r --name-only "$UPSTREAM" | sort) | \
      awk -F/ '{
        if ($1 == ".github" && $2 == "workflows") print "  - .github/workflows/"$3
        else if ($1 == "staging" && NF >= 3) print "  - staging/src/"$2"/"$3"/"
        else if ($1 == "cmd" && NF >= 2) print "  - cmd/"$2"/"
        else if ($1 == "charts" && NF >= 2) print "  - charts/"$2"/"
        else if ($1 == "pkg" && NF >= 3) print "  - pkg/"$2"/"$3"/"
        else print "  - "$0
      }' | sort -u
    
  verify-patches.sh: |
    #!/usr/bin/env bash
    # =============================================================================
    # verify-patches.sh — Verify fork patches survived an upstream merge
    # =============================================================================
    # Reads a fork definition and greps each patch signature in the fork's files.
    # Returns 0 if all patches intact, 1 if any are lost.
    #
    # Usage: verify-patches.sh <fork-definition.yaml> [fork-workdir]
    # =============================================================================
    set -euo pipefail
    
    DEF_FILE="${1:?Usage: verify-patches.sh <fork-definition.yaml> [workdir]}"
    WORKDIR="${2:-.}"
    
    if [ ! -f "$DEF_FILE" ]; then
      echo "ERROR: definition not found: $DEF_FILE" >&2
      exit 1
    fi
    
    PATCH_COUNT=$(yq -r '.patches | length' "$DEF_FILE")
    ALL_INTACT=true
    
    echo "=== Patch verification ==="
    for i in $(seq 0 $((PATCH_COUNT - 1))); do
      FILE=$(yq -r ".patches[$i].file" "$DEF_FILE")
      SIG=$(yq -r ".patches[$i].signature" "$DEF_FILE")
      DESC=$(yq -r ".patches[$i].description" "$DEF_FILE")
    
      FILEPATH="${WORKDIR}/${FILE}"
      if [ ! -f "$FILEPATH" ]; then
        echo "  ❌ MISSING ${FILE} — ${DESC}"
        ALL_INTACT=false
        continue
      fi
    
      COUNT=$(grep -cF "$SIG" "$FILEPATH" 2>/dev/null || echo 0)
      if [ "$COUNT" -gt 0 ]; then
        echo "  ✅ ${FILE} — '${SIG}' (${COUNT}x)"
      else
        echo "  ❌ LOST ${FILE} — '${SIG}' — ${DESC}"
        ALL_INTACT=false
      fi
    done
    
    if $ALL_INTACT; then
      echo ""
      echo "Result: ALL PATCHES INTACT ✅"
      exit 0
    else
      echo ""
      echo "Result: SOME PATCHES NEED REVIEW ⚠️"
      exit 1
    fi
    
  divergence-track.sh: |
    #!/usr/bin/env bash
    # =============================================================================
    # divergence-track.sh — deterministic fork-divergence integrity
    # =============================================================================
    # A fork's divergences (features it ADDS, REMOVES, or PATCHES vs upstream) are
    # its identity. A sync that silently drops them ships a release branch that
    # BUILDS but is MISSING A FEATURE — e.g. a cherry-pick whose agentic conflict
    # resolution loses an additive path (a helm chart, licensing code, a workflow),
    # or a commit the cherry-picker skipped as "already applied". The build gate
    # cannot catch this: added paths are not compiled.
    #
    # This is the real bug behind the 2026-07-09 signoz sync: it dropped both
    # `deploy/charts/signoz-community/` and `pkg/licensing/communitylicensing/`
    # (restored manually in a8c0b5e3 / still-pending). `additive_paths` was DECLARED
    # in the fork definition but nothing enforced it.
    #
    # Three deterministic passes over the git TREES (no LLM, no prose source of
    # truth):
    #
    #   capture <workdir> <upstream-ref> <fork-ref> <out.json> [additive-file] [deletions-file]
    #       Build a baseline with three fields:
    #         declared  — fork-def `additive_paths` (AUTHORITATIVE intent; enters the
    #                     baseline unconditionally, even if the release already lost
    #                     them, so a drifted release is caught not propagated).
    #         added     — auto-derived minimal fork-added roots (git tree-diff:
    #                     fork has, upstream lacks). The supplement that surfaces
    #                     UNDECLARED divergences a dev forgot to declare.
    #         deletions — fork-def `deletions` (permanent removals). Run BEFORE sync.
    #
    #   reapply <workdir> <fork-ref> <baseline.json>
    #       Self-heal AFTER cherry-pick: restore any declared/added root the sync
    #       dropped, from the fork's release ref. Safe — these paths don't exist
    #       upstream. Declared roots absent from the release too are flagged
    #       unrecoverable (need a manual restore from the last-good sync branch).
    #
    #   verify  <workdir> <baseline.json>
    #       Gate BEFORE merge/release:
    #         declared  — must EXIST in the result (strict: declared ⟹ present).
    #         added     — must match the fork release (git diff fork -- root empty).
    #         deletions — must be ABSENT.
    #       Exit 0 = intact (GREEN); 1 = divergence lost (stderr feedback, blocks
    #       auto-merge & release). Last stdout line = JSON report.
    #
    # Why tree diffs, not commit topology: a cherry-pick-sync that squash-merges its
    # PRs produces a release branch whose commit graph no longer shares recent
    # upstream ancestors, so `git merge-base` drifts and `merge-base..release`
    # becomes polluted with upstream commits. `git diff <upstream-tree>..<fork-tree>`
    # compares TREES and is immune to this.
    #
    # Why declared is existence-checked but added is diff-checked: a declared path
    # MUST be present (intent). An auto-detected path merely must survive verbatim
    # (it's whatever the release happens to carry). If the release itself already
    # lost a declared path, a diff-against-release check would false-GREEN; only a
    # strict existence check catches a drifted release.
    #
    # MODIFIED/patched paths are NOT covered here — they use content signatures
    # (Gate 4), which a human chooses for rigor.
    set -euo pipefail
    
    cmd="${1:?usage: divergence-track.sh CAPTURE|REAPPLY|VERIFY ...}"; shift
    die(){ echo "[divergence-track] ERROR: $*" >&2; exit 2; }
    log(){ echo "[divergence-track] $*"; }
    
    # minimal fork-added roots from added files + the upstream directory set.
    # A dir D is an "added root" iff D is absent from upstream AND D's parent IS in
    # upstream (or D is a single added file whose dir exists). A 101-file chart dir
    # collapses to one root.
    case "$cmd" in
    
    # ─────────────────────────────────────────────────────────────────────────────
      capture)
        workdir="${1:?workdir required}"; upstream="${2:?upstream-ref required}"
        fork="${3:?fork-ref required}"; out="${4:?out.json required}"
        additive_file="${5:-/dev/null}"   # declared additive_paths (AUTHORITATIVE)
        dels_file="${6:-/dev/null}"
        cd "$workdir"
        git rev-parse --verify -q "$upstream" >/dev/null 2>&1 || die "upstream ref not found: $upstream"
        git rev-parse --verify -q "$fork"     >/dev/null 2>&1 || die "fork ref not found: $fork"
    
        # ── declared additive paths (authoritative intent) ──
        mapfile -t DECLARED < <(sed 's#[[:space:]]*/$##' "$additive_file" 2>/dev/null | grep -vE '^[[:space:]]*(#|$)' || true)
    
        # ── auto added roots (supplement — undeclared divergences) ──
        mapfile -t ADDED_FILES < <(git diff --no-renames --name-status --diff-filter=A "$upstream" "$fork" | cut -f2)
        nfc=${#ADDED_FILES[@]}
        tmp_updirs=$(mktemp); git ls-tree -r -d --name-only "$upstream" | sort -u > "$tmp_updirs"
        in_upstream(){ grep -qxF "$1" "$tmp_updirs"; }
        declare -A rootset=()
        if [ "$nfc" -gt 0 ]; then
          for f in "${ADDED_FILES[@]}"; do
            d=$(dirname "$f"); root=""
            while true; do
              if in_upstream "$d"; then break; fi
              root="$d"
              [ "$d" = "." ] && break
              nd=$(dirname "$d"); [ "$nd" = "$d" ] && break; d="$nd"
            done
            [ -z "$root" ] && root="$f"
            [ "$root" = "." ] && continue   # repo root is never a meaningful added root
            rootset["$root"]=1
          done
        fi
        rm -f "$tmp_updirs"
        # auto-only = roots not already implied by a declared path
        declare -A declared_a=(); for p in "${DECLARED[@]}"; do declared_a["$p"]=1; done
        AUTO_ONLY=()
        for r in "${!rootset[@]}"; do
          covered=0
          for p in "${DECLARED[@]}"; do
            # r is covered if a declared path is r or an ancestor of r
            [ "$r" = "$p" ] && { covered=1; break; }
            case "$r" in "$p"/*) covered=1; break;; esac
          done
          [ "$covered" -eq 0 ] && AUTO_ONLY+=("$r")
        done
        mapfile -t AUTO_ONLY < <(printf '%s\n' "${AUTO_ONLY[@]}" | sort)
    
        # ── declared deletions ──
        mapfile -t DELS < <(sed 's#[[:space:]]*/$##' "$dels_file" 2>/dev/null | grep -vE '^[[:space:]]*(#|$)' || true)
    
        t1=$(mktemp); t2=$(mktemp); t3=$(mktemp)
        printf '%s\n' "${DECLARED[@]}" | jq -R 'select(length>0)' | jq -s '.' > "$t1"
        printf '%s\n' "${AUTO_ONLY[@]}" | jq -R 'select(length>0)' | jq -s '.' > "$t2"
        printf '%s\n' "${DELS[@]}"      | jq -R 'select(length>0)' | jq -s '.' > "$t3"
        jq -n \
          --arg fork "$fork" --arg upstream "$upstream" --arg date "$(date -u +%FT%TZ)" \
          --argjson nfc "$nfc" \
          --slurpfile declared "$t1" --slurpfile auto "$t2" --slurpfile dels "$t3" \
          '{fork:$fork, upstream:$upstream, captured_at:$date,
            declared:($declared[0]), added:($auto[0]), deletions:($dels[0]),
            summary:{declared:($declared[0]|length), added_auto:($auto[0]|length),
                     added_files:$nfc, deletions:($dels[0]|length)}}' > "$out"
        rm -f "$t1" "$t2" "$t3"
        log "captured baseline: declared=$(jq '.declared|length' "$out") auto=$(jq '.added|length' "$out") (files=$nfc) deletions=$(jq '.deletions|length' "$out") → $out"
        ;;
    
    # ─────────────────────────────────────────────────────────────────────────────
      reapply)
        workdir="${1:?workdir required}"; fork="${2:?fork-ref required}"
        baseline="${3:?baseline.json required}"
        cd "$workdir"
        git rev-parse --verify -q "$fork" >/dev/null 2>&1 || die "fork ref not found: $fork"
        [ -f "$baseline" ] || die "baseline not found: $baseline"
    
        # Roots to restore = declared (missing) ∪ auto (drifted from fork).
        mapfile -t DECLARED < <(jq -r '.declared[]' "$baseline")
        mapfile -t AUTO     < <(jq -r '.added[]'    "$baseline")
        MISSING=(); UNRECOVERABLE=()
        for root in "${DECLARED[@]}"; do
          [ -e "$root" ] && continue                       # strict: declared must exist
          if git cat-file -e "${fork}:${root}" 2>/dev/null || git ls-tree "$fork" -- "$root" 2>/dev/null | grep -q .; then
            MISSING+=("$root")
          else
            UNRECOVERABLE+=("$root")   # fork release itself lost it → needs last-good
          fi
        done
        for root in "${AUTO[@]}"; do
          git diff --quiet "$fork" -- "$root" 2>/dev/null || MISSING+=("$root")
        done
    
        if [ "${#MISSING[@]}" -eq 0 ] && [ "${#UNRECOVERABLE[@]}" -eq 0 ]; then
          log "reapply: all divergences intact — nothing to restore"
          echo '{"restored":[],"unrecoverable":[],"status":"ok"}'; exit 0
        fi
        if [ "${#MISSING[@]}" -gt 0 ]; then
          log "reapply: ${#MISSING[@]} divergence(s) dropped — restoring from $fork:"
          for m in "${MISSING[@]}"; do echo "  + $m"; done
          git checkout "$fork" -- "${MISSING[@]}" 2>/dev/null || {
            for m in "${MISSING[@]}"; do git checkout "$fork" -- "$m" 2>/dev/null || log "WARN: could not restore $m"; done
          }
        fi
        [ "${#UNRECOVERABLE[@]}" -gt 0 ] && {
          log "reapply: ${#UNRECOVERABLE[@]} declared path(s) absent from the fork release too — CANNOT self-heal:"
          for u in "${UNRECOVERABLE[@]}"; do echo "  ! $u (restore manually from the last-good sync branch)"; done
        }
        restored=$(printf '%s\n' "${MISSING[@]}"        | jq -R 'select(length>0)' | jq -s '.')
        unrecov=$( printf '%s\n' "${UNRECOVERABLE[@]}"  | jq -R 'select(length>0)' | jq -s '.')
        jq -n --argjson r "$restored" --argjson u "$unrecov" \
          '{restored:$r, unrecoverable:$u, status:(if ($u|length)>0 then "partial" else "restored" end)}'
        ;;
    
    # ─────────────────────────────────────────────────────────────────────────────
      verify)
        workdir="${1:?workdir required}"; baseline="${2:?baseline.json required}"
        cd "$workdir"
        [ -f "$baseline" ] || die "baseline not found: $baseline"
    
        mapfile -t DECLARED < <(jq -r '.declared[]'  "$baseline")
        mapfile -t AUTO     < <(jq -r '.added[]'     "$baseline")
        mapfile -t DELS     < <(jq -r '.deletions[]' "$baseline")
        fork_ref=$(jq -r '.fork' "$baseline")
    
        missing=(); drifted=(); back=()
        for root in "${DECLARED[@]}"; do [ -e "$root" ] || missing+=("$root"); done
        for root in "${AUTO[@]}";     do git diff --quiet "$fork_ref" -- "$root" 2>/dev/null || drifted+=("$root"); done
        for d in "${DELS[@]}"; do
          if [ -n "$(git ls-files -- "$d" 2>/dev/null)" ] || [ -e "$d" ]; then back+=("$d"); fi
        done
    
        if [ "${#missing[@]}" -eq 0 ] && [ "${#drifted[@]}" -eq 0 ] && [ "${#back[@]}" -eq 0 ]; then
          log "verify GREEN: ${#DECLARED[@]} declared present, ${#AUTO[@]} auto intact, ${#DELS[@]} deletion(s) absent"
          jq -n --argjson d "${#DECLARED[@]}" --argjson a "${#AUTO[@]}" \
            '{status:"green", declared_present:$d, auto_intact:$a, deletions_absent:true}'
          exit 0
        fi
        {
          echo "verify RED — divergence lost after sync:"
          [ "${#missing[@]}" -gt 0 ] && { echo "  MISSING declared additive paths (${#missing[@]}) — fork features that MUST be present:"; printf '    - %s\n' "${missing[@]}"; }
          [ "${#drifted[@]}" -gt 0 ] && { echo "  DRIFTED auto divergences (${#drifted[@]}):"; printf '    - %s\n' "${drifted[@]}"; }
          [ "${#back[@]}"    -gt 0 ] && { echo "  deletions that came back (${#back[@]}):"; printf '    - %s\n' "${back[@]}"; }
          echo "  The release branch must NOT merge without these fork features."
        } >&2
        miss=$(printf '%s\n' "${missing[@]}" | jq -R 'select(length>0)' | jq -s '.')
        drift=$(printf '%s\n' "${drifted[@]}" | jq -R 'select(length>0)' | jq -s '.')
        backj=$(printf '%s\n' "${back[@]}"    | jq -R 'select(length>0)' | jq -s '.')
        jq -n --argjson m "$miss" --argjson d "$drift" --argjson b "$backj" \
          '{status:"red", missing:$m, drifted:$d, came_back:$b}'
        exit 1
        ;;
    
      *) die "unknown command: $cmd (expected capture|reapply|verify)" ;;
    esac
    

---
# Source: harmostes/templates/fork-maintenance.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: fork-maintenance-checks
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/managed-by: Helm
data:
  validate-fork.sh: |
    #!/usr/bin/env bash
    # =============================================================================
    # validate-fork.sh — Centralized, UNIVERSAL fork validation
    # =============================================================================
    # Runs build + clean-tree + integration checks against a fork's working
    # directory. Which checks run is declared per-fork in the fork definition
    # (`forks/<name>.yaml` → `validation:`), so this script is host-agnostic and
    # language-agnostic — it does NOT hardcode any fork's structure.
    #
    # Called by sync-fork.sh AFTER the post-merge hook (which owns code generation)
    # and BEFORE the sync PR is pushed. Results are written to a PER-FORK file so
    # they cannot leak between forks sharing the same pod.
    #
    # Declared checks (all optional; a fork with no `validation:` block passes):
    #
    #   validation:
    #     go_build:               # compile Go packages (any Go fork)
    #       - module: .           #   working dir (module root) within the workdir
    #         packages: [./cmd/community]
    #     clean_tree:             # verify generated code is committed (codegen drift)
    #       paths: [staging/.../zz_generated_*.go]
    #     integration:            # opt-in; `kind` selects the harness routine
    #       kind: forgejo-live    #   only forgejo-live today
    #       image: codeberg.org/forgejo/forgejo:15-rootless
    #       module: staging/src/forgejo.org/fj
    #       env: {KEY: value}
    #
    # Usage: validate-fork.sh <fork-name> <fork-workdir>
    # Returns: 0 if all declared checks pass (or none declared), 1 if any fail
    # =============================================================================
    set -uo pipefail   # NOT -e: collect all check results before exiting
    
    FORK_NAME="${1:?Usage: validate-fork.sh <fork-name> <workdir>}"
    WORKDIR="${2:?Usage: validate-fork.sh <fork-name> <workdir>}"
    
    SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    MAINT_DIR="$(dirname "$SCRIPT_DIR")"
    DEF_FILE="$MAINT_DIR/forks/${FORK_NAME}.yaml"
    
    if [ ! -f "$DEF_FILE" ]; then
      echo "ERROR: fork definition not found: $DEF_FILE" >&2
      exit 1
    fi
    
    # yq reader with a null-safe default
    ry() { yq -r "$1" "$DEF_FILE" 2>/dev/null; }
    
    RESULTS_FILE=$(mktemp)
    trap "rm -f $RESULTS_FILE" EXIT
    
    {
      echo ""
      echo "## Validation Results"
      echo ""
    } >> "$RESULTS_FILE"
    
    ALL_PASS=true
    HAS_ANY=false
    
    # =============================================================================
    # Toolchain resolution (Go) — pick the exact Go minor the fork needs.
    # =============================================================================
    # A fork built with the wrong Go silently fails on internal-runtime reach-through
    # (e.g. bytedance/sonic v1.14.1 uses Go internals that changed between 1.25 and
    # 1.26 → undefined: GoMapIterator). The CronJob image is a recent golang; we pin
    # the build to the fork's declared or go.mod-declared Go via GOTOOLCHAIN, which
    # the go command honors by downloading the exact toolchain automatically.
    #
    # Precedence: validation.toolchain.go (declared) > go.mod `go` directive.
    GO_TC=$(ry '.validation.toolchain.go // ""')
    if [ -z "$GO_TC" ] && [ -f "$WORKDIR/go.mod" ]; then
      GO_TC=$(grep -m1 '^go ' "$WORKDIR/go.mod" | awk '{print $2}')  # e.g. 1.25.7
    fi
    if [ -n "$GO_TC" ]; then
      export GOTOOLCHAIN="go${GO_TC}"
      echo "=== Toolchain: GOTOOLCHAIN=${GOTOOLCHAIN} (declared/go.mod) ==="
    fi
    
    # =============================================================================
    # Check: go_build — compile declared Go packages
    # =============================================================================
    BUILD_COUNT=$(ry '.validation.go_build // [] | length')
    if [ "${BUILD_COUNT:-0}" -gt 0 ]; then
      HAS_ANY=true
      echo "=== Check: Go build ==="
      {
        echo "### Go Build"
        echo ""
        echo '```'
      } >> "$RESULTS_FILE"
      for i in $(seq 0 $((BUILD_COUNT - 1))); do
        module=$(ry ".validation.go_build[$i].module // \".\"")
        mapfile -t pkgs < <(ry ".validation.go_build[$i].packages[]")
        [ "${#pkgs[@]}" -eq 0 ] && pkgs=("./...")
        build_ok=true
        ( cd "$WORKDIR/$module" && go build "${pkgs[@]}" 2>&1 ) || build_ok=false
        status=$(if $build_ok; then echo '✅'; else echo '❌'; fi)
        echo "  $status  $module  [${pkgs[*]}]"
        echo "  $module [${pkgs[*]}]: $status" >> "$RESULTS_FILE"
        $build_ok || ALL_PASS=false
      done
      echo '```' >> "$RESULTS_FILE"
    fi
    
    # =============================================================================
    # Check: clean_tree — generated code must match what is committed (no drift)
    # =============================================================================
    # The post-merge hook already regenerated code in-place. If the committed
    # source was already the correct generator output, regeneration produces
    # identical bytes → clean tree → ✅. Drift → ❌.
    CT_COUNT=$(ry '.validation.clean_tree.paths // [] | length')
    if [ "${CT_COUNT:-0}" -gt 0 ]; then
      HAS_ANY=true
      echo "=== Check: clean tree (codegen drift) ==="
      {
        echo "### Clean Tree (codegen drift)"
        echo ""
        echo '```'
      } >> "$RESULTS_FILE"
      paths=()
      for i in $(seq 0 $((CT_COUNT - 1))); do
        paths+=("$(ry ".validation.clean_tree.paths[$i]")")
      done
      drift=$( cd "$WORKDIR" && git status --porcelain -- "${paths[@]}" 2>/dev/null )
      if [ -z "$drift" ]; then
        echo "  Clean tree: ✅" >> "$RESULTS_FILE"
      else
        echo "  Clean tree: ❌ (generated code differs from committed)" >> "$RESULTS_FILE"
        echo "$drift" | sed 's/^/    /' >> "$RESULTS_FILE"
        ALL_PASS=false
      fi
      echo '```' >> "$RESULTS_FILE"
    fi
    
    # =============================================================================
    # Check: integration — opt-in, dispatched by `kind`
    # =============================================================================
    INT_KIND=$(ry '.validation.integration.kind // ""')
    if [ -n "$INT_KIND" ]; then
      HAS_ANY=true
      echo "=== Check: integration ($INT_KIND) ==="
      {
        echo "### Integration Tests"
        echo ""
        echo '```'
      } >> "$RESULTS_FILE"
      case "$INT_KIND" in
        forgejo-live)
          run_forgejo_live_integration "$WORKDIR" >> "$RESULTS_FILE" 2>&1
          ;;
        *)
          echo "  Integration: ⚠️ unknown kind '$INT_KIND' (skipped)" >> "$RESULTS_FILE"
          ;;
      esac
      echo '```' >> "$RESULTS_FILE"
      grep -q 'Integration: ❌' "$RESULTS_FILE" && ALL_PASS=false
    fi
    
    # =============================================================================
    # Summary
    # =============================================================================
    if ! $HAS_ANY; then
      echo "_(no validation checks declared for this fork — nothing to verify)_" >> "$RESULTS_FILE"
    fi
    echo "" >> "$RESULTS_FILE"
    if $ALL_PASS; then
      echo "✅ **All validation checks passed.**" >> "$RESULTS_FILE"
    else
      echo "❌ **Some validation checks failed.** Review the output above." >> "$RESULTS_FILE"
    fi
    
    cat "$RESULTS_FILE"
    $ALL_PASS && exit 0 || exit 1
    
    # =============================================================================
    # Harness: forgejo-live — spin up a Forgejo pod/container + run integration tests
    # =============================================================================
    # The only fork-specific integration routine today. Parameterized entirely from
    # the fork definition (image, test module, env), so validate-fork.sh itself
    # stays generic. Runs in-cluster (kubectl) or locally (docker); skips otherwise.
    run_forgejo_live_integration() {
      local workdir="$1"
      local image module
      image=$(ry '.validation.integration.image // "codeberg.org/forgejo/forgejo:15-rootless"')
      module=$(ry '.validation.integration.module // ""')
    
      if [ -z "$module" ]; then
        echo "  Integration: ⚠️ SKIP (no test module declared)"
        return
      fi
    
      if command -v kubectl >/dev/null 2>&1; then
        local pod="forgejo-test-${FORK_NAME}-$$"
        echo "  Starting Forgejo test pod ($pod)..."
        kubectl run "$pod" --image="$image" --namespace=fork-maintenance \
          --env=FORGEJO__security__INSTALL_LOCK=true \
          --env=FORGEJO__database__DB_TYPE=sqlite3 \
          --port=3000 >/dev/null 2>&1 || true
        local i ip token
        for i in $(seq 1 30); do
          kubectl exec -n fork-maintenance "$pod" -- curl -sf http://localhost:3000/api/v1/version >/dev/null 2>&1 && break
          sleep 3
        done
        ip=$(kubectl get pod -n fork-maintenance "$pod" -o jsonpath='{.status.podIP}' 2>/dev/null)
        if [ -n "$ip" ]; then
          kubectl exec -n fork-maintenance "$pod" -- forgejo admin user create \
            --admin --username root --password root123456 \
            --email root@test.local --must-change-password=false 2>/dev/null || true
          token=$(kubectl exec -n fork-maintenance "$pod" -- forgejo admin user generate-access-token \
            --username root --token-name ci --scopes all --raw 2>/dev/null || echo "")
          if [ -n "$token" ]; then
            if ( cd "$workdir/$module" && \
                 FORGEJO_TEST_URL="http://$ip:3000" FORGEJO_TEST_TOKEN="$token" \
                 FORGEJO_TEST_USER=root FORGEJO_REPO_ROOT="$workdir" \
                 go test -v -tags=integration -timeout=120s ./tests/integration/... 2>&1 ); then
              echo "  Integration: ✅"
            else
              echo "  Integration: ❌ (some tests failed)"
            fi
          else
            echo "  Integration: ⚠️ SKIP (could not create token)"
          fi
        else
          echo "  Integration: ⚠️ SKIP (Forgejo pod not ready)"
        fi
        kubectl delete pod -n fork-maintenance "$pod" --force --grace-period=0 >/dev/null 2>&1 || true
    
      elif command -v docker >/dev/null 2>&1; then
        local c="forgejo-test-${FORK_NAME}-$$" token
        docker run -d --name "$c" -p 3199:3000 \
          -e FORGEJO__security__INSTALL_LOCK=true -e FORGEJO__database__DB_TYPE=sqlite3 \
          "$image" >/dev/null 2>&1 || true
        sleep 10
        docker exec "$c" forgejo admin user create --admin --username root --password root123456 \
          --email root@test.local --must-change-password=false 2>/dev/null || true
        token=$(docker exec "$c" forgejo admin user generate-access-token \
          --username root --token-name ci --scopes all --raw 2>/dev/null || echo "")
        if [ -n "$token" ]; then
          if ( cd "$workdir/$module" && \
               FORGEJO_TEST_URL=http://localhost:3199 FORGEJO_TEST_TOKEN="$token" \
               FORGEJO_TEST_USER=root FORGEJO_REPO_ROOT="$workdir" \
               go test -v -tags=integration -timeout=120s ./tests/integration/... 2>&1 ); then
            echo "  Integration: ✅"
          else
            echo "  Integration: ❌ (some tests failed)"
          fi
        else
          echo "  Integration: ⚠️ SKIP (no token)"
        fi
        docker rm -f "$c" >/dev/null 2>&1 || true
      else
        echo "  Integration: ⚠️ SKIP (no kubectl or docker available)"
      fi
    }
    
  gate-resolved.sh: |
    #!/usr/bin/env bash
    # =============================================================================
    # gate-resolved.sh — the combined "is this sync branch resolved?" gate
    # =============================================================================
    # Used as harmostes's --gate: exit 0 = green (no markers + validates + signatures),
    # non-zero = fail. On failure, stderr is fed back to the agent by harmostes as a
    # same-session continuation (the agent fixes in context, harmostes re-runs this).
    #
    # Usage: gate-resolved.sh <fork-name> <workdir>
    # =============================================================================
    set -euo pipefail
    FORK_NAME="${1:?Usage: gate-resolved.sh <fork-name> <workdir>}"
    WD="${2:?}"
    MAINT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
    DEF="$MAINT_DIR/forks/${FORK_NAME}.yaml"
    [ -f "$DEF" ] || { echo "FAIL: fork definition not found: $DEF"; exit 1; }
    ry() { yq -r "$1" "$DEF"; }
    cd "$WD"
    
    # Gate 1 — no conflict markers (the real "conflicts resolved" signal).
    MARKERS=$(git grep -l -E '^(<<<<<<<|>>>>>>>|=======) ' -- . 2>/dev/null || true)
    if [ -n "$MARKERS" ]; then
      echo "FAIL gate 1 (conflict markers remain):"; echo "$MARKERS" | sed 's/^/  - /'
      exit 1
    fi
    
    # Gate 5 — validate-fork.sh (build / codegen / integration, per the fork def).
    if [ -f "$MAINT_DIR/checks/validate-fork.sh" ]; then
      if ! bash "$MAINT_DIR/checks/validate-fork.sh" "$FORK_NAME" "$WD"; then
        echo "FAIL gate 5 (validate-fork.sh: build/codegen/integration)"
        exit 1
      fi
    fi
    
    # Gate 4 — patch signatures intact (each customization's signature must survive).
    PC=$(ry '.patches | length' 2>/dev/null || echo 0)
    for i in $(seq 0 $((PC - 1))); do
      PF=$(ry ".patches[$i].file"); PS=$(ry ".patches[$i].signature")
      if [ -f "$PF" ]; then
        OCC=$(grep -cF "$PS" "$PF" 2>/dev/null || true)
        [ "$OCC" -eq 0 ] && { echo "FAIL gate 4 (signature lost in $PF)"; exit 1; }
      fi
    done
    
    echo "GATES GREEN (no markers + validation + signatures)"
    exit 0
    

