# fork-maintenance — upstream sync as a harmostes Workflow.
#
# This is a WORKING example showing the actual fork-maintenance model after
# the migration from the legacy CronJob system into harmostes. The fork-sync
# plugin (a wrapper around sync-fork.sh) runs entirely in the prepare phase.
# It merges the upstream release branch into the fork's release branch,
# validates (build, divergence tracking, patch signatures), pushes, opens a
# PR, and auto-merges. If a conflict is detected, it POSTs an event to the
# conflict-resolver Deployment which uses an LLM agent to resolve it.
#
# The plugin lives in a ConfigMap (fork-maintenance-plugins) and is mounted
# at /plugins/fork-maintenance-plugins/fork-sync.sh by the worker-pool
# Deployment (chart value: forkMaintenance.enabled: true).
#
# The scripts (sync-fork.sh, divergence-track.sh, validate-fork.sh, etc.)
# are mounted from ConfigMaps at /workspace/{scripts,checks,forks,
# post-merge-hooks}. See k8s-config: platform/harmostes/fork-maintenance/.
---
apiVersion: harmostes.dev/v1alpha1
kind: Workflow
metadata:
  name: fork-maintenance-forgejo
  namespace: harmostes
  labels:
    harmostes.dev/owner: tibrez
spec:
  source:
    kind: git
    repo: fork-maintenance-forgejo
    branch: v16.0/forgejo
    language: go

  # The fork-sync plugin does everything in the prepare phase: it runs
  # sync-fork.sh which merges, validates, pushes, PRs, and auto-merges.
  # The fork name is passed as the first argument.
  prepare:
    plugin:
      name: fork-sync
      configMap: fork-maintenance-plugins
      args: ["forgejo"]
    detect: changed

  # Agent disabled — fork-maintenance is deterministic. When sync-fork.sh
  # detects a conflict, it emits a fork.conflict.needs-resolution event to
  # the conflict-resolver (a separate always-on Deployment), which runs
  # resolve-conflict.sh with pi + the fork-maintenance skill. This happens
  # OUTSIDE the workflow lifecycle.
  agent:
    enabled: false
    model: none
    taskTemplate:
      name: none
    gate:
      plugin:
        name: noop

  deploy:
    plugin:
      name: noop

  scaling:
    kind: keda-scaledjob
    schedule: "*/30 * * * *"
