# Source: harmostes/templates/ui.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harmostes-ui
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harmostes
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harmostes
        app.kubernetes.io/component: ui
      annotations:
        # Dapr sidecar for pub/sub subscription (G7 live execution).
        # The sidecar subscribes to harmostes-events topic and delivers
        # lifecycle events to the UI's /dapr/events endpoint.
        dapr.io/enabled: "true"
        dapr.io/app-id: harmostes-ui
        dapr.io/app-port: "8083"
        dapr.io/config: harmostes-config
        dapr.io/sidecar-image: "ghcr.io/rezuscloud/daprd:otel-metrics-latest-amd64"
        dapr.io/env: "OTEL_EXPORTER_OTLP_INSECURE=true"
        # UI self-telemetry (#525): the UI's /metrics (Prometheus format,
        # outside auth — the scraper is in-cluster and holds no identity)
        # registers with the annotation-based kubernetes-pods receiver
        # (concepts/annotation-based-observability). The UI is scrape-only
        # (no OTel SDK); without these annotations nothing ingests it.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: harmostes-ui
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ui
          image: ghcr.io/tibrezus/harmostes-ui:dev
          imagePullPolicy: Always
          args:
            - --namespace=harmostes-ci
            - --platforms-config=/etc/harmostes-platforms/platforms.json
          env:
            - name: HARMOSTES_NAMESPACE
              value: harmostes-ci
            - name: HARMOSTES_UI_ADMIN_GROUPS
              value: "harmostes-admins"
            # Template MR bridge (#420, ADR-0012 §5): where this
            # environment's template values live. The bridge composes a
            # branch + MR against that file; it NEVER writes templates
            # in-cluster. The token rides from an ExternalSecret via a
            # secretKeyRef — server-side only, never rendered to a client.
            - name: HARMOSTES_TEMPLATE_SOURCE
              value: "{\"baseBranch\":\"main\",\"host\":\"github\",\"owner\":\"golden-username\",\"path\":\"chart/values.yaml\",\"repo\":\"golden-harmostes\",\"valuesKey\":\"workflowTemplates\"}"
            - name: HARMOSTES_TEMPLATE_SOURCE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: golden-ui-source-token
                  key: token
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: platforms-config
              mountPath: /etc/harmostes-platforms
              readOnly: true
      volumes:
        - name: platforms-config
          configMap:
            name: harmostes-ui-platforms

