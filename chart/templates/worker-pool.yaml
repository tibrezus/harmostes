{{- if .Values.workerPool.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harmostes-worker-pool
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/component: worker-pool
spec:
  replicas: {{ .Values.workerPool.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: harmostes
      app.kubernetes.io/component: worker-pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harmostes
        app.kubernetes.io/component: worker-pool
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "harmostes-worker-pool"
        dapr.io/app-port: "8084"
        dapr.io/config: harmostes-config
        {{- if .Values.observability.daprdImage }}
        dapr.io/sidecar-image: {{ .Values.observability.daprdImage | quote }}
        dapr.io/env: "OTEL_EXPORTER_OTLP_INSECURE=true"
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.controller.serviceAccountName | default "harmostes-controller" }}
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      initContainers:
        - name: sync-skills
          image: {{ .Values.image.worker | quote }}
          imagePullPolicy: Always
          command: ["sh", "-c", "git clone --depth 1 {{ .Values.skills.repo | default "https://github.com/tibrezus/agents.git" }} /tmp/agents && mkdir -p /skills && cp -r /tmp/agents/skills/. /skills/"]
          volumeMounts:
            - name: skills
              mountPath: /skills
      containers:
        - name: worker
          image: {{ .Values.image.worker | quote }}
          imagePullPolicy: Always
          # Explicit subcommand (ADR-0007 phase 2): the pool pod is the
          # consumer + dispatcher; its children and the per-Attempt Job pods
          # run `harmostes-worker run`.
          args: ["consumer"]
          ports:
            - name: app-port
              containerPort: 8084
          env:
            - name: HARMOSTES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HARMOSTES_CONSUMER_PORT
              value: "8084"
            # ── Dispatcher knobs (ADR-0007 phase 3) ──
            - name: HARMOSTES_MAX_CONCURRENT
              value: {{ .Values.worker.job.maxConcurrent | default 3 | quote }}
            - name: HARMOSTES_JOB_TTL_SECONDS
              value: {{ .Values.worker.job.ttlSecondsAfterFinished | default 3600 | quote }}
            - name: HARMOSTES_WORKER_IMAGE
              value: {{ .Values.image.worker | quote }}
            - name: HARMOSTES_SERVICE_ACCOUNT
              value: {{ .Values.controller.serviceAccountName | default "harmostes-controller" }}
            {{- if .Values.observability.daprdImage }}
            - name: HARMOSTES_DAPRD_IMAGE
              value: {{ .Values.observability.daprdImage | quote }}
            {{- end }}
            {{- with .Values.pluginConfigMaps }}
            - name: HARMOSTES_PLUGIN_CONFIGMAPS
              value: {{ . | join "," | quote }}
            {{- end }}
            {{- if .Values.forkMaintenance.enabled }}
            {{- /* Pool-only mounts must reach the per-Attempt Jobs too, or
                   pool-only plugins exec against missing files (#311). The
                   ConfigMap names AND modes render from the same values the
                   pool volumes consume — name=path=mode, mode octal, 0755
                   when omitted. */}}
            - name: HARMOSTES_EXTRA_CONFIGMAP_MOUNTS
              value: "{{ .Values.forkMaintenance.scriptsConfigMap }}=/workspace/scripts=0755,{{ .Values.forkMaintenance.checksConfigMap }}=/workspace/checks=0755,{{ .Values.forkMaintenance.defsConfigMap }}=/workspace/forks=0644,{{ .Values.forkMaintenance.hooksConfigMap }}=/workspace/post-merge-hooks=0755"
            {{- end }}
            - name: HARMOSTES_PUBSUB_NAME
              value: {{ .Values.workerPool.pubsubName | default "pubsub" | quote }}
            - name: HARMOSTES_TRIGGER_TOPIC
              value: {{ .Values.workerPool.topic | default "harmostes-triggers" | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.observability.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            {{- end }}
            # Credentials — the consumer-exec'd one-shot worker inherits
            # these env vars. They mirror the secrets the controller injects
            # into Job-based workers (workerEnv). Per-user tokens are not
            # supported in pool mode (Phase 3 will carry them via TriggerEvent).
            - name: HARMOSTES_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harmostes-github-token
                  key: token
            - name: HARMOSTES_RZC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: harmostes-rzc-token
                  key: username
            - name: HARMOSTES_RZC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harmostes-rzc-token
                  key: password
            # Forgejo PAT (git.rezus.cloud): token-scheme API auth + token-
            # embedded git URLs — basic-auth passwords are rejected (forgejo#2809).
            - name: HARMOSTES_FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harmostes-forgejo-token
                  key: token
            - name: LITELLM_URL
              valueFrom:
                secretKeyRef:
                  name: harmostes-litellm-token
                  key: url
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harmostes-litellm-token
                  key: key
          volumeMounts:
            - name: skills
              mountPath: /skills
            - name: workspace
              mountPath: /workspace
            {{- if .Values.forkMaintenance.enabled }}
            - name: fork-scripts
              mountPath: /workspace/scripts
              readOnly: true
            - name: fork-checks
              mountPath: /workspace/checks
              readOnly: true
            - name: fork-defs
              mountPath: /workspace/forks
              readOnly: true
            - name: fork-hooks
              mountPath: /workspace/post-merge-hooks
              readOnly: true
            - name: fork-plugins
              mountPath: /plugins/fork-maintenance-plugins
              readOnly: true
            {{- end }}
            {{- range .Values.pluginConfigMaps }}
            - name: plugin-cm-{{ . }}
              mountPath: /plugins/{{ . }}
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: skills
          emptyDir: {}
        - name: workspace
          emptyDir: {}
        {{- if .Values.forkMaintenance.enabled }}
        - name: fork-scripts
          configMap:
            name: {{ .Values.forkMaintenance.scriptsConfigMap }}
            defaultMode: 0755
        - name: fork-checks
          configMap:
            name: {{ .Values.forkMaintenance.checksConfigMap }}
            defaultMode: 0755
        - name: fork-defs
          configMap:
            name: {{ .Values.forkMaintenance.defsConfigMap }}
            defaultMode: 0644
        - name: fork-hooks
          configMap:
            name: {{ .Values.forkMaintenance.hooksConfigMap }}
            defaultMode: 0755
        - name: fork-plugins
          configMap:
            name: fork-maintenance-plugins
            defaultMode: 0755
        {{- end }}
        {{- range .Values.pluginConfigMaps }}
        - name: plugin-cm-{{ . }}
          configMap:
            name: {{ . }}
            defaultMode: 0755
        {{- end }}
{{- end }}
