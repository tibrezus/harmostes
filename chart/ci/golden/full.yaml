apiVersion: harmostes.dev/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pr-review
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/managed-by: Helm
spec:
  agent:
    gate:
      plugin:
        name: pr-review
    maxFixes: 3
    model: litellm/ali/anthropic/qwen3.8-flash
    skill: /skills/pr-review/SKILL.md
    taskTemplate:
      configMap: harmostes-tasks
      key: pr-review.txt
      name: pr-review
    timeout: 3600
    tools:
    - read
    - bash
    - grep
  deploy:
    plugin:
      name: post-review
  description: PR review (fetch PR → agent → pr-review → post review)
  prepare:
    plugin:
      name: workspace
  reviewReady:
    dispatchTimeout: 45m
    horizon: 6h
    label: needs-review
  scope:
  - default: needs-review
    description: only act when this label is present on a PR
    kind: string
    label: Label trigger
    name: label
  - description: the scope the prepare plugin operates on (owner/repo)
    kind: list
    label: Repos
    name: repos
  - description: context repo some agents use for design evidence
    kind: string
    label: Wiki repo
    name: wiki

