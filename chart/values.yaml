# harmostes framework chart — install once per cluster. Workflows are applied as
# Workflow CRs (see examples/).
namespace: harmostes

image:
  controller: ghcr.io/tibrezus/harmostes-controller:0.6.0   # Phase 0: requires --daprd-image/--otlp-insecure flags (≥0.6.0)
  worker: ghcr.io/tibrezus/harmostes-worker:0.4.2
  pullSecret: ghcr-pull   # set to "" to disable

skills:
  repo: https://github.com/tibrezus/agents.git   # cloned by the init container into /skills on every worker pod AND per-Attempt Job (#441, passed to the dispatcher as HARMOSTES_SKILLS_REPO; Go default: internal/k8s.DefaultSkillsRepo)
  # Pinned served revision (#408 item 9): the fleet clones THIS commit, not
  # a moving branch — the supply chain is reproducible and the skills-bump
  # workflow owns freshness (scheduled PR bumping this value when agents
  # main moves). Empty string = track the repo's default branch (the
  # pre-#408 behavior; the manifest log line remains the only provenance).
  # ec29895: host verbs corrected against the live forges (#685's
  # review rounds — probes on both hosts): GitHub replies via the
  # documented /comments/{id}/replies route (in_reply_to is a 422
  # not-permitted-key there — the skill had it inverted), the carry-mint
  # picks the NEWEST-CREATED open milestone client-side (both hosts'
  # default listing sort is due_on ASC — .[0] is the oldest; verified
  # live: fork id 50 over id 42, GitHub number 10 over v0.6.0), and the
  # GitHub mint takes the milestone NUMBER. The verbs are now executable
  # verbatim on every wired host. Prior: f44b548 (order fix, verb still
  # .id), c1382e7 (the #680 rewrite), 3707bc7 (r18 doctrine).
  rev: "ec298953da291b343bde8fa842f7759a006461f2"

agent:
  # Hard tool-call cap per agent session (#484): past the cap only the
  # finalize lane stays open — bash commands touching toolBudgetAllow and
  # registered file-writer tools still execute, so the agent can always
  # produce its output artifact; everything else is refused with
  # instructions. Turn COUNT is the review's wall clock — 47 calls ≈ 43 min
  # at ~55s of model latency per call. Empty or 0 = uncapped.
  toolBudget: "32"
  # The finalize lane: comma-separated substrings; a post-cap bash command
  # containing any of them still executes (inert-substring comparison —
  # compare, never execute). Empty extension-side default = review.json.
  toolBudgetAllow: "/workspace/review.json"
  # Mid-budget checkpoint (#487): ONE blocked call at toolBudgetNudge with a
  # converge-now instruction (name the pillars the diff triggers selected,
  # verify only those, compose). The block is the only lever the model
  # demonstrably obeys, so the checkpoint shapes convergence instead of
  # only cutting it off at the cap. Does not count against the budget.
  # "0" disables; empty defaults to toolBudget/2.
  toolBudgetNudge: "16"

controller:
  serviceAccount: harmostes-controller
  pollInterval: 5m        # default run cadence for Workflows without a schedule
                          # churn-budget note: MaxDispatchLostReleases=3 ≈ 3 sweeps
                          # at THIS interval (~15m) before a never-dispatching head
                          # is refused (api/v1alpha1.MaxDispatchLostReleases)
  # GC horizon for terminal/statusless attempts (#385, #651); 0 means the
  # default — GC cannot be disabled. Bounds the per-attempt audit ledger.
  # Consumed by the controller's janitor (HARMOSTES_ATTEMPT_RETENTION).
  attemptRetention: 720h
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 1, memory: 512Mi }

dapr:
  # Dapr is the deterministic event-system application layer. Reuse the cluster's
  # Valkey with an isolated DB so harmostes never crosses llm-wiki (DB 0/1) or
  # fork-maintenance (DB 2).
  stateStore: statestore
  # Dedicated actor state store (ADR-0010 PRLineage): Dapr requires the
  # actor-capable store to NOT use keyPrefix none — save-actor-state 404s
  # on this edge runtime (live: every lineage publish 500'd even after
  # actorStateStore was declared on the flat store). keyPrefix name gives a
  # static "actorstore||" prefix: identical across attempt pods (whose
  # app-ids differ), so the per-PR lineage survives pod churn.
  actorStateStore: actorstore
  pubSub: pubsub
  secretStore: harmostes-secret-store   # Dapr secret store component (type: secretstores.kubernetes)
  valkeyHost: valkey.llm-wiki.svc.cluster.local:6379
  valkeyDB: "3"
  injectWorker: true    # Dapr sidecar injected into worker Jobs (events/state + clean shutdown)

# Worker deployment-node RBAC (G6: vela-app, flux-reconcile). Opt-in —
# grants cluster-wide access to KubeVela Application + Flux CRs.
worker:
  # The forge origin the bot review credential (harmostes-forgejo-bot-token)
  # is minted for — the deploy plugin overrides its auth only when the
  # pr-context host matches exactly (#480). Leave at the default unless the
  # forge moves.
  forgejoBotHost: "git.rezus.cloud"
  deployRBAC:
    enabled: false
  # Leg-2 fast path (owner requirement): while a review-ready workflow
  # holds an ARMED, NEVER-DISPATCHED claim (waiting for CI), the pool fires
  # synthetic sweeps at this cadence — the review dispatches within one
  # tick of the last context landing instead of on the next cron sweep.
  # "0" = off (cron-only backstop).
  gateFastPoll: "30s"
  job:                     # per-Attempt Job pods (ADR-0007)
    # 5 (#687, 2026-10-13): two review workflows share these slots and the
    # wall-era rounds run 25-120m — at 3, a pair of long fork rounds
    # starved github reviews entirely (observed live: stranded candidates,
    # a dispatched Job lost to overbooking). 5 keeps both fleets moving;
    # per-workflow override remains spec.reviewReady.maxConcurrent.
    maxConcurrent: 5
    cancelOnSupersede: true # delete the review Job of a claim released superseded/closed (#402); false = let dead-head reviews burn the run bound (pre-#402 behavior)
    ttlSecondsAfterFinished: 3600

  # cache (#336): renders a shared RWX PVC the per-Attempt Jobs mount at
  # /cache/<workflow-name> when a Workflow (or its template) declares
  # spec.cache.pvc: <claim>. Enabled=false keeps the chart render identical —
  # workflows can still reference any pre-provisioned claim.
  cache:
    enabled: false
    size: 20Gi
    storageClass: ""       # "" = cluster default
  # Persistent pi-session lineages (ADR-0010): when enabled, renders the
  # harmostes-worker-sessions RWX claim; templates opt in per workflow
  # (workflowTemplates.<name>.sessions.pvc). Deployment-specific — needs
  # an RWX-capable storage class (e.g. a distributed FS).
  sessions:
    enabled: false
    size: 10Gi
    storageClass: ""

# workerPool: event-driven worker pool (Dapr pub/sub consumer).
# A long-running Deployment subscribes to the harmostes-triggers topic via
# daprd and processes trigger events. This is the single execution model —
# the controller no longer creates batchv1.Jobs.
workerPool:
  enabled: true        # always on (the single trigger model)
  replicas: 1          # fixed replica count (KEDA scale-to-zero in a follow-up)
  pubsubName: pubsub   # Dapr pub/sub component name
  topic: harmostes-triggers  # topic the controller publishes to

# forkMaintenance: the fork-maintenance sync engine (ADR-0011). The engine —
# sync/mapping scripts, checks, post-merge hooks, resolver skill — is
# CODE and ships inside this chart (chart/fork-maintenance/); the chart renders
# the ConfigMaps the worker pod mounts at /workspace/*. Only the fork
# DEFINITIONS (declarative per-fork sync config consumed by sync-fork.sh) and
# the enable flags are values. k8s-config carries no engine code.
#
# CHANGE SEMANTICS (#368-5) — two different rollout trains:
#   • ENGINE change (anything under chart/fork-maintenance/, or the resolver
#     image/model wiring): a CHART RELEASE — kernel PR → merge → GoReleaser
#     publishes chart+images atomically; Flux picks up the new chart version.
#     A values-only patch cannot ship engine code.
#   • DEF change (defs below, enable flags): a HELMRELEASE VALUES PATCH in
#     k8s-config (platform/harmostes/gitrepository.yaml) — Flux re-renders the
#     same chart version with new values. No chart release needed.
#
# TRUST BOUNDARY (#368-4): the resolver runs an LLM agent (bash + file-edit
# rights, a host PAT, and an inference key) over UNTRUSTED upstream code and
# then pushes and PR-merges on your behalf. Therefore:
#   • forkMaintenance.defs may only be edited via k8s-config (platform
#     operator write access); `upstream:` pins must be repos you trust to
#     attempt conflict-injection attacks — the agent works on their tree.
#   • gate-resolved.sh (conflict-marker grep) is a safety net, not a proof;
#     per-fork `validate:` contracts are the actual merge gate.
#   See harmostes.wiki ADR-0011 and the skill's safeguards.md.
forkMaintenance:
  enabled: false
  scriptsConfigMap: fork-maintenance-scripts
  checksConfigMap: fork-maintenance-checks
  defsConfigMap: fork-maintenance-defs
  hooksConfigMap: fork-maintenance-hooks
  # Fork definitions: key = file name (forks/<name>.yaml), value = content.
  defs: {}
  # Conflict resolver: always-on HTTP service receiving
  # fork.conflict.needs-resolution events; runs the pi-agent resolution
  # (resolve-conflict.sh + the fork-maintenance skill).
  # The agent session transcript (RESOLVER_LOG_DIR) is EPHEMERAL by design
  # (#368-2): it writes to container /tmp and dies with the pod on Recreate
  # rolls. Durable evidence is the PR comment (verdict + resolution summary),
  # the needs-fix payload, and the divergence manifest committed to the fork;
  # the full transcript is diagnostic-only. Do not mount a PVC here without
  # revisiting ADR-0011 — it would add storage coupling for debug data.
  resolver:
    enabled: false
    image: ghcr.io/tibrezus/llm-wiki-controller:0.3.0
    # Must carry the litellm/ prefix — the provider comes from the mounted
    # litellm-provider extension (unqualified ids are unreachable).
    model: litellm/zai/glm-4.7
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { cpu: "2", memory: 8Gi }

# pluginConfigMaps: LEGACY escape hatch — additional ConfigMaps to mount under
# /plugins/ in the worker pod (resolved as PluginRef{Name: "<key-without-.sh>",
# ConfigMap: "<name>"}). ADR-0011 moved every production plugin (workspace,
# pr-review, post-review, fork-sync) into the worker image as built-ins; only
# use this for out-of-tree plugins that cannot ship in the image.
pluginConfigMaps: []

# harmostes-ui: self-service multi-tenant web interface (HTMX + Go templates).
# Authenticated via Authentik forward-auth. Each user sees only workflows
# labeled harmostes.dev/owner=<their-username>; members of ui.adminGroups see
# everything (owner labels have churned historically — the bypass keeps the
# operator's UI alive through identity drift).
ui:
  enabled: true
  # Fixture mode (review environments): serve the deterministic in-memory
  # world instead of reading the cluster — a preview env for UI changes has
  # no fleet, and the fixture world IS the review data (parked rows, hold
  # notes, per-PR tokens). The image carries the chart it was built from
  # (chartfs embed), so the fixture world loads anywhere. false in prod.
  fixture: false
  # Read-only review view (ephemeral environments): viewNamespace points
  # the UI at ANOTHER namespace's live data (a get/list-only Role renders
  # there — the API server is the wall), readOnly refuses every mutating
  # route and hides CTAs, and readOnlyAs scopes anonymous visitors to that
  # owner's rows (open the URL, see the data — write nothing). Leave all
  # three unset in prod.
  viewNamespace: ""
  readOnly: false
  readOnlyAs: ""
  adminGroups: "harmostes-admins"
  image: ghcr.io/tibrezus/harmostes-ui:dev
  serviceAccount: harmostes-ui
  host: harmostes.rezus.cloud   # Gateway API HTTPRoute hostname (behind Authentik forward-auth)
  # Dev-identity writes (X-Harmostes-Dev-User → POST /workflows): leave false
  # in production. The header is client-suppliable if a request reaches the
  # pod directly; enabling this flag is what makes that path write-capable,
  # so it is an explicit per-environment decision rendered into the pod env
  # — never a runtime assumption (PR #427 adversarial review, Pillar 6).
  devWrite: false
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  # Template MR bridge (#420, ADR-0012 §5). Where this environment's
  # template values live — the file the UI proposes template changes against
  # (branch + commit + MR via the forge REST API). Empty/absent = the
  # propose surface is not rendered at all. Hosts: github | gitlab.
  # templateSource:
  #   host: github
  #   owner: tibrezus
  #   repo: harmostes
  #   baseBranch: main
  #   path: chart/values.yaml
  #   valuesKey: workflowTemplates
  #   secretName: harmostes-ui-source-token   # ExternalSecret → env token
  #   secretKey: token
  # Platform display configs (plug-and-play). Any platform string is accepted
  # for token creation — this only provides display metadata (label, color).
  # Add new platforms here (GitOps); no code change needed.
  platforms:
    - id: github
      label: GitHub
      color: "#24292e"
    - id: gitlab
      label: GitLab
      color: "#fc6d26"
    - id: forgejo
      label: Forgejo
      color: "#fb8c00"
    - id: codeberg
      label: Codeberg
      color: "#2185d0"
# Observability via the rezuscloud/dapr fork: push traces+metrics+logs over OTLP
# to SigNoz through a unified spec.observability.otel block, deployed per-pod via
# dapr.io/sidecar-image. See llm-wiki: concepts/harmostes-observability.md and
# guides/otlp-observability-deployment.md. Disable to fall back to stock daprd
# (tracing off, Prometheus scrape only).
observability:
  enabled: true
  daprdImage: ghcr.io/rezuscloud/daprd:otel-metrics-latest-amd64   # arm64 edge nodes: ...-arm64. Digest-pin (@sha256:) for IfNotPresent re-pull.
  otlpEndpoint: signoz-otel-collector.signoz.svc.cluster.local:4317 # SigNoz OTLP collector (signoz namespace)
  otlpInsecure: true   # GetIsSecure() defaults to TLS; cluster-internal collector uses plain gRPC
  samplingRate: "0.5"  # Dapr tracing sample fraction (traces are rare; bump for debugging)
  # Opt the controller Deployment into the forked daprd sidecar (decision #5).
  # The controller app does not itself use Dapr building blocks: webhook triggers
  # arrive via direct HTTP (:8082), and the controller's own telemetry goes through
  # its OTel SDK, not daprd. Workers carry the daprd sidecar for pub/sub + tracing.
  # Keep off by default; flip to true only if the controller needs daprd runtime metrics.
  controllerSidecar: false
# ── Declarative workflow layer (ADR-0011) ────────────────────────────────────
# WorkflowTemplates ship with the chart: the keys are the archetype registry
# the UI discovers (grouping by templateRef), the values are the template
# spec. Plugins reference in-image built-ins by bare name — no configMap refs.
# Change a template here, release the chart, Flux reconciles.
workflowTemplates:
  wiki-lint:
    description: Documentation sync (C4/RIG → agent → wiki-lint → push)
    prepare:
      plugin:
        name: rig-emit
    agent:
      skill: /skills/wiki/SKILL.md
      tools: [read, bash, edit, grep]
      taskTemplate:
        name: arch-sync
        configMap: harmostes-tasks
        key: arch-sync.txt
      maxFixes: 3
      gate:
        plugin:
          name: wiki-lint
    deploy:
      plugin:
        name: git-push
  pr-review:
    agent:
      gate:
        plugin:
          name: pr-review
      maxFixes: 3
      # OWNER DIRECTIVE (supersedes #542/#543): the night window stays on
      # the SAME anthropic route as the day model — qwen3.8-flash. The
      # qwen3.8-max window experiment (#542, Asia/Shanghai 22:00-08:00 =
      # the Token Plan Night Plan 50%-off hours) FAILED its first live
      # review round (2026-09-20, fleet PR #557): 45m of exploration hit
      # the run bound, and the attempt-scoped resume then died on an EMPTY
      # 0-token completion — the deepseek-class finalize failure
      # (2026-09-16/17), at ~6x the cost per strike. The litellm flash
      # fallback cannot catch it: an empty 200 is not a routing error, so
      # the proxy chain never fires. Re-enable max ONLY after the
      # empty-completion behavior is fixed proxy-side (or the run bound is
      # raised to fit max's latency profile); the fallback chain
      # (fallbacks.ts) stays — it is inert until the window model flips
      # back. The discount-clock window (UTC+8, DST-proof) STAYS: it is
      # exactly Alibaba's Night Plan off-peak and costs nothing while the
      # model is flash. The worker image ships /usr/share/zoneinfo
      # (verified live), so ResolveModel resolves the zone (#494 would
      # degrade silently otherwise). Day stays qwen3.8-flash →
      # glm-5.3-flash. History: deepseek-v4.1-flash owned this window
      # until it failed to finalize (2026-09-16/17); #536 pinned flash;
      # #542/#543 corrected to max on the discount clock; this reverts the
      # MODEL to flash and keeps the clock for a future max retry.
      model: litellm/ali/anthropic/qwen3.8-flash
      models:
        - model: litellm/ali/anthropic/qwen3.8-flash
          start: "22:00"
          end: "08:00"
          tz: Asia/Shanghai
      skill: /skills/pr-review/SKILL.md
      taskTemplate:
        configMap: harmostes-tasks
        key: pr-review.txt
        name: pr-review
      # #680 — the reviewer's declared intent. thinking: high is BOTH the
      # reasoning-depth declaration and the fleet sampling policy's intent
      # signal (medium+ omits the deterministic-lean override — the reviewer
      # generates hypotheses; chilling its sampling collapsed findings from
      # ~4 to 1-2 on large merges, observed live Oct 8+).
      thinking: high
      # #680 — uncapped by turns: all nine pillars, all the time needed,
      # bounded only by `timeout` (the run bound). Findings post as they
      # are verified, so a long round can never die with unposted work.
      toolBudget: 0
      timeout: 3600
      tools:
        - read
        - bash
        - grep
    deploy:
      plugin:
        name: post-review
    description: PR review (fetch PR → agent → pr-review → post review)
    prepare:
      plugin:
        name: workspace
    reviewReady:
      dispatchTimeout: 45m
      horizon: 6h
      label: needs-review
    scope:
      - default: needs-review
        description: only act when this label is present on a PR
        kind: string
        label: Label trigger
        name: label
      - description: the scope the prepare plugin operates on (owner/repo)
        kind: list
        label: Repos
        name: repos
      - description: context repo some agents use for design evidence
        kind: string
        label: Wiki repo
        name: wiki
  fork-maintenance:
    description: Fork maintenance (fork-sync → noop → noop)
    scope:
    - name: fork
      kind: string
      label: Fork
      description: fork-maintenance registry name (forks/<name>.yaml)
    prepare:
      plugin:
        name: fork-sync
    agent:
      enabled: false
      model: none
      taskTemplate:
        name: none
      gate:
        plugin:
          name: noop
    deploy:
      plugin:
        name: noop
  noop:
    description: Deterministic-only (no LLM agent, no validation gate)
    prepare:
      plugin:
        name: rig-emit
    agent:
      skill: ""
      gate:
        plugin:
          name: noop
    deploy:
      plugin:
        name: git-push

# ── Agent task prompts (ADR-0011) ────────────────────────────────────────────
# The agent's task text per template, rendered into the harmostes-tasks
# ConfigMap. Key = ConfigMap key (referenced by agent.taskTemplate), value =
# prompt text. Override or add per environment via values.
tasks:
  arch-sync.txt: |
    You are working in a wiki repository (your current directory). The deterministic prepare step has just generated the FULL artifact set under raw/arch/<project>/: 
      - rig.json   (component graph, evidence-backed)
      - model.c4   (LikeC4 C4 model, deterministic from RIG)
      - *.mmd      (Mermaid diagrams, deterministic from model.c4)

    These are DETERMINISTIC. Do NOT modify, regenerate, or "fix" them. Your job is to update wiki PROSE based on what changed.

    ## Step 1: Read the RIG and summarize changes

      cat raw/arch/<project>/rig.json

    Identify what changed since last sync:
      - New components (added executables, libraries)
      - Removed components
      - Changed dependencies (new edges, broken edges)
      - New external packages

    ## Step 2: Update the llm-wiki entity page (C4 LEVEL ONLY)

    Read the existing page FIRST (cat wiki/entities/<project>.md). Preserve ALL manual content (deployment notes, config, operational knowledge).

    Update the architecture section:
      1. Read the .mmd files: cat raw/arch/<project>/*.mmd
      2. Embed them as ```mermaid blocks (copy the diagram content verbatim)
      3. Write a SHORT summary of what changed (1-3 sentences)
      4. Do NOT list every component, file, or dependency — that's in the RIG

    C4 BOUNDARY: the llm-wiki carries context/container/component level ONLY. Code-level details (file paths, function signatures, implementation specifics) do NOT belong here.

    ## Step 3: Offload low-level details to the platform wiki

    If the RIG contains details that are too low-level for the llm-wiki (new modules with many source files, implementation notes, API reference), push them to the PROJECT's platform wiki:

      - GitHub repos: gh api --method POST repos/<owner>/<repo>/wiki/pages ...
        Or clone the wiki: git clone https://github.com/<owner>/<repo>.wiki.git
      - Forgejo/Codeberg: fj wiki ...

    This keeps the llm-wiki unbloated. C4 concepts here; details there.

    ## Step 4: Bookkeeping

      - Update index.md if pages were added/removed
      - Append to log.md: operation 'arch-sync', project name, component count

    ## Step 5: Commit (do NOT push)

      git add -A && git commit -m 'docs(arch-sync): <project>'

    A validation gate runs next. If it fails, fix lint errors and commit again.

    ## Rules

      - Do NOT write model.c4 or run likec4 — deterministic, already done
      - Do NOT invent architecture from memory — everything comes from the RIG
      - C4 level only in llm-wiki; push details to platform wiki
      - Preserve manual content
  pr-review.txt: |
    You are an adversarial PR reviewer. The loaded skill provides the
    full methodology — follow it. This file describes only your
    ENVIRONMENT: what was assembled for you and how to use it.

    ## Your workspace

    - **PR context**: /workspace/pr-context.json — host, repo, number,
      title, body, head_sha, head_ref, linked issue, milestone,
      ci_status, files_changed, repo_dir, wiki_dir. Facts to know:
      - `gate` lists the contexts the pipeline verified green at this
        SHA (`required_contexts`, `green_contexts`) — cite gates only
        from that list; naming one not there discredits the review.
      - `pr_state` / `merged` / `merge_note` are facts from the forge
        API — never narrate them from inference.
      - `diff_source` says where the diff came from: "git" = derived
        from merge-base..head in the checkout (exact at this SHA);
        "api" = forge fallback — treat with care.
      - If `ci_status` shows a FAILED check, say so and stop — red CI
        is fixed on the branch, not reviewed.
    - **Diff**: /workspace/pr-diff.patch — the complete diff, never
      truncated. For large diffs navigate by the manifest: `files_changed`
      + `diff_stats` in pr-context.json; jump via the `^diff --git`
      headers instead of reading end-to-end.
    - **Code**: /workspace/repo — checked out at the reviewed head SHA.
    - **Wiki**: /workspace/wiki — project design docs, if configured.

    ## Scope classes

    pr-context.json carries a `scope` hint: focused / large / huge.
    Large: verify the riskiest parts mechanically, summarize the rest.
    Huge: design-level review from the start — architecture, seams,
    invariants — and say explicitly which mechanical claims you did not
    re-verify.

    ## Posting credentials

    HARMOSTES_REVIEW_POST_TOKEN is a comment-scoped credential for the
    forge: it can post, reply to, and resolve PR threads — nothing else.
    Use it (with the host CLI or HTTP API per the skill's host guide) to
    post each verified finding immediately; it deliberately cannot
    approve, merge, or push. If it is absent, post nothing yourself and
    record findings in the ledger only — the pipeline publishes them.

    ## The ledger — /workspace/review.json

    The round's durable scratch record. Update it as you go (python3,
    never a bash heredoc):

        {"decision": "APPROVE|REQUEST_CHANGES",
         "reviewed_sha": "<head SHA of /workspace/repo>",
         "findings": [
           {"path": "...", "line": N, "body": "Blocking: ...",
            "thread_ref": "<platform thread reference, once posted>"}],
         "todos": [
           {"path": "...", "line": N, "body": "<what is completely missing>",
            "disposition": "fix-in-pr|architecture-carry"}]}

    `findings` carries ONLY blocking findings (CRITICAL or verified
    MAJOR) — each posted as a native anchored thread as it is verified
    (thread body opens with **Blocking**). The anchor MUST be a line of
    the PR's own diff (merge-base..head): hosts 422 any line outside it
    (GitHub: 'could not be resolved' on the review-thread field) — an
    unanchorable finding is carried by the verdict, but the thread is
    the addressable surface, so pick anchors FROM the diff. Fill
    `thread_ref` after posting. The pipeline publishes any finding
    without a `thread_ref` (session-death resilience) and composes the
    one-line verdict from the threads actually on the PR. MINOR/NIT
    stay in your notes.
    `todos` are completely-missing pieces and COUNT as threads of the
    round (**TODO** prefix; disposition fix-in-pr default): fixed in this
    PR, reply+resolve — they block the verdict like any thread. Only a
    design/architecture-scale item that outlives this diff goes out as
    disposition architecture-carry (**Architecture-carry** prefix): the
    pipeline mints one deduped tracker issue (milestone-assigned),
    replies the reference, resolves the thread — carried items never
    block. A reply alone never closes a thread: resolve is the close-out.

    Then verify it parses:
    python3 -c "import json; r=json.load(open('/workspace/review.json')); print('OK', r['decision'])"

    Do NOT push, commit, or modify any repository under review. Review only.

