# fork-maintenance — upstream sync as a GRAPH-NATIVE harmostes Workflow.
#
# The sync engine's phases are REAL nodes (one plugin invocation each), and the
# out-of-band systems are declared as external (display-only) topology. The Map
# renders the whole story; the executor runs the real nodes:
#
#   upstream → mirror (webhook) → merge ─┬─ changed → hook → gates →
#                                        │   validate → pr ─ changed → tag
#                                        │                      ↓
#                                        │                 release pipeline
#                                        └─ failed → conflict resolver (pi agent, async)
#
# Node semantics:
#   merge    changed:false → node skipped → run completes (no-op; static upstream)
#            conflict (exit 2) → when:failed → resolver (external) → green terminal
#   gates    red → needs-fix PR pushed, then an honest failed node
#   pr       changed:false (PR left for review) → tag/release skipped
#   tag      machine-cuts v<upstream>-rezus.<N+1> → release pipeline builds
#
# TRIGGER: GitHub push webhook. A GitHub Action (upstream-mirror.yml) on the
# fork mirrors all upstream release branches every 6h; harmostes only wakes
# when the mirror actually moves. source.branch selects the release line
# (upgrading to a new major = changing that field; the Action auto-discovers).
#
# Full documentation: https://github.com/tibrezus/harmostes/wiki/Fork-Maintenance
#
# The fork-sync plugin (ConfigMap fork-maintenance-plugins) and the sync
# engine scripts live in k8s-config: platform/harmostes/fork-maintenance/.
---
apiVersion: harmostes.dev/v1alpha1
kind: Workflow
metadata:
  name: fork-maintenance-forgejo
  namespace: harmostes
  labels:
    harmostes.dev/owner: tibrez
spec:
  source:
    kind: webhook
    webhook:
      url: https://github.com/rezuscloud/forgejo
      secretRef:
        name: webhook-secrets
        key: forgejo-upstream
    branch: v16.0/forgejo
  graph:
    nodes:
      - id: upstream
        type: external
        label: Upstream
        config: { component: upstream, description: forgejo upstream project }
      - id: mirror
        type: external
        label: Mirror action
        config: { component: mirror-action, description: upstream-mirror.yml keeps the mirror branch current, trigger: every 6h → push webhook }
      - id: merge
        type: plugin
        label: Merge upstream
        config: { name: fork-sync, configMap: fork-maintenance-plugins, args: [forgejo, merge] }
      - id: hook
        type: plugin
        label: Post-merge hook
        config: { name: fork-sync, configMap: fork-maintenance-plugins, args: [forgejo, hook] }
      - id: gates
        type: plugin
        label: Divergence + patches
        config: { name: fork-sync, configMap: fork-maintenance-plugins, args: [forgejo, gates] }
      - id: validate
        type: plugin
        label: Validation
        config: { name: fork-sync, configMap: fork-maintenance-plugins, args: [forgejo, validate] }
      - id: pr
        type: plugin
        label: PR + auto-merge
        config: { name: fork-sync, configMap: fork-maintenance-plugins, args: [forgejo, pr] }
      - id: tag
        type: plugin
        label: Release tag
        config: { name: fork-sync, configMap: fork-maintenance-plugins, args: [forgejo, tag] }
      - id: resolver
        type: external
        label: Conflict resolver
        config: { component: agent, description: pi agent resolves 3-way conflict regions asynchronously, gates as proof, trigger: fork.conflict.needs-resolution event }
      - id: release
        type: external
        label: Release pipeline
        config: { component: release-pipeline, description: builds images/CLI/chart from the machine-cut tag, trigger: v*-rezus.N tag }
    edges:
      - { from: upstream, to: mirror }
      - { from: mirror, to: merge }
      - { from: merge, to: hook, when: changed }
      - { from: merge, to: resolver, when: failed }
      - { from: hook, to: gates }
      - { from: gates, to: validate }
      - { from: validate, to: pr }
      - { from: pr, to: tag, when: changed }
      - { from: tag, to: release }
