# harmostes release pipeline — tag-driven GoReleaser + OCI Helm chart
# (ADR-0020).
#
# Pattern: release-please (release-please.yml) maintains the release PR on
# main from Conventional Commits; its automerge creates the vX.Y.Z tag →
# THIS workflow fires on the tag → GoReleaser builds 4 Go binaries, 3
# Docker images, archives + SBOM + cosign-signed checksums → publishes the
# OCI Helm chart at the same version → GitHub Release. The version IS the
# tag — nothing computes or predicts it.
#
# Recovery: a release killed mid-publish is re-run from the failed run
# (gh run rerun) — the tag already exists and the pipeline is idempotent.
#
# The OCI chart is consumed by Flux's HelmRepository(type:oci) in k8s-config,
# which auto-upgrades the HelmRelease on every new chart version. The chart's
# image defaults are baked to match the release (chart X.Y.Z carries images
# X.Y.Z), so chart + images always advance atomically.
#
# Adapted from rezuscloud/rezuscloud and rezuscloud/platform-website.
# Key difference: packages are user-owned (tibrezus/*), so GITHUB_TOKEN can't
# push to GHCR — HARMOSTES_GITHUB_TOKEN (PAT) is used for Docker login + chart push.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      snapshot:
        description: Run in snapshot mode (no publish)
        type: boolean
        default: false

permissions:
  contents: write  # create tags + GitHub Release
  packages: write  # push images + OCI chart to ghcr

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event.inputs.snapshot != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }} # the tag

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # Packages are user-owned (tibrezus/*) — GITHUB_TOKEN can't push.
          # Use the platform PAT (write:packages) sourced from BSM.
          username: x-access-token
          password: ${{ secrets.HARMOSTES_GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: Install gettext-base
        run: which envsubst || (sudo apt-get update -q && sudo apt-get install -y gettext-base)

      - uses: sigstore/cosign-installer@v4.1.1

      - uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --config .github/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARMOSTES_GITHUB_TOKEN: ${{ secrets.HARMOSTES_GITHUB_TOKEN }}

      # Publish the OCI Helm chart after images are built. The chart embeds
      # the image versions, making chart + images an atomic release unit.
      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up yq
        uses: mikefarah/yq@v4

      - name: Publish OCI Helm chart
        env:
          HARMOSTES_GITHUB_TOKEN: ${{ secrets.HARMOSTES_GITHUB_TOKEN }}
        run: |
          export CHART_VERSION="${GITHUB_REF_NAME#v}" # v1.3.0 → 1.3.0
          bash .github/scripts/publish-chart.sh

      - name: Attach chart to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: harmostes-*.tgz

  snapshot:
    name: Snapshot Build
    if: github.event.inputs.snapshot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # same build pipeline as `release`, minus publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Snapshot Version
        id: version
        run: |
          TAG="$(git describe --tags --abbrev=0)"
          echo "semVer=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "snapshot version: ${TAG#v} (latest tag)"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.HARMOSTES_GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: Install gettext-base
        run: which envsubst || (sudo apt-get update -q && sudo apt-get install -y gettext-base)

      - uses: sigstore/cosign-installer@v4.1.1

      - uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --config .github/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARMOSTES_GITHUB_TOKEN: ${{ secrets.HARMOSTES_GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.semVer }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up yq
        uses: mikefarah/yq@v4

      - name: Publish OCI Helm chart (snapshot)
        env:
          CHART_VERSION: ${{ steps.version.outputs.semVer }}
          HARMOSTES_GITHUB_TOKEN: ${{ secrets.HARMOSTES_GITHUB_TOKEN }}
        run: bash .github/scripts/publish-chart.sh
