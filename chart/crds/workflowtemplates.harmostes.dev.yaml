---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflowtemplates.harmostes.dev
  labels:
    app.kubernetes.io/name: harmostes
spec:
  group: harmostes.dev
  names:
    kind: WorkflowTemplate
    listKind: WorkflowTemplateList
    plural: workflowtemplates
    singular: workflowtemplate
    shortNames:
      - wftemplate
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - description
                - prepare
                - agent
                - deploy
              properties:
                description:
                  type: string
                scope:                              # instance-level params the template consumes from spec.config
                  type: array
                  x-kubernetes-preserve-unknown-fields: true
                  items:
                    type: object
                    required: [name, kind]
                    properties:
                      name: { type: string }            # key under spec.config
                      kind: { type: string, enum: [string, list] }
                      label: { type: string }
                      description: { type: string }
                      default: { type: string }
                prepare:
                  type: object
                  properties:
                    plugin:
                      type: object
                      required: [name]
                      properties:
                        name: { type: string }
                        image: { type: string }
                        configMap: { type: string }
                        args: { type: array, items: { type: string } }
                    detect: { type: string, enum: [changed, conflict, always] }
                    output: { type: string }
                    config:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true

                agent:
                  type: object
                  properties:
                    enabled: { type: boolean }
                    model: { type: string }
                    models:
                      type: array
                      description: >-
                        Time-windowed model overrides, evaluated at run start
                        (worker): first window containing `now` wins, else
                        `model`. Windows may wrap midnight.
                      items:
                        type: object
                        required: [model, start, end]
                        properties:
                          model: { type: string }
                          start:
                            type: string
                            pattern: '^([01]\d|2[0-3]):[0-5]\d$'
                            description: HH:MM in tz
                          end:
                            type: string
                            pattern: '^([01]\d|2[0-3]):[0-5]\d$'
                            description: HH:MM in tz
                          tz:
                            type: string
                            description: IANA timezone (default UTC)
                    skill: { type: string }
                    tools:
                      type: array
                      items:
                        type: string
                    taskTemplate:
                      type: object
                      properties:
                        name: { type: string }
                        configMap: { type: string }
                        key: { type: string }
                    gate:
                      type: object
                      properties:
                        plugin:
                          type: object
                          required: [name]
                          properties:
                            name: { type: string }
                            image: { type: string }
                            configMap: { type: string }
                            args: { type: array, items: { type: string } }
                    maxFixes: { type: integer, minimum: 1 }
                    timeout: { type: integer, default: 1800 }
                    scope: { type: string }

                deploy:
                  type: object
                  properties:
                    plugin:
                      type: object
                      required: [name]
                      properties:
                        name: { type: string }
                        image: { type: string }
                        configMap: { type: string }
                        args: { type: array, items: { type: string } }
                # Review-Ready Gate (ADR-0006): the event-armed deterministic
                # trigger for adversarial PR review — proceeds only when the
                # trigger label is present AND every merge-rule required
                # context is green at the PR head SHA.
                reviewReady:
                  type: object
                  properties:
                    label:   { type: string, default: needs-review }
                    horizon: { type: string, default: 6h }
                    dispatchTimeout: { type: string, default: 45m }
                    # per-run Job wall clock (#348/#333): default and MaxRunBound cap enforced in code (reviewready.go) — do not restate the literals here
                    runBound: { type: string }
                    maxConcurrent: { type: integer, minimum: 1 }

                # shared caches the per-Attempt Job mounts (#336): one RWX PVC,
                # SubPath-isolated per workflow; go/npm/git flag-gate the tool env
                cache:
                  type: object
                  properties:
                    pvc: { type: string }
                    git: { type: boolean }
                    go:  { type: boolean }
                    npm: { type: boolean }

                # persistent pi-session lineages (ADR-0010): RWX PVC at /sessions,
                # SubPath per workflow — per-PR sessions (and the SoL-Pi data
                # inside them) survive across attempt Jobs; TTL prunes idle
                # lineages (Go duration string, default 336h)
                sessions:
                  type: object
                  properties:
                    pvc: { type: string }
                    ttl: { type: string }

                # scoped shared storage components (#516 C2): sandboxes stay
                # isolated per attempt; named stores are shared on demand at
                # the declared scope (workflow | repository | attempt).
                # Backed by an RWX claim; SubPath derives from the scope.
                attachments:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string }
                      scope: { type: string, enum: [workflow, repository, attempt] }
                      pvc: { type: string }
                      mountPath: { type: string }


            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Description
          type: string
          jsonPath: .spec.description
        - name: Prepare
          type: string
          jsonPath: .spec.prepare.plugin.name
        - name: Gate
          type: string
          jsonPath: .spec.agent.gate.plugin.name
        - name: Deploy
          type: string
          jsonPath: .spec.deploy.plugin.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
