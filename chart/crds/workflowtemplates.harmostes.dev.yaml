---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflowtemplates.harmostes.dev
  labels:
    app.kubernetes.io/name: harmostes
spec:
  group: harmostes.dev
  names:
    kind: WorkflowTemplate
    listKind: WorkflowTemplateList
    plural: workflowtemplates
    singular: workflowtemplate
    shortNames:
      - wftemplate
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - description
                - prepare
                - agent
                - deploy
              properties:
                description:
                  type: string
                scope:                              # instance-level params the template consumes from spec.config
                  type: array
                  x-kubernetes-preserve-unknown-fields: true
                  items:
                    type: object
                    required: [name, kind]
                    properties:
                      name: { type: string }            # key under spec.config
                      kind: { type: string, enum: [string, list] }
                      label: { type: string }
                      description: { type: string }
                      default: { type: string }
                prepare:
                  type: object
                  properties:
                    plugin:
                      type: object
                      required: [name]
                      properties:
                        name: { type: string }
                        configMap: { type: string }
                        args: { type: array, items: { type: string } }
                    detect: { type: string, enum: [changed, conflict, always] }

                agent:
                  type: object
                  properties:
                    enabled: { type: boolean }
                    model: { type: string }
                    skill: { type: string }
                    tools:
                      type: array
                      items:
                        type: string
                    taskTemplate:
                      type: object
                      properties:
                        name: { type: string }
                        configMap: { type: string }
                        key: { type: string }
                    gate:
                      type: object
                      properties:
                        plugin:
                          type: object
                          required: [name]
                          properties:
                            name: { type: string }
                            configMap: { type: string }
                            args: { type: array, items: { type: string } }
                    maxFixes: { type: integer, minimum: 1 }

                deploy:
                  type: object
                  properties:
                    plugin:
                      type: object
                      required: [name]
                      properties:
                        name: { type: string }
                        configMap: { type: string }
                        args: { type: array, items: { type: string } }
                # Review-Ready Gate (ADR-0006): the event-armed deterministic
                # trigger for adversarial PR review — proceeds only when the
                # trigger label is present AND every merge-rule required
                # context is green at the PR head SHA.
                reviewReady:
                  type: object
                  properties:
                    label:   { type: string, default: needs-review }
                    horizon: { type: string, default: 6h }
                    maxConcurrent: { type: integer, minimum: 1 }

            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Description
          type: string
          jsonPath: .spec.description
        - name: Prepare
          type: string
          jsonPath: .spec.prepare.plugin.name
        - name: Gate
          type: string
          jsonPath: .spec.agent.gate.plugin.name
        - name: Deploy
          type: string
          jsonPath: .spec.deploy.plugin.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
