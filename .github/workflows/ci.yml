# harmostes continuous integration — build, vet, test, dependency-tidy check,
# and Helm chart validation. Runs on every pull request and on every push to
# main. This is the dev-workflow "CI green" gate: a PR may merge only once every
# job here passes. See AGENTS.md / the dev-workflow skill.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so stale pushes don't burn runner
# minutes. Applies to PRs (re-push) and main (force-with-lease edge cases).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI reads source only — no deployments, no package writes.
permissions:
  contents: read

jobs:
  go:
    name: Go (vet · build · test · tidy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # .agents is a submodule (tibrezus/agents) — skills the worker image
          # bakes in. Init it so the build/test environment matches `make test`.
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Single source of truth for the Go toolchain version.
          go-version-file: go.mod
          cache: true

      - name: Set up Node (the extensions tier needs >= 22.5 — the worker image ships node:22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: gofmt (must be a no-op)
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      # #316: static tier deepening — the five-analyzer contract from the
      # committed .golangci.yml. Zero findings is the baseline this PR
      # established (79 cleared by fix-or-justification); a new finding
      # fails the leg. The action installs the pinned lint version and
      # honors the go.mod toolchain (same as every leg above).
      - name: golangci-lint (zero-baseline)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2
          args: --timeout 5m

      - name: go build (all packages)
        run: go build ./...

      - name: go test (race + coverage)
        run: go test -race -cover ./...

      - name: extensions (node --test · rig-query)
        # The lockfile pins typebox to pi's shipped version so tests validate the
        # same schema shape production loads. make test-extensions runs npm ci
        # itself. NOTE: the image does NOT install node_modules — the
        # extension's typebox resolves through pi's alias injection at runtime;
        # this tier validates the schema shape, the Dockerfile load gate
        # validates that the runtime resolves it.
        # WHO BUILDS THE IMAGES (r26 TEST-1, stated so nobody re-derives it):
        # neither worker Dockerfile is built by this PR pipeline. The
        # published image (.github/Dockerfile.worker.release + its
        # `pi -e /extensions/rig-query` load probe) is built by the release
        # workflow (release.yml → goreleaser snapshot + release) — the probe
        # fails the build on a dead extension. The dev image
        # (Dockerfile.worker) is built by `make docker` / `make controller-
        # worker` on demand; its COPY + probe drift is pinned textually by
        # TestPinnedVersionsAgree + TestExtensionsSingleSource (piargs).
        run: make test-extensions

      # sol-pi (#425): the vendored NVlabs/SoL-Pi checkout, upstream suite run
      # against the fleet's PI_VERSION — the PR-tier half of the pairing whose
      # image-tier half is the Dockerfile load probe. A failure here is a
      # COMPATIBILITY CHANGE (SoL-Pi agents-install protocol), not noise.
      # sol-pi tier: runs on this job's node 22 — the SHIPPING runtime (both
      # worker images are node:22-bookworm-slim, sol-pi engines >=22.19); a
      # compat tier on any other node validates a matrix production does not
      # run (#426 r4 §4a).
      - name: sol-pi (upstream suite vs PI_VERSION)
        # PI_VERSION is derived from the Dockerfile hand-pin (no literal here —
        # a hardcoded copy would silently stale the compat tier on a pi bump;
        # #426 r2 pillar 4).
        run: |
          PI_VERSION="$(sed -n 's/^ARG PI_VERSION=//p' Dockerfile.worker | head -1)"
          make test-sol-pi PI_VERSION="$PI_VERSION"

      # The rig-emit plugin's Python validator severity (cycles warn —
      # rhesadox#1864 review ran graph-less because a cyclic repo failed the
      # emit). Stdlib-only, no deps.
      - name: rig-emit validator
        run: make test-rig-emit

      # Vendor sync (#452 D2): plugins/rig-emit/{emit-rig.py,rig/} is a
      # byte-equivalent vendored copy of llm-wiki-core's repo-map action at
      # the sha pinned in VENDOR.sha, plus exactly the deviations
      # vendor-patch.py applies (severity pin, cycle reporting, warnings
      # persistence). The compared set is DERIVED from the patcher's output
      # — never restated (a hardcoded third copy could shrink silently,
      # #456 r1) — and cross-checked three ways: the produced tree must
      # equal the VENDOR.sha list, upstream must have no .py outside it,
      # and every produced file must byte-match the vendored copy.
      - name: rig-emit vendor sync (byte-parity at VENDOR.sha)
        run: |
          PIN_SHA=$(sed -n 's/^sha: //p' plugins/rig-emit/VENDOR.sha)
          [ -n "$PIN_SHA" ] || { echo "::error::VENDOR.sha has no sha pin"; exit 1; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/tibrezus/llm-wiki-core /tmp/llm-wiki-core
          git -C /tmp/llm-wiki-core checkout --quiet "$PIN_SHA"
          rm -rf /tmp/vendored-out
          python3 plugins/rig-emit/vendor-patch.py \
            /tmp/llm-wiki-core/.github/actions/repo-map /tmp/vendored-out >/dev/null
          # 1. The patcher's output IS the vendored set — one source of truth.
          (cd /tmp/vendored-out && find . -name '*.py' | sed 's|^\./||' | sort) > /tmp/produced.txt
          # 2. It must equal the VENDOR.sha declaration (a new upstream .py
          #    or a dropped one is a DECISION, recorded in VENDOR.sha + the
          #    patcher — never absorbed silently).
          awk '/^files:/{f=1;next} /^#/{f=0} f' plugins/rig-emit/VENDOR.sha \
            | tr ' ' '\n' | sed '/^$/d' | sort > /tmp/declared.txt
          if ! diff -u /tmp/declared.txt /tmp/produced.txt; then
            echo "::error::VENDOR.sha files: and vendor-patch.py output disagree — sync the declaration, the patcher, or both"
            exit 1
          fi
          # 3. Upstream's .py set minus the vendored set must never exceed
          #    the not-vendored declarations in VENDOR.sha (coverage cannot
          #    grow a hole; a new upstream file is a recorded decision).
          (cd /tmp/llm-wiki-core/.github/actions/repo-map \
            && find . -name '*.py' | sed 's|^\./||' | sort) > /tmp/upstream.txt
          awk '/^#   [a-z][a-z0-9-]*\.py /{sub(/^#   /,""); print $1}' plugins/rig-emit/VENDOR.sha | sort > /tmp/notvendored.txt
          comm -13 /tmp/produced.txt /tmp/upstream.txt > /tmp/excluded.txt
          if ! diff -u /tmp/notvendored.txt /tmp/excluded.txt; then
            echo "::error::upstream repo-map has .py files outside the vendored set that VENDOR.sha does not declare — extend VENDOR.sha + vendor-patch.py deliberately"
            exit 1
          fi
          # 4. Byte-compare each.
          drift=0
          while read -r f; do
            if ! cmp -s "/tmp/vendored-out/$f" "plugins/rig-emit/$f"; then
              echo "::error::vendor drift: plugins/rig-emit/$f differs from pinned upstream (apply vendor-patch.py output or re-pin VENDOR.sha)"
              drift=1
            fi
          done < /tmp/produced.txt
          exit $drift

      # Compares the COMMITTED fixture's canonical hash against a fresh build
      # in a tempdir — it must NOT regenerate the committed file first, or the
      # gate could only ever catch producer/library skew, never committed
      # drift (#338 r3).
      - name: rig fixture freshness (canonical hash, build-independent)
        run: |
          python3 extensions/rig-query/fixtures/freshness.py \
            || { echo "::error::fixtures/rig.db is stale — run extensions/rig-query/fixtures/generate.py and commit"; exit 1; }

      # Fails if go.mod/go.sum drift from `go mod tidy` — catches dependency
      # checked in half-way or a missing go.sum entry.
      - name: go mod tidy (must be a no-op)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # Integration tier: the attempt ledger + review-claim lifecycles against
  # a REAL API server (envtest — kube-apiserver + etcd) with the shipped
  # chart CRDs applied. The tier fake clients cannot provide: CRD-schema
  # pruning detection (the #277/#289 class), status-subresource semantics,
  # real patch behavior. Build-tagged (integration) so the fast tier stays
  # hermetic and fast.
  integration:
    name: Go (integration · envtest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Version-pinned to the controller-runtime release branch in use
      # (v0.19.0) so the bundled binaries match the client's API surface.
      - name: Install envtest binaries
        run: |
          echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19 use 1.31.0 --bin-dir /tmp/envtest-bins | tail -1 | sed 's/^Path: //')" >> "$GITHUB_ENV"

      - name: Integration tests (real API server · race)
        run: go test -race -tags=integration ./test/integration/...

  # UI E2E tier: Playwright against harmostes-ui -fixture. The fixture
  # world is deterministic (process-start-relative clock, in-memory seeds),
  # so a failure is a real regression, not weather. Node is test tooling
  # only — the UI ships no JavaScript build.
  ui-e2e:
    name: UI E2E (Playwright · fixture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install e2e dependencies
        run: cd e2e && npm ci

      - name: Install Playwright browsers
        run: |
          # The runner image preinstalls Google's chrome-stable apt source;
          # when that upstream repo is mid-rollout its Packages.gz hash
          # mismatches and apt-get update (run by --with-deps) exits 100 —
          # blocking every PR on a third-party outage (observed 3× in a
          # row, 2026-09-09). We test chromium, not chrome: drop the
          # source; ubuntu's own repos carry everything --with-deps needs.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google*.list
          cd e2e && npx playwright install --with-deps chromium

      # The webServer hook in playwright.config.ts boots the fixture UI
      # itself (go run) and waits for /healthz — one command runs the tier.
      - name: Playwright tests
        run: cd e2e && npx playwright test

  # CI conformance — the dev-workflow five invariants (I1–I5) plus the
  # checks-preservation diff against the default branch. Advisory: findings
  # surface on every PR; the repo has not opted into strict gating
  # (.ci-conformance strict). The validator ships in the dev-workflow skill,
  # checked out via the .agents submodule.
  ci-conformance:
    name: CI conformance (I1–I5 · advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate workflows against the invariants
        run: python3 .agents/skills/dev-workflow/scripts/ci-conformance.py --repo . --base origin/main

  chart:
    name: Helm chart (lint · template)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # submodules: the render assertions read the pinned SKILL
          # (.agents/skills/pr-review/SKILL.md) for the pillar-parity check
          # (#404) — without the submodule content the check cannot run.
          submodules: recursive

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # PINNED: the golden render is byte-sensitive to helm's whitespace
          # behavior — a patch release changed trailing-newline emission
          # (v4.2.2 vs v4.2.4). Bump this only together with regenerating the
          # golden (`make golden-update`) under the same version (#368-8).
          version: v4.2.4

      - name: helm lint
        run: helm lint chart/

      # Render smoke test — catches template/Go-template syntax errors and
      # references to undefined values before they reach a cluster.
      - name: helm template (render smoke test)
        run: helm template harmostes chart/ --set namespace=harmostes > /dev/null

      # Cancel-on-supersede knob reachability (#402 r2 P3): the template must
      # use hasKey, not `| default true` — Helm treats false as empty, so the
      # default filter would render "true" even for an explicit false and the
      # documented off-switch would be unreachable from values. All three
      # paths (explicit false, explicit true, unset) must render their
      # documented env value.
      - name: helm template (cancel-on-supersede knob paths)
        run: |
          set -e
          for case in "false:false" "true:true" "unset:true"; do
            set_val="${case%%:*}"; want="${case##*:}"
            if [ "$set_val" = unset ]; then
              got=$(helm template harmostes chart/ --set namespace=harmostes | grep -A1 'HARMOSTES_CANCEL_ON_SUPERSEDE' | grep -o 'value: "[a-z]*"')
            else
              got=$(helm template harmostes chart/ --set namespace=harmostes --set "worker.job.cancelOnSupersede=$set_val" | grep -A1 'HARMOSTES_CANCEL_ON_SUPERSEDE' | grep -o 'value: "[a-z]*"')
            fi
            [ "$got" = "value: \"$want\"" ] || { echo "knob path $set_val: want value: \"$want\", got $got"; exit 1; }
          done
          echo "cancel-on-supersede knob: all three render paths correct"

      # Declarative-layer render assertions (ADR-0011; r1 review P8 — the
      # default render exercises NONE of the new templates, which is how four
      # defects survived a green CI). Renders with the fork engine, resolver,
      # fork defs and credentials ENABLED and asserts the artifacts are whole:
      # engine scripts non-empty, the litellm extension's relative imports all
      # resolve to rendered keys (incompleteness class), templates/tasks
      # present, resolver model prefixed, no producer-less plugin volume.
      - name: helm template (declarative layer assertions)
        run: |
          helm template harmostes chart/ --set namespace=harmostes \
            --set forkMaintenance.enabled=true \
            --set forkMaintenance.resolver.enabled=true \
            --set 'forkMaintenance.defs.forgejo\.yaml=name: forgejo' \
            --set credentials[0].name=ci-test \
            --set credentials[0].template.type=Opaque \
            --set credentials[0].data[0].secretKey=k \
            --set credentials[0].data[0].remoteRef.key=K > /tmp/render.yaml
          python3 - <<'PY'
          import os, re, sys, yaml

          docs = [d for d in yaml.safe_load_all(open("/tmp/render.yaml")) if d]
          by_kind = lambda k: [d for d in docs if d.get("kind") == k]
          cms = {d["metadata"]["name"]: d.get("data", {}) for d in by_kind("ConfigMap")}
          fail = []

          def check(cond, msg):
              if not cond:
                  fail.append(msg)

          # Engine payload: every script key non-empty.
          scripts = cms.get("fork-maintenance-scripts", {})
          check(len(scripts) == 10, f"fork-maintenance-scripts: want 10 keys, got {len(scripts)}")
          check(all(scripts.values()), "fork-maintenance-scripts has an empty key (silent .Files.Get?)")

          # litellm extension: relative imports must resolve to rendered keys
          # (the incompleteness class — index.ts importing fallbacks.ts that
          # no .Files.Get rendered).
          ext = cms.get("litellm-provider-extension", {})
          check("index.ts" in ext and "package.json" in ext, "litellm-provider-extension missing index.ts/package.json")
          for imp in re.findall(r'from\s+"\./(.*?)";', ext.get("index.ts", "")):
              check(imp in ext, f"litellm-provider-extension: index.ts imports ./{imp} — NOT rendered")

          # Declarative layer present.
          wts = by_kind("WorkflowTemplate")
          check({w["metadata"]["name"] for w in wts} >= {"wiki-lint", "pr-review", "fork-maintenance", "noop"},
                f"WorkflowTemplates incomplete: {[w['metadata']['name'] for w in wts]}")
          tasks = cms.get("harmostes-tasks", {})
          check(tasks.get("pr-review.txt") and tasks.get("arch-sync.txt"), "harmostes-tasks prompts missing/empty")
          check(cms.get("fork-maintenance-defs", {}).get("forgejo.yaml"), "fork-maintenance-defs: forgejo.yaml not rendered")

          # Resolver: model env must be litellm/-prefixed (unreachable default class).
          deps = [d for d in by_kind("Deployment") if d["metadata"]["name"] == "fork-conflict-resolver"]
          check(len(deps) == 1, "fork-conflict-resolver Deployment not rendered")
          if deps:
              env = {e["name"]: e.get("value", "") for e in deps[0]["spec"]["template"]["spec"]["containers"][0]["env"]}
              check(env.get("RESOLVER_MODEL", "").startswith("litellm/"), f"RESOLVER_MODEL not litellm-prefixed: {env.get('RESOLVER_MODEL')}")
              # Checksum roll annotations (#368-1): ConfigMap-only changes must
              # roll the Recreate/fixed-tag resolver pod.
              ann = deps[0]["spec"]["template"]["metadata"].get("annotations", {})
              check(ann.get("checksum/fork-maintenance"), "resolver pod missing checksum/fork-maintenance annotation")
              check(ann.get("checksum/litellm-extension"), "resolver pod missing checksum/litellm-extension annotation")

          # No producer-less plugin volume on the worker pool (P3 regression guard).
          pools = [d for d in by_kind("Deployment") if d["metadata"]["name"] == "harmostes-worker-pool"]
          if pools:
              vols = [v["name"] for v in pools[0]["spec"]["template"]["spec"]["volumes"]]
              check("fork-plugins" not in vols, "worker-pool still mounts the producer-less fork-plugins volume")

          check(by_kind("ExternalSecret"), "ExternalSecret not rendered from values.credentials")

          # Skill/prompt pillar parity (#404 review): the RENDERED task
          # prompt (harmostes-tasks/pr-review.txt) and the pinned SKILL
          # (.agents/skills/pr-review/SKILL.md) must state the SAME pillar
          # count — the #374 class (a served methodology disagreeing with
          # the prompt) reproduced when the 9th pillar (CI Economy) landed
          # in the skill while the prompt still said 8.
          #
          # Three-way check, hardened after the r2/r3 reviews:
          #  (a) the SKILL must be INTERNALLY consistent (description count
          #      == "## The N pillars" body header) — this fails on the
          #      revision that motivated the check (f94ad46: description
          #      'nine', header 'eight') and is revision-agnostic;
          #  (b) SKILL count == prompt count (word or digit);
          #  (c) a MISSING count on either side is its own named failure,
          #      never None==None vacuous green (probed).
          _words = {"one": 1, "two": 2, "three": 3, "four": 4, "five": 5,
                    "six": 6, "seven": 7, "eight": 8, "nine": 9, "ten": 10}
          def _num(w):
              return int(w) if w.isdigit() else _words.get(w.lower())
          def _pillar_count(text):
              for m in re.findall(r"[Cc]over(?:s|ing)? (\w+) CI quality pillars", text):
                  n = _num(m)
                  if n is not None:
                      return n
              return None
          def _header_count(text):
              m = re.search(r"## The (\w+) pillars", text)
              return _num(m.group(1)) if m else None
          # self-probe: the extractor reads both spellings, refuses prose,
          # and the header parser exists
          check(_pillar_count("covering 9 CI quality pillars") == 9, "pillar extractor broken: digit")
          check(_pillar_count("covers nine CI quality pillars") == 9, "pillar extractor broken: word")
          check(_pillar_count("no pillar phrase here") is None, "pillar extractor broken: no-refusal")
          check(_header_count("## The 9 pillars") == 9 and _header_count("## The nine pillars") == 9,
                "pillar header parser broken")
          skill_path = ".agents/skills/pr-review/SKILL.md"
          if not os.path.exists(skill_path):
              check(False, f"{skill_path} missing — checkout lost the .agents submodule content; parity cannot run")
          skill = open(skill_path).read() if os.path.exists(skill_path) else ""
          prompt = cms.get("harmostes-tasks", {}).get("pr-review.txt", "")
          n_skill = _pillar_count(skill)
          n_skill_header = _header_count(skill)
          n_task = _pillar_count(prompt)
          n_task_header = _header_count(prompt)
          # (a) SKILL internal consistency: description count == body header
          # count. Fails on the revision that motivated the check (f94ad46:
          # description 'nine', header 'eight') and is revision-agnostic.
          if n_skill is None:
              check(False, "SKILL states no extractable pillar count (missing phrase or unparseable count word) — fix the skill upstream and re-pin")
          elif n_skill_header is None:
              check(False, "SKILL has no '## The N pillars' body header — the internal-consistency leg cannot run")
          elif n_skill != n_skill_header:
              check(False, f"SKILL internally inconsistent: description says {n_skill}, body header says {n_skill_header} — fix the skill upstream and re-pin")
          # (b) prompt completeness: BOTH anchors required. The heading is
          # the structurally stable anchor; deleting it must RED, not
          # downgrade to prose-only parity (r3 M2 — probed green before).
          if n_task is None:
              check(False, "task prompt states no extractable pillar count (missing phrase or unparseable count word) — fix chart/values.yaml pr-review.txt")
          if n_task_header is None:
              check(False, "task prompt lost its '## The N pillars' heading — the stable parity anchor is gone; fix chart/values.yaml pr-review.txt")
          # (c) cross-file parity, only asserted when both sides stated a count
          if n_skill is not None and n_task is not None and n_skill != n_task:
              check(False, f"pillar count mismatch: SKILL says {n_skill}, task prompt says {n_task} — bump both together")
          if n_skill_header is not None and n_task_header is not None and n_skill_header != n_task_header:
              check(False, f"pillar heading mismatch: SKILL '## The {n_skill_header} pillars' vs prompt '## The {n_task_header} pillars'")
          print(f"pillar parity: SKILL {n_skill} (header {n_skill_header}) vs prompt {n_task} (header {n_task_header})")

          if fail:
              print("RENDER ASSERTIONS FAILED:", *fail, sep="\n  - ", file=sys.stderr)
              sys.exit(1)
          print(f"declarative layer render assertions: green ({len(docs)} docs)")
          PY
      - name: .agents pin freshness (advisory)
        run: |
          # ADVISORY on purpose (#404 r2): the fleet serves agents main, so a
          # stale pin is real drift — but upstream main moves on its own
          # schedule and blocking every open harmostes PR on it is coupling
          # without a payoff. This surfaces the drift; the bump is a routine
          # chore PR. Hard-fail belongs to a scheduled bump bot, not this job.
          set +e
          # the section is submodule ".agents" → the config key doubles the
          # dot: submodule..agents.url (r3 L1: 'submodule.agents.url' never
          # matched, so the hardcoded fallback was the only path taken)
          URL=$(git config -f .gitmodules --get submodule..agents.url)
          [ -z "$URL" ] && URL="https://github.com/tibrezus/agents.git"
          PIN=$(git ls-tree HEAD .agents | awk '{print $3}')
          GIT_OUT=$(GIT_TERMINAL_PROMPT=0 timeout 30 git ls-remote "$URL" HEAD 2>&1)
          RC=$?
          HEAD=$(echo "$GIT_OUT" | awk '{print $1}')
          if [ $RC -ne 0 ] || [ -z "$HEAD" ]; then
            echo "::warning::.agents pin freshness: could not reach $URL (git rc=$RC out=$GIT_OUT) — CHECK DID NOT RUN, pin $PIN unverified"
            exit 0
          fi
          if [ "$PIN" != "$HEAD" ]; then
            echo "::warning::.agents pin $PIN != $URL main $HEAD — the fleet serves main; bump the submodule"
          else
            echo ".agents pin is $URL main HEAD ($PIN)"
          fi

      # Golden render (#368-8): the byte-level invariant under every semantic
      # assertion above. Renders with the committed fixture and diffs against
      # the committed golden — any rendered-output change (template edit,
      # engine payload drift, key reorder) surfaces as a reviewable diff.
      # After ANY intentional render change: run `make golden-update`, commit
      # the golden alongside it. Chart-version labels are filtered out.
      # Also proves the #368-3 render guards: empty defs must FAIL the render.
      - name: golden render + render-guard probes
        run: |
          helm template harmostes chart/ -f chart/ci/golden-values.yaml \
            | grep -vE '(helm\.sh/chart|app\.kubernetes\.io/version):' > /tmp/golden-render.yaml
          # dev-write guard: the client-settable X-Harmostes-Dev-User header is
          # write-capable only when HARMOSTES_UI_DEV_WRITE is rendered — which
          # the DEFAULT chart values must never do (PR #427 review). A flip of
          # the default fails here, mechanically, not in prod.
          grep -q 'HARMOSTES_UI_DEV_WRITE' /tmp/golden-render.yaml \
            && { echo "::error::render-guard: HARMOSTES_UI_DEV_WRITE must not render under default values (ui.devWrite flipped?)"; exit 1; } || true
          diff -u chart/ci/golden/full.yaml /tmp/golden-render.yaml || {
            echo "::error::golden render drift — run 'make golden-update' and commit the golden with your change"
            exit 1
          }
          if helm template harmostes chart/ -f chart/ci/golden-values.yaml \
               --set forkMaintenance.defs=null > /dev/null 2>&1; then
            echo "::error::empty-defs render guard did not fail (forkMaintenance.defs=null + enabled=true must fail)"
            exit 1
          fi
          echo "golden render byte-identical; empty-defs guard fails as required"
