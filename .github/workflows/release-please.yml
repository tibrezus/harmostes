# Conventional-Commits release automation (ADR-0020).
#
# release-please maintains ONE release PR on main ("chore(main): release
# X.Y.Z" — CHANGELOG.md + version) from the merged conventional subjects:
# feat → minor, fix/deps → patch, feat!/BREAKING CHANGE → major; chore, ci
# and docs merge fine but release nothing — they ride along into the next
# releasable release. The release PR AUTO-MERGES when its checks pass
# (continuous releases — every releasable merge ships), and merging it
# creates the vX.Y.Z tag, which fires release.yml (GoReleaser builds +
# atomic OCI chart publish).
#
# Token: HARMOSTES_GITHUB_TOKEN (PAT) for BOTH the action and the
# auto-merge. Tags, PRs and merges created with the built-in GITHUB_TOKEN
# do NOT trigger workflows (GitHub's recursion rule) — with GITHUB_TOKEN
# the chain release-PR → merge → tag → build would silently die after the
# first step. The PAT keeps every link fireable.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-run hook (e.g. after a GitHub API hiccup)

permissions:
  contents: write # release PR + tag + GitHub Release
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go
          token: ${{ secrets.HARMOSTES_GITHUB_TOKEN }}

      # Continuous releases (ADR-0020): the release PR merges itself once
      # green. Delete this step to switch to human-gated release trains —
      # nothing else changes.
      #
      # No checkout in this job: gh gets the repo via -R (a bare gh pr
      # merge needs a local git repo otherwise), and the PR is found by its
      # autorelease: pending label so the step is idempotent — it re-arms
      # automerge on a PR the action created (or updated) in an earlier run
      # too (first live run failed exactly there: #760 sat un-automerged).
      - name: Enable auto-merge on the release PR
        env:
          GH_TOKEN: ${{ secrets.HARMOSTES_GITHUB_TOKEN }}
        run: |
          PR="$(gh pr list -R "$GITHUB_REPOSITORY" --label "autorelease: pending" --state open --json number --jq '.[0].number')"
          if [ -z "$PR" ]; then
            echo "no pending release PR — nothing to arm"
            exit 0
          fi
          echo "auto-merge armed on release PR #$PR"
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --auto --squash
