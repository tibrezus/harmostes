apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflows.harmostes.dev
  annotations:
    harmostes.dev/framework-version: v0.1
spec:
  group: harmostes.dev
  names:
    kind: Workflow
    listKind: WorkflowList
    singular: workflow
    plural: workflows
    shortNames: [hw]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Owner
          type: string
          jsonPath: .metadata.labels.harmostes\.dev/owner
        - name: Source
          type: string
          jsonPath: .spec.source.kind
        - name: Prepare
          type: string
          jsonPath: .spec.prepare.plugin.name
        - name: Gate
          type: string
          jsonPath: .spec.agent.gate.plugin.name
        - name: Deploy
          type: string
          jsonPath: .spec.deploy.plugin.name
        - name: Last-revision
          type: string
          jsonPath: .status.lastProcessedRevision
        - name: Gate
          type: string
          jsonPath: .status.gateStatus
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [source]
              properties:
                templateRef: { type: string, description: "Optional: inherits prepare/agent/deploy defaults from a WorkflowTemplate CR" }
                config:                                    # instance-level scope (repos, label, wiki, …); overlays prepare.config after templateRef merge
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                source:
                  type: object
                  required: [kind]
                  properties:
                    kind: { type: string, enum: [git, schedule, event, webhook] }
                    repo: { type: string }        # Flux GitRepository name, or direct URL
                    branch: { type: string }
                    revision: { type: string }    # pin (git)
                    schedule: { type: string }    # cron (schedule)
                    topic: { type: string }       # inbound event (event)
                    # domain extras (free-form; passed to the prepare plugin via HARMOSTES_SPEC)
                    language: { type: string }    # lc4: go/zig/…
                    fork:                         # fork-maintenance: the fork to sync into
                      type: object
                      properties:
                        url: { type: string }
                        branch: { type: string }
                    webhook:                       # webhook trigger config (HMAC secret + host URL)
                      type: object
                      description: Webhook trigger config (push events from GitHub/GitLab/Forgejo)
                      properties:
                        secret: { type: string }   # HMAC secret (testing only; NOT recommended for production)
                        url: { type: string }      # git host URL (for signature verification)
                        secretRef:                 # Secret reference (production; GitOps-friendly)
                          type: object
                          required: [name, key]
                          properties:
                            name: { type: string } # Secret name
                            key: { type: string }  # Secret key
                workspaceRepo:                      # the repo the pipeline operates on (the wiki; the fork)
                  type: object
                  properties:
                    url: { type: string }
                    branch: { type: string }
                    dir: { type: string }          # checkout location under WORKDIR (default "repo")
                    shadow: { type: string }       # push here instead (parallel/dry-run)
                    tokenRef:                      # per-user git token (Phase C). Overrides the shared cluster secret.
                      type: object
                      required: [name, key]
                      properties:
                        name: { type: string }     # Secret name
                        key: { type: string }      # Secret key

                prepare:
                  type: object
                  required: [plugin]
                  properties:
                    plugin:
                      type: object
                      required: [name]
                      properties:
                        name: { type: string }                 # rig-emit | raw-copy | merge-sync | <custom>
                        image: { type: string }                # optional: plugin as its own image
                        configMap: { type: string }            # optional: plugin script from a ConfigMap
                        args: { type: array, items: { type: string } }
                    output: { type: string }                   # artifact produced (path / branch / ref)
                    detect: { type: string, enum: [changed, conflict, always] }
                    config:                                    # arbitrary config passed to the plugin
                      type: object
                      x-kubernetes-preserve-unknown-fields: true

                agent:
                  type: object
                  required: [model, taskTemplate, gate]
                  properties:
                    enabled: { type: boolean }                  # nil/true = run, false = skip (deterministic-only)
                    model: { type: string }                    # litellm/zai/anthropic/glm-5.3-flash
                    skill: { type: string }                    # /skills/…/SKILL.md
                    tools: { type: array, items: { type: string } }
                    taskTemplate:                              # the interpretive task
                      type: object
                      properties:
                        name: { type: string }                 # arch-sync-lc4 | resolve-conflict | …
                        configMap: { type: string }            # task text lives in a ConfigMap
                        key: { type: string }
                    gate:
                      type: object
                      required: [plugin]
                      properties:
                        plugin:
                          type: object
                          required: [name]
                          properties:
                            name: { type: string }             # wiki-lint | fork-maintenance | <custom>
                            image: { type: string }
                            configMap: { type: string }
                            args: { type: array, items: { type: string } }
                    maxFixes: { type: integer, default: 3 }
                    timeout: { type: integer, default: 1800 }
                    scope: { type: string }                    # optional task scope override

                deploy:
                  type: object
                  required: [plugin]
                  properties:
                    plugin:
                      type: object
                      required: [name]
                      properties:
                        name: { type: string }                 # git-push | fork-merge-deploy | noop
                        image: { type: string }
                        configMap: { type: string }
                        args: { type: array, items: { type: string } }

                events:                                     # topic names on the Dapr pub/sub
                  type: object
                  properties:
                    onPrepare: { type: string }
                    onResolved: { type: string }
                    onFailed: { type: string }
                    onDeployed: { type: string }

                cache:
                  type: object
                  properties:
                    pvc: { type: string }
                    git: { type: boolean }
                    go: { type: boolean }
                    npm: { type: boolean }

                scaling:
                  type: object
                  properties:
                    kind: { type: string, enum: [keda-scaledjob, cronjob] }
                    schedule: { type: string }
                disabled: { type: boolean }   # suspend scheduling (defined but not run)

                # Review-Ready Gate (ADR-0006): the event-armed deterministic
                # trigger for adversarial PR review — proceeds only when the
                # trigger label is present AND every merge-rule required
                # context is green at the PR head SHA.
                reviewReady:
                  type: object
                  properties:
                    label:   { type: string, default: needs-review }
                    horizon: { type: string, default: 6h }
                    dispatchTimeout: { type: string, default: 45m }
                    maxConcurrent: { type: integer, minimum: 1 }

                # External System Bindings (ADR-0003). Optional — legacy
                # Workflows without bindings still validate. When present, this
                # is the Binding Authority Boundary; runtime may create objects
                # within a binding but never new bindings. Nodes declare their
                # required capabilities via spec.graph.nodes[].requires.
                bindings:
                  type: array
                  items:
                    type: object
                    required: [name, bindingRole, surfaceKind, connectionProfile, target]
                    properties:
                      name:              { type: string }
                      bindingRole:
                        type: string
                        enum: [sourceRepo, workspaceRepo, issueTracker, wiki, review, releaseTarget, webhookOrigin]
                      surfaceKind:
                        type: string
                        enum: [repository, issue-tracker, wiki, review, release, webhook-origin]
                      connectionProfile: { type: string }      # ConnectionProfile name (trusted host mechanics)
                      target:
                        type: object
                        required: [host, object]
                        properties:
                          host:   { type: string }
                          object: { type: string }
                          branch: { type: string }
                          extra:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                      granted:
                        type: array                          # Surface Capability tokens this binding grants
                        items: { type: string }
                      authRef:
                        type: object
                        required: [name, key]
                        properties:
                          name: { type: string }
                          key:  { type: string }

                # Graph-native mode: explicit directed graph of nodes + edges.
                # If present, the worker uses the graph executor and ignores
                # prepare/agent/deploy. This allows arbitrary pipeline shapes.
                graph:
                  type: object
                  description: Graph-native pipeline (nodes + edges). Overrides prepare/agent/deploy.
                  properties:
                    nodes:
                      type: array
                      items:
                        type: object
                        required: [id, type]
                        properties:
                          id: { type: string }
                          type:
                            type: string
                            # "external" nodes are display-only topology (never
                            # executed by the kernel; rendered on the map).
                            enum: [plugin, agent, gate, branch, dapr-state-get, dapr-state-set, dapr-publish, vela-app, flux-reconcile, http-call, human-gate, external]
                          label: { type: string, description: "Optional display label for the map (falls back to id)" }
                          config: { type: object, x-kubernetes-preserve-unknown-fields: true }
                          outputs: { type: array, items: { type: string } }
                          when: { type: string }
                          timeout: { type: string }
                          requires:                                  # ADR-0003: Surface Capabilities this node needs
                            type: array
                            items:
                              type: object
                              required: [binding, capability]
                              properties:
                                binding:    { type: string }      # ExternalSystemBinding.Name
                                capability: { type: string }      # repository.read | issue-tracker.comment.write | ...
                    edges:
                      type: array
                      items:
                        type: object
                        properties:
                          from: { type: string }
                          to: { type: string }
                          when: { type: string }
                          maxRetries: { type: integer }

            status:
              type: object
              properties:
                observedGeneration: { type: integer }
                lastProcessedRevision: { type: string }
                lastAgentCommit: { type: string }
                lastRigHash: { type: string }
                gateStatus: { type: string, enum: [green, failed, unknown] }
                reviewReady:
                  type: object
                  description: Review-Ready Gate aggregates (ADR-0006/0007) — per-PR claim state lives on Attempts (status.review).
                  properties:
                    liveClaims:   { type: integer }
                    capacity:     { type: integer }
                    lastDecision: { type: string, enum: [proceed, waiting, standdown, idle] }
                    lastReason:   { type: string }
                lastRunAt: { type: string }
                message: { type: string }
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", "Unknown"] }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string }
                      observedGeneration: { type: integer, format: int64 }
