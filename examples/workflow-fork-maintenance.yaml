# fork-maintenance — upstream sync as a harmostes Workflow.
#
# This is a WORKING example showing the actual fork-maintenance model.
# The fork-sync plugin (a wrapper around sync-fork.sh) runs entirely in
# the prepare phase. It merges the upstream mirror branch into the fork's
# release branch, validates (build, divergence tracking, patch signatures),
# pushes, opens a PR, and auto-merges. If a conflict is detected, it POSTs
# an event to the conflict-resolver Deployment which uses an LLM agent
# to resolve it.
#
# TRIGGER MODEL: event-driven via GitHub push webhook.
#   - A GitHub Action (upstream-mirror.yml) on the fork repo mirrors ALL
#     upstream release branches every 6h.
#   - When a mirror branch moves → GitHub push webhook → harmostes triggers.
#   - When upstream is static → no push → harmostes sleeps (zero polling).
#   - The source.branch field controls which release line is actively synced.
#     Upgrading to v17.0 = changing this field. The Action auto-discovers
#     new versions.
#
# Full documentation: https://github.com/tibrezus/harmostes/wiki/Fork-Maintenance
#
# The plugin lives in a ConfigMap (fork-maintenance-plugins) and is mounted
# at /plugins/fork-maintenance-plugins/fork-sync.sh by the worker-pool
# Deployment. The scripts (sync-fork.sh, divergence-track.sh, etc.) are in
# k8s-config: platform/harmostes/fork-maintenance/.
---
apiVersion: harmostes.dev/v1alpha1
kind: Workflow
metadata:
  name: fork-maintenance-forgejo
  namespace: harmostes
  labels:
    harmostes.dev/owner: tibrez
spec:
  # Event-driven: triggered by GitHub push webhook when the upstream-mirror
  # Action pushes new commits to the v16.0/forgejo mirror branch.
  source:
    kind: webhook
    webhook:
      url: https://github.com/rezuscloud/forgejo
      secretRef:
        name: webhook-secrets
        key: forgejo-upstream
    branch: v16.0/forgejo

  # The fork-sync plugin does everything in the prepare phase: it runs
  # sync-fork.sh which merges, validates, pushes, PRs, and auto-merges.
  # The fork name is passed as the first argument.
  prepare:
    plugin:
      name: fork-sync
      configMap: fork-maintenance-plugins
      args: ["forgejo"]

  # Agent disabled — fork-maintenance is deterministic. When sync-fork.sh
  # detects a conflict, it emits a fork.conflict.needs-resolution event to
  # the conflict-resolver (a separate always-on Deployment), which runs
  # resolve-conflict.sh with pi + the fork-maintenance skill. This happens
  # OUTSIDE the workflow lifecycle.
  agent:
    enabled: false
    model: none
    taskTemplate:
      name: none
    gate:
      plugin:
        name: noop

  deploy:
    plugin:
      name: noop
