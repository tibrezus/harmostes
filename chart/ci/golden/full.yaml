    # SOME store flagged actorStateStore, Dapr has NO actor state store —
    # every actor state access nil-panics in the sidecar (onGetActorState,
    # actors.go) and every lineage publish 500s. The dedicated store lives
    # below (keyPrefix none breaks save-actor-state on this runtime).

