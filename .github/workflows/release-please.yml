# Conventional-Commits release automation (ADR-0020).
#
# release-please maintains ONE release PR on main ("chore(main): release
# X.Y.Z" — CHANGELOG.md + version) from the merged conventional subjects.
# VERSION POLICY (ADR-0020, Amendment 2026-11-01 — release-please-config.json):
#   • AUTOMATIC CUTS ARE PATCH-ONLY — the package pins the native
#     versioning strategy "always-bump-patch", so feat/fix/deps all bump
#     X.Y.Z → X.Y.Z+1 and SHIP continuously (the changelog still groups
#     them under Features/Bug Fixes — the strategy changes the bump, not
#     the sections). No minor or major can arise from commit types.
#   • MINORS ARE MILESTONE-DRIVEN — the versioning-strategy base checks
#     any commit's `Release-As: vX.Y.0` trailer ABOVE the strategy, so a
#     milestone-closure commit carrying that trailer cuts exactly vX.Y.0.
#     Procedure: close the milestone with
#       git commit --allow-empty -m "chore: close milestone <name>
#
#       Release-As: v$(next-minor).0"
#     (major = v$(next-major).0 for the rare breaking milestone). The
#     gate below then HELDs the minor until the `minor-approved` label,
#     so the batched version ships on the owner's word — release-please
#     keeps absorbing later merges into it meanwhile.
# chore, ci and docs merge fine but release nothing — they ride along
# into the next releasable release. The release PR AUTO-MERGES when its
# checks pass — but only through the release gate (scripts/release-gate.sh,
# ADR-0020 Amendment 2026-10-26): patch bumps ship continuously; minor/major
# bumps (now only ever Release-As-driven) are HELD until the owner adds the
# `minor-approved` label. Hand-rolled release PRs are rejected outright.
# Merging the release PR creates the vX.Y.Z tag, which fires release.yml
# (GoReleaser builds + atomic OCI chart publish).
#
# Token: HARMOSTES_GITHUB_TOKEN (PAT) for BOTH the action and the
# auto-merge. Tags, PRs and merges created with the built-in GITHUB_TOKEN
# do NOT trigger workflows (GitHub's recursion rule) — with GITHUB_TOKEN
# the chain release-PR → merge → tag → build would silently die after the
# first step. The PAT keeps every link fireable.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-run hook (e.g. after a GitHub API hiccup)
  pull_request_target:
    types: [labeled] # the gate re-runs when the owner adds `minor-approved`

permissions:
  contents: write # release PR + tag + GitHub Release
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        if: github.event_name != 'pull_request_target' # label events only re-run the gate
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.HARMOSTES_GITHUB_TOKEN }}

      # The release gate (ADR-0020, Amendment 2026-10-26): bot-only
      # provenance, patch-only automerge, owner-gated minors. Delete this
      # step to switch to fully manual releases — nothing else changes.
      # No checkout was needed when this was a bare `gh pr merge`; the gate
      # is repo logic, so main is checked out — for pull_request_target
      # that is the BASE ref (never the labeler's code). The PR is found
      # by its autorelease: pending label so the step is idempotent — it
      # re-arms automerge on a PR the action created (or updated) in an
      # earlier run too (first live run failed exactly there: #760 sat
      # un-automerged).
      - uses: actions/checkout@v4
      - name: Release gate
        # The labeled trigger exists for `minor-approved` ONLY. Creating a
        # release PR also fires `labeled` (the autorelease: pending label
        # is attached at creation), and at that instant the PR body may not
        # be readable yet — the first live run false-rejected on the
        # provenance marker exactly there (#801). Creation-time gating is
        # the push event's job; label events only ever UNLOCK a hold.
        if: github.event_name != 'pull_request_target' || github.event.label.name == 'minor-approved'
        env:
          GH_TOKEN: ${{ secrets.HARMOSTES_GITHUB_TOKEN }}
        run: ./scripts/release-gate.sh
