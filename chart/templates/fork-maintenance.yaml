{{- if .Values.forkMaintenance.enabled }}
{{- $fm := .Values.forkMaintenance }}
{{- if not $fm.defs }}{{- fail "forkMaintenance.enabled=true requires forkMaintenance.defs — at least one forks/<name>.yaml definition (render-time guard, #368-3: an empty defs ConfigMap only fails deep inside sync-fork.sh at 3 a.m.)" }}{{- end }}
# ── Fork-maintenance engine payload (ADR-0011) ──────────────────────────────
# The sync engine is CODE and ships inside this chart (chart/fork-maintenance/).
# Only the fork DEFINITIONS are values (forkMaintenance.defs) — they are the
# declarative per-fork configuration. ConfigMap names match the worker-pool
# mounts (forkMaintenance.*ConfigMap), so the worker pods see the same
# /workspace layout the k8s-config kustomize generator used to produce.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fm.scriptsConfigMap }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
data:
  {{- range $script := list "sync-fork.sh" "subtree-mode.sh" "mapping-mode.sh" "backport.sh" "git-host.sh" "resolve-conflict.sh" "conflict-subscriber.py" "generate-manifest.sh" "verify-patches.sh" "divergence-track.sh" }}
  {{- $content := $.Files.Get (printf "fork-maintenance/scripts/%s" $script) }}
  {{- if not $content }}{{- fail (printf "engine payload missing or empty: fork-maintenance/scripts/%s (render-time guard, #368-3)" $script) }}{{- end }}
  {{ $script }}: |
    {{- $content | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fm.checksConfigMap }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
data:
  {{- range $check := list "validate-fork.sh" "gate-resolved.sh" }}
  {{- $content := $.Files.Get (printf "fork-maintenance/checks/%s" $check) }}
  {{- if not $content }}{{- fail (printf "engine payload missing or empty: fork-maintenance/checks/%s (render-time guard, #368-3)" $check) }}{{- end }}
  {{ $check }}: |
    {{- $content | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fm.hooksConfigMap }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
data:
  {{- range $hook := list "dapr.sh" "llama-cpp.sh" "signoz.sh" }}
  {{- $content := $.Files.Get (printf "fork-maintenance/hooks/%s" $hook) }}
  {{- if not $content }}{{- fail (printf "engine payload missing or empty: fork-maintenance/hooks/%s (render-time guard, #368-3)" $hook) }}{{- end }}
  {{ $hook }}: |
    {{- $content | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fm.defsConfigMap }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
data:
  {{- range $file, $content := $fm.defs }}
  {{- if not (trim $content) }}{{- fail (printf "forkMaintenance.defs.%s is empty — a def with no content renders a valid ConfigMap that fails inside sync-fork.sh (render-time guard, #368-3)" $file) }}{{- end }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fork-maintenance-skill
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: harmostes
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
data:
  {{- range $key, $path := dict "SKILL.md" "fork-maintenance/skill/SKILL.md" "conflict-resolution.md" "fork-maintenance/skill/references/conflict-resolution.md" "safeguards.md" "fork-maintenance/skill/references/safeguards.md" "architecture.md" "fork-maintenance/skill/references/architecture.md" }}
  {{- $content := $.Files.Get $path }}
  {{- if not $content }}{{- fail (printf "engine payload missing or empty: %s (render-time guard, #368-3)" $path) }}{{- end }}
  {{ $key }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
