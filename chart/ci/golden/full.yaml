# Source: harmostes/templates/dapr.yaml
# Dapr components — the deterministic event-system application layer. State for
# skip/dedup, pub/sub for choreography + observability. Reuse the cluster Valkey
# with an isolated DB (default 3) so harmostes never crosses llm-wiki (0/1) or
# fork-maintenance (2). Swap backends by changing these Component CRs only.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: valkey.llm-wiki.svc.cluster.local:6379
    - name: redisDB
      value: "3"
    # Flat keyspace shared by every harmostes app-id (worker writes evidence,
    # UI reads it). The default keyPrefix ("app") would namespace keys per
    # sidecar app-id — harmostes-worker-pool||k vs harmostes-ui||k — making
    # cross-app state invisible (live: /timeline saw present-empty for keys
    # the worker had written). "none" also drops TTL-bound markers in flight
    # once (skip/dedup re-arm at worst); timeline evidence is TTL-ephemeral
    # anyway.
    - name: keyPrefix
      value: "none"
    # ADR-0010 PR-lineage actor state (PRLineage||<repo>~<pr>): without
    # SOME store flagged actorStateStore, Dapr has NO actor state store —
    # every actor state access nil-panics in the sidecar (onGetActorState,
    # actors.go) and every lineage publish 500s. The dedicated store lives
    # below (keyPrefix none breaks save-actor-state on this runtime).

---
# Source: harmostes/templates/dapr.yaml
# Actor state store (ADR-0010): separate from the flat app store because
# Dapr's actor state path rejects keyPrefix none (save-actor-state 404s).
# keyPrefix "name" pins the prefix to the component name — static across
# attempt pods, so one PR's lineage is one shared actor entity.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: actorstore
  namespace: harmostes-ci
  labels:
    app.kubernetes.io/name: harmostes
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: valkey.llm-wiki.svc.cluster.local:6379
    - name: redisDB
      value: "3"
    - name: keyPrefix
      value: name
    - name: actorStateStore
      value: "true"

